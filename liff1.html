<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>意見・課程・FAQ｜實踐大學體育室</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}
body{background:linear-gradient(180deg,#eef7ff 0%,#f7f9fc 100%);color:#333}
.header{background:linear-gradient(135deg,#0066a1,#0089c9);color:#fff;padding:28px 20px 32px;text-align:center;border-radius:0 0 28px 28px;box-shadow:0 4px 15px rgba(0,0,0,.12)}
.logo{width:70px;height:70px;margin:0 auto 12px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0066a1;font-size:30px;font-weight:bold}
.header h1{margin:5px 0;font-size:23px}.header p{margin:7px 0 0;font-size:13px;opacity:.9}
.container{width:100%;max-width:520px;margin:0 auto;padding:18px 16px 40px}
.user{background:#fff;border-radius:14px;padding:12px 15px;margin-bottom:14px;box-shadow:0 3px 12px rgba(0,0,0,.05);font-size:13px;color:#666;text-align:center}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#06c755;margin-right:6px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}
.tab{border:0;background:#fff;padding:13px 5px;border-radius:12px;font-size:14px;font-weight:bold;color:#555;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;-webkit-tap-highlight-color:transparent}
.tab.active{background:#0066a1;color:#fff}
.panel{display:none;background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.panel.active{display:block}
.panel h2{margin:0 0 8px;font-size:19px}
.description{color:#777;font-size:13px;line-height:1.7;margin-bottom:15px}
.input{width:100%;border:1px solid #ddd;border-radius:11px;padding:12px;font-size:15px;outline:none;margin-bottom:10px;background:#fff;color:#333}
.input:focus{border-color:#1683c5;box-shadow:0 0 0 2px rgba(22,131,197,.08)}
textarea.input{min-height:130px;resize:vertical}
.button{width:100%;border:0;border-radius:11px;padding:13px;background:#0066a1;color:#fff;font-size:15px;font-weight:bold;cursor:pointer;-webkit-tap-highlight-color:transparent}
.button:active{transform:scale(.98)}.button:disabled{opacity:.55;cursor:not-allowed}
.message{margin-top:12px;padding:11px;border-radius:10px;background:#f2f7fa;color:#666;font-size:13px;line-height:1.6;display:none}
.message.show{display:block}.message.success{background:#eefaf3;color:#07883a}.message.error{background:#fff2f2;color:#c62828}
.result{margin-top:15px}
.card{background:#f8fafc;border-radius:13px;padding:14px;margin-bottom:10px;border-left:4px solid #1683c5}
.card-title{font-size:16px;font-weight:bold;margin-bottom:8px;color:#222}
.card-row{font-size:13px;color:#555;line-height:1.7}.card-row strong{color:#333}
.faq-card{border-left-color:#ef8b2c}.faq-question{font-weight:bold;margin-bottom:7px;font-size:15px}
.faq-answer{font-size:13px;line-height:1.8;color:#555;white-space:pre-wrap}
.loading{text-align:center;color:#888;padding:20px 5px;font-size:13px}
.empty{text-align:center;color:#999;padding:25px 5px;font-size:13px}
.footer{margin-top:25px;text-align:center;color:#999;font-size:12px;line-height:1.7}
.debug{margin-top:8px;font-size:11px;color:#aaa;text-align:center;word-break:break-all}
@media(max-width:360px){.container{padding-left:12px;padding-right:12px}.tab{font-size:13px}}
</style>
</head>

<body>
<div class="header">
  <div class="logo">體</div>
  <h1>意見・課程・FAQ</h1>
  <p>實踐大學體育室 LINE 智慧服務</p>
</div>

<div class="container">

  <div class="user">
    <span class="status-dot"></span>
    <span id="userStatus">正在載入服務...</span>
    <div id="debugStatus" class="debug"></div>
  </div>

  <div class="tabs">
    <button type="button" class="tab active" data-tab="course">📚 課程查詢</button>
    <button type="button" class="tab" data-tab="faq">❓ FAQ</button>
    <button type="button" class="tab" data-tab="feedback">📝 意見回饋</button>
  </div>

  <div id="coursePanel" class="panel active">
    <h2>📚 課程查詢</h2>
    <div class="description">可輸入課程代碼、課程名稱、教師、上課時間、地點或限選條件查詢。</div>
    <input id="courseKeyword" class="input" type="text" placeholder="例如：籃球、王老師、二1~2">
    <button id="courseButton" type="button" class="button">查詢課程</button>
    <div id="courseMessage" class="message"></div>
    <div id="courseResult" class="result"></div>
  </div>

  <div id="faqPanel" class="panel">
    <h2>❓ 常見問題 FAQ</h2>
    <div class="description">請輸入您想詢問的問題或關鍵字。</div>
    <input id="faqKeyword" class="input" type="text" placeholder="例如：重補修、體育3、體育4">
    <button id="faqButton" type="button" class="button">搜尋 FAQ</button>
    <div id="faqMessage" class="message"></div>
    <div id="faqResult" class="result"></div>
  </div>

  <div id="feedbackPanel" class="panel">
    <h2>📝 意見回饋</h2>
    <div class="description">如果您對體育室服務有任何問題或建議，歡迎留下您的資料與問題。</div>
    <input id="feedbackDepartment" class="input" type="text" placeholder="科系">
    <input id="feedbackGrade" class="input" type="text" placeholder="年級">
    <input id="feedbackStudentId" class="input" type="text" placeholder="學號">
    <input id="feedbackName" class="input" type="text" placeholder="姓名">
    <input id="feedbackEmail" class="input" type="email" placeholder="Email">
    <textarea id="feedbackQuestion" class="input" placeholder="請輸入您的問題或意見..."></textarea>
    <button id="feedbackButton" type="button" class="button">送出問題</button>
    <div id="feedbackMessage" class="message"></div>
  </div>

  <div class="footer">
    實踐大學體育室<br>
    LINE 智慧服務中心<br>
    © Shih Chien University
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
"use strict";

/* =========================================================
   固定設定
   ========================================================= */
const LIFF_ID = "2011040456-bmrz6CGx";
const API_URL = "https://script.google.com/macros/s/AKfycbyVC9tx_77XMGbNwhMrzITWlipAC34jg3sGdjem-3hv79GJHltTdceK5z2LzCyoXXxWlQ/exec";

let lineProfile = {
  userId: "",
  displayName: ""
};

/* =========================================================
   DOM 載入後才綁定事件
   ========================================================= */
document.addEventListener("DOMContentLoaded", function () {

  document.querySelectorAll(".tab").forEach(function (button) {
    button.addEventListener("click", function () {
      showTab(button.dataset.tab);
    });
  });

  document.getElementById("courseButton").addEventListener("click", searchCourse);
  document.getElementById("faqButton").addEventListener("click", searchFAQ);
  document.getElementById("feedbackButton").addEventListener("click", sendFeedback);

  document.getElementById("courseKeyword").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      searchCourse();
    }
  });

  document.getElementById("faqKeyword").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      searchFAQ();
    }
  });

  initLIFF();
});

/* =========================================================
   LIFF 初始化
   注意：LIFF 初始化失敗，不阻止 API 按鈕工作
   ========================================================= */
async function initLIFF() {
  const status = document.getElementById("userStatus");
  const debug = document.getElementById("debugStatus");

  try {
    status.textContent = "正在連線 LINE...";

    if (typeof liff === "undefined") {
      throw new Error("LIFF SDK 尚未載入");
    }

    await liff.init({ liffId: LIFF_ID });

    debug.textContent = "LIFF：初始化成功";

    if (!liff.isLoggedIn()) {
      status.textContent = "LINE 登入中...";
      liff.login({
        redirectUri: window.location.href
      });
      return;
    }

    try {
      const profile = await liff.getProfile();

      lineProfile.userId = profile.userId || "";
      lineProfile.displayName = profile.displayName || "LINE 使用者";

      status.textContent = "您好，" + lineProfile.displayName + " 👋";
    } catch (profileError) {
      status.textContent = "LINE 已連線";
      debug.textContent = "LIFF：已連線，但無法取得 Profile";
      console.error(profileError);
    }

  } catch (err) {
    console.error("LIFF 初始化錯誤：", err);
    status.textContent = "服務已開啟，可直接使用下方功能";
    debug.textContent = "LIFF：" + (err.message || String(err));
  }

  /* LIFF 不論成功或失敗，都測試 API */
  pingAPI();
}

/* =========================================================
   JSONP API
   ========================================================= */
function callAPI(params, callback) {

  const callbackName =
    "sportsLiffCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 1000000);

  const queryParams = Object.assign({}, params, {
    callback: callbackName
  });

  const query = Object.keys(queryParams)
    .map(function (key) {
      return encodeURIComponent(key) + "=" +
             encodeURIComponent(queryParams[key] == null ? "" : queryParams[key]);
    })
    .join("&");

  const script = document.createElement("script");
  let finished = false;

  const timeout = setTimeout(function () {
    if (finished) return;

    finished = true;
    cleanup();

    callback({
      success: false,
      error: "API 連線逾時，請確認 GAS Web App 是否正常部署。"
    });
  }, 20000);

  window[callbackName] = function (data) {
    if (finished) return;

    finished = true;
    clearTimeout(timeout);
    cleanup();

    callback(data);
  };

  function cleanup() {
    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callbackName];
    } catch (e) {
      window[callbackName] = undefined;
    }
  }

  script.onerror = function () {
    if (finished) return;

    finished = true;
    clearTimeout(timeout);
    cleanup();

    callback({
      success: false,
      error: "無法載入 GAS API。請確認 Web App 存取權限。"
    });
  };

  script.src = API_URL + "?" + query;
  script.async = true;

  document.head.appendChild(script);
}

/* =========================================================
   API 測試
   ========================================================= */
function pingAPI() {
  callAPI({ action: "ping" }, function (result) {
    const debug = document.getElementById("debugStatus");

    if (result && result.success) {
      debug.textContent = "LIFF / GAS API：連線正常";
      console.log("GAS ping OK", result);
    } else {
      debug.textContent =
        "GAS API：連線失敗 - " +
        ((result && result.error) ? result.error : "未知錯誤");
      console.error("GAS ping failed", result);
    }
  });
}

/* =========================================================
   分頁
   ========================================================= */
function showTab(name) {
  document.querySelectorAll(".panel").forEach(function (panel) {
    panel.classList.remove("active");
  });

  document.querySelectorAll(".tab").forEach(function (tab) {
    tab.classList.remove("active");
  });

  const panel = document.getElementById(name + "Panel");
  const tab = document.querySelector('.tab[data-tab="' + name + '"]');

  if (panel) panel.classList.add("active");
  if (tab) tab.classList.add("active");
}

/* =========================================================
   課程查詢
   ========================================================= */
function searchCourse() {
  const input = document.getElementById("courseKeyword");
  const button = document.getElementById("courseButton");
  const message = document.getElementById("courseMessage");
  const result = document.getElementById("courseResult");

  const keyword = input.value.trim();

  hideMessage(message);

  if (!keyword) {
    result.innerHTML = "";
    showMessage(message, "請輸入查詢關鍵字。", "error");
    input.focus();
    return;
  }

  button.disabled = true;
  button.textContent = "查詢中...";
  result.innerHTML = '<div class="loading">正在查詢課程...</div>';

  callAPI({
    action: "course",
    keyword: keyword
  }, function (data) {

    button.disabled = false;
    button.textContent = "查詢課程";

    if (!data || !data.success) {
      result.innerHTML = "";
      showMessage(
        message,
        data && data.error ? data.error : "課程查詢失敗。",
        "error"
      );
      return;
    }

    renderCourses(Array.isArray(data.data) ? data.data : []);
  });
}

/* =========================================================
   顯示課程
   ========================================================= */
function renderCourses(courses) {
  const box = document.getElementById("courseResult");

  if (!courses.length) {
    box.innerHTML = '<div class="empty">找不到符合條件的課程。</div>';
    return;
  }

  box.innerHTML = courses.map(function (course) {
    const code = escapeHTML(course.code);
    const name = escapeHTML(course.name);
    const teacher = escapeHTML(course.teacher);
    const time = escapeHTML(course.time);
    const location = escapeHTML(course.location || "未提供");
    const limit = escapeHTML(
      course.limit === undefined || course.limit === null || course.limit === ""
        ? "未提供"
        : course.limit
    );
    const note = escapeHTML(course.note);

    return (
      '<div class="card">' +
        '<div class="card-title">' +
          code +
          (name ? "｜" + name : "") +
        "</div>" +
        '<div class="card-row"><strong>教師：</strong>' + teacher + "</div>" +
        '<div class="card-row"><strong>時間：</strong>' + time + "</div>" +
        '<div class="card-row"><strong>地點：</strong>' + location + "</div>" +
        '<div class="card-row"><strong>名額：</strong>' + limit + "</div>" +
        (note ? '<div class="card-row"><strong>備註：</strong>' + note + "</div>" : "") +
      "</div>"
    );
  }).join("");
}

/* =========================================================
   FAQ
   ========================================================= */
function searchFAQ() {
  const input = document.getElementById("faqKeyword");
  const button = document.getElementById("faqButton");
  const message = document.getElementById("faqMessage");
  const result = document.getElementById("faqResult");

  const keyword = input.value.trim();

  hideMessage(message);

  if (!keyword) {
    result.innerHTML = "";
    showMessage(message, "請輸入 FAQ 關鍵字。", "error");
    input.focus();
    return;
  }

  button.disabled = true;
  button.textContent = "搜尋中...";
  result.innerHTML = '<div class="loading">正在搜尋 FAQ...</div>';

  callAPI({
    action: "faq",
    keyword: keyword
  }, function (data) {

    button.disabled = false;
    button.textContent = "搜尋 FAQ";

    if (!data || !data.success) {
      result.innerHTML = "";
      showMessage(
        message,
        data && data.error ? data.error : "FAQ 查詢失敗。",
        "error"
      );
      return;
    }

    renderFAQ(Array.isArray(data.data) ? data.data : []);
  });
}

/* =========================================================
   顯示 FAQ
   ========================================================= */
function renderFAQ(list) {
  const box = document.getElementById("faqResult");

  if (!list.length) {
    box.innerHTML = '<div class="empty">找不到符合條件的 FAQ。</div>';
    return;
  }

  box.innerHTML = list.map(function (item) {
    return (
      '<div class="card faq-card">' +
        '<div class="faq-question">❓ ' +
          escapeHTML(item.keyword) +
        "</div>" +
        '<div class="faq-answer">' +
          escapeHTML(item.answer) +
        "</div>" +
      "</div>"
    );
  }).join("");
}

/* =========================================================
   問題回饋
   ========================================================= */
function sendFeedback() {
  const button = document.getElementById("feedbackButton");
  const box = document.getElementById("feedbackMessage");

  const department = document.getElementById("feedbackDepartment").value.trim();
  const grade = document.getElementById("feedbackGrade").value.trim();
  const studentId = document.getElementById("feedbackStudentId").value.trim();
  const name = document.getElementById("feedbackName").value.trim();
  const email = document.getElementById("feedbackEmail").value.trim();
  const question = document.getElementById("feedbackQuestion").value.trim();

  hideMessage(box);

  if (!question) {
    showMessage(box, "請輸入您的問題或意見內容。", "error");
    document.getElementById("feedbackQuestion").focus();
    return;
  }

  button.disabled = true;
  button.textContent = "送出中...";

  callAPI({
    action: "feedback",
    department: department,
    grade: grade,
    studentId: studentId,
    name: name,
    email: email,
    question: question
  }, function (data) {

    button.disabled = false;
    button.textContent = "送出問題";

    if (!data || !data.success) {
      showMessage(
        box,
        data && data.error ? data.error : "問題送出失敗。",
        "error"
      );
      return;
    }

    showMessage(
      box,
      data.data && data.data.message
        ? data.data.message
        : "已收到您的問題，謝謝您的回饋！",
      "success"
    );

    document.getElementById("feedbackDepartment").value = "";
    document.getElementById("feedbackGrade").value = "";
    document.getElementById("feedbackStudentId").value = "";
    document.getElementById("feedbackName").value = "";
    document.getElementById("feedbackEmail").value = "";
    document.getElementById("feedbackQuestion").value = "";
  });
}

/* =========================================================
   訊息
   ========================================================= */
function showMessage(element, text, type) {
  if (!element) return;

  element.textContent = text;
  element.className = "message show " + (type || "");
}

function hideMessage(element) {
  if (!element) return;

  element.textContent = "";
  element.className = "message";
}

/* =========================================================
   HTML 安全處理
   ========================================================= */
function escapeHTML(value) {
  if (value === null || value === undefined) return "";

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
</script>
</body>
</html>
