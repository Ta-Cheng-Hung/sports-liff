<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>意見・課程・FAQ｜實踐大學體育室</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  background:
    linear-gradient(
      180deg,
      #eef7ff 0%,
      #f7f9fc 100%
    );

  color: #333;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.header {

  background:
    linear-gradient(
      135deg,
      #0066a1,
      #0089c9
    );

  color: white;

  padding: 26px 20px 30px;

  text-align: center;

  border-radius:
    0 0 28px 28px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.12);
}

.logo {

  width: 68px;
  height: 68px;

  margin: 0 auto 12px;

  background: white;

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #0066a1;

  font-size: 28px;

  font-weight: bold;
}

.header h1 {

  margin: 5px 0;

  font-size: 23px;
}

.header p {

  margin: 7px 0 0;

  font-size: 13px;

  opacity: .9;
}

.container {

  max-width: 520px;

  margin: auto;

  padding: 18px 16px 40px;
}

.user {

  background: white;

  border-radius: 14px;

  padding: 12px 15px;

  margin-bottom: 14px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);

  font-size: 13px;

  color: #666;
}

.tabs {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 8px;

  margin-bottom: 15px;
}

.tab {

  border: none;

  background: white;

  padding: 13px 5px;

  border-radius: 12px;

  font-size: 14px;

  font-weight: bold;

  color: #555;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.05);

  cursor: pointer;
}

.tab.active {

  background: #0066a1;

  color: white;
}

.panel {

  display: none;

  background: white;

  border-radius: 18px;

  padding: 18px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.06);
}

.panel.active {

  display: block;
}

.panel h2 {

  margin:
    0 0 8px;

  font-size: 19px;
}

.description {

  color: #777;

  font-size: 13px;

  line-height: 1.6;

  margin-bottom: 15px;
}

.input {

  width: 100%;

  border:
    1px solid #ddd;

  border-radius: 11px;

  padding: 12px;

  font-size: 15px;

  outline: none;

  margin-bottom: 10px;
}

.input:focus {

  border-color: #1683c5;
}

textarea.input {

  min-height: 130px;

  resize: vertical;
}

.button {

  width: 100%;

  border: none;

  border-radius: 11px;

  padding: 13px;

  background: #0066a1;

  color: white;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;
}

.button:active {

  transform: scale(.98);
}

.button:disabled {

  opacity: .55;

  cursor: not-allowed;
}

.message {

  margin-top: 12px;

  padding: 11px;

  border-radius: 10px;

  background: #f2f7fa;

  color: #666;

  font-size: 13px;

  line-height: 1.6;

  display: none;
}

.message.show {

  display: block;
}

.message.success {

  background: #eefaf3;

  color: #07883a;
}

.message.error {

  background: #fff2f2;

  color: #c62828;
}

.result {

  margin-top: 15px;
}

.card {

  background: #f8fafc;

  border-radius: 13px;

  padding: 14px;

  margin-bottom: 10px;

  border-left:
    4px solid #1683c5;
}

.card-title {

  font-size: 16px;

  font-weight: bold;

  margin-bottom: 8px;
}

.card-row {

  font-size: 13px;

  color: #555;

  line-height: 1.7;
}

.card-row strong {

  color: #333;
}

.faq-card {

  border-left-color: #ef8b2c;
}

.faq-question {

  font-weight: bold;

  margin-bottom: 7px;

  font-size: 15px;
}

.faq-answer {

  font-size: 13px;

  line-height: 1.8;

  color: #555;

  white-space: pre-wrap;
}

.loading {

  text-align: center;

  color: #888;

  padding: 20px 5px;

  font-size: 13px;
}

.empty {

  text-align: center;

  color: #999;

  padding: 25px 5px;

  font-size: 13px;
}

.footer {

  margin-top: 25px;

  text-align: center;

  color: #999;

  font-size: 12px;

  line-height: 1.7;
}

</style>

</head>


<body>


<div class="header">

  <div class="logo">
    體
  </div>

  <h1>
    意見・課程・FAQ
  </h1>

  <p>
    實踐大學體育室 LINE 智慧服務
  </p>

</div>


<div class="container">


<div class="user">

  <span id="userStatus">
    正在初始化 LINE 使用者...
  </span>

</div>


<div class="tabs">

  <button
    class="tab active"
    onclick="showTab('course')"
  >
    📚 課程查詢
  </button>

  <button
    class="tab"
    onclick="showTab('faq')"
  >
    ❓ FAQ
  </button>

  <button
    class="tab"
    onclick="showTab('feedback')"
  >
    📝 意見回饋
  </button>

</div>


<!-- =====================================
     課程查詢
===================================== -->

<div
  id="coursePanel"
  class="panel active"
>

  <h2>
    📚 課程查詢
  </h2>

  <div class="description">

    可輸入課程代碼、課程名稱、
    教師或上課時間查詢。

  </div>

  <input
    id="courseKeyword"
    class="input"
    type="text"
    placeholder="例如：體育、籃球、王老師、星期一"
    onkeydown="courseEnter(event)"
  >

  <button
    id="courseButton"
    class="button"
    onclick="searchCourse()"
  >
    查詢課程
  </button>

  <div
    id="courseMessage"
    class="message"
  ></div>

  <div
    id="courseResult"
    class="result"
  ></div>

</div>


<!-- =====================================
     FAQ
===================================== -->

<div
  id="faqPanel"
  class="panel"
>

  <h2>
    ❓ 常見問題 FAQ
  </h2>

  <div class="description">

    請輸入您想詢問的問題或關鍵字。

  </div>

  <input
    id="faqKeyword"
    class="input"
    type="text"
    placeholder="例如：體育課、請假、場館、選課"
    onkeydown="faqEnter(event)"
  >

  <button
    id="faqButton"
    class="button"
    onclick="searchFAQ()"
  >
    搜尋 FAQ
  </button>

  <div
    id="faqMessage"
    class="message"
  ></div>

  <div
    id="faqResult"
    class="result"
  ></div>

</div>


<!-- =====================================
     意見回饋
===================================== -->

<div
  id="feedbackPanel"
  class="panel"
>

  <h2>
    📝 意見回饋
  </h2>

  <div class="description">

    如果您對體育室服務有任何建議，
    歡迎留下您的意見。

  </div>

  <input
    id="feedbackName"
    class="input"
    type="text"
    placeholder="您的姓名（選填）"
  >

  <textarea
    id="feedbackMessage"
    class="input"
    placeholder="請輸入您的意見或建議..."
  ></textarea>

  <button
    id="feedbackButton"
    class="button"
    onclick="sendFeedback()"
  >
    送出意見
  </button>

  <div
    id="feedbackMessageBox"
    class="message"
  ></div>

</div>


<div class="footer">

  實踐大學體育室

  <br>

  LINE 智慧服務中心

  <br>

  © Shih Chien University

</div>


</div>


<!-- =====================================
     LIFF SDK
===================================== -->

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<script>

/* ========================================
   設定
======================================== */

const LIFF_ID =
  '2011040456-bmrz6CGx';


const API_URL =
  'https://script.google.com/macros/s/AKfycbxRW1256ehsmyHzLYQT1RsbeAq0h2bg1ZeaUKIF71KgVdeD5FaS8wpteJ1mc0q9CDLKwg/exec';


let lineProfile = {

  userId: '',

  displayName: ''

};


/* ========================================
   初始化
======================================== */

window.addEventListener(
  'load',
  initLIFF
);


async function initLIFF() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });


    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }


    const profile =
      await liff.getProfile();


    lineProfile.userId =
      profile.userId || '';


    lineProfile.displayName =
      profile.displayName || '';


    document.getElementById(
      'userStatus'
    ).textContent =
      '您好，' +
      lineProfile.displayName +
      ' 👋';


    pingAPI();


  } catch (err) {

    console.error(err);

    document.getElementById(
      'userStatus'
    ).textContent =
      'LINE 初始化失敗，請重新開啟此服務。';

  }

}


/* ========================================
   API JSONP
======================================== */

function callAPI(
  params,
  callback
) {

  const callbackName =
    'apiCallback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );


  params.callback =
    callbackName;


  const query =
    Object.keys(params)

      .map(function(key) {

        return (
          encodeURIComponent(key) +
          '=' +
          encodeURIComponent(
            params[key]
          )
        );

      })

      .join('&');


  const script =
    document.createElement(
      'script'
    );


  const timeout =
    setTimeout(
      function() {

        cleanup();

        callback({
          success: false,
          error: 'API 連線逾時'
        });

      },
      15000
    );


  window[callbackName] =
    function(data) {

      clearTimeout(timeout);

      cleanup();

      callback(data);

    };


  function cleanup() {

    if (script.parentNode) {

      script.parentNode.removeChild(
        script
      );

    }

    try {

      delete window[callbackName];

    } catch (e) {

      window[callbackName] =
        undefined;

    }

  }


  script.onerror =
    function() {

      clearTimeout(timeout);

      cleanup();

      callback({
        success: false,
        error: '無法連線至 API'
      });

    };


  script.src =
    API_URL + '?' + query;


  document.body.appendChild(
    script
  );

}


/* ========================================
   API 測試
======================================== */

function pingAPI() {

  callAPI(
    {
      action: 'ping'
    },

    function(result) {

      console.log(
        'LIFF 1 API:',
        result
      );

    }
  );

}


/* ========================================
   Tabs
======================================== */

function showTab(name) {

  const panels =
    document.querySelectorAll(
      '.panel'
    );


  panels.forEach(
    function(panel) {

      panel.classList.remove(
        'active'
      );

    }
  );


  const tabs =
    document.querySelectorAll(
      '.tab'
    );


  tabs.forEach(
    function(tab) {

      tab.classList.remove(
        'active'
      );

    }
  );


  document
    .getElementById(
      name + 'Panel'
    )
    .classList.add(
      'active'
    );


  const index = {

    course: 0,

    faq: 1,

    feedback: 2

  };


  tabs[
    index[name]
  ].classList.add(
    'active'
  );

}


/* ========================================
   課程查詢
======================================== */

function courseEnter(event) {

  if (
    event.key === 'Enter'
  ) {

    searchCourse();

  }

}


function searchCourse() {

  const keyword =
    document
      .getElementById(
        'courseKeyword'
      )
      .value
      .trim();


  const resultBox =
    document
      .getElementById(
        'courseResult'
      );


  const messageBox =
    document
      .getElementById(
        'courseMessage'
      );


  if (!keyword) {

    showMessage(
      messageBox,
      '請輸入查詢關鍵字。',
      'error'
    );

    return;

  }


  const button =
    document
      .getElementById(
        'courseButton'
      );


  button.disabled = true;

  button.textContent =
    '查詢中...';


  resultBox.innerHTML =
    '<div class="loading">正在查詢課程...</div>';


  messageBox.className =
    'message';


  callAPI(

    {
      action: 'course',

      keyword: keyword

    },

    function(result) {

      button.disabled = false;

      button.textContent =
        '查詢課程';


      if (
        !result ||
        !result.success
      ) {

        resultBox.innerHTML = '';

        showMessage(
          messageBox,
          result &&
          result.error
            ? result.error
            : '課程查詢失敗。',
          'error'
        );

        return;

      }


      renderCourses(
        result.data || []
      );

    }

  );

}


/* ========================================
   顯示課程
======================================== */

function renderCourses(
  courses
) {

  const box =
    document.getElementById(
      'courseResult'
    );


  if (!courses.length) {

    box.innerHTML =
      '<div class="empty">' +
      '找不到符合條件的課程。' +
      '</div>';

    return;

  }


  box.innerHTML =
    courses
      .map(
        function(course) {

          return `

<div class="card">

  <div class="card-title">

    ${escapeHTML(
      course.code
    )}

    ${escapeHTML(
      course.name
        ? '｜' + course.name
        : ''
    )}

  </div>

  <div class="card-row">

    <strong>教師：</strong>

    ${escapeHTML(
      course.teacher
    )}

  </div>

  <div class="card-row">

    <strong>時間：</strong>

    ${escapeHTML(
      course.time
    )}

  </div>

  <div class="card-row">

    <strong>地點：</strong>

    ${escapeHTML(
      course.location
    )}

  </div>

  <div class="card-row">

    <strong>名額：</strong>

    ${escapeHTML(
      String(course.limit)
    )}

  </div>

  ${
    course.note
      ? `
  <div class="card-row">

    <strong>備註：</strong>

    ${escapeHTML(
      course.note
    )}

  </div>
  `
      : ''
  }

</div>

`;

        }
      )
      .join('');

}


/* ========================================
   FAQ
======================================== */

function faqEnter(event) {

  if (
    event.key === 'Enter'
  ) {

    searchFAQ();

  }

}


function searchFAQ() {

  const keyword =
    document
      .getElementById(
        'faqKeyword'
      )
      .value
      .trim();


  const resultBox =
    document
      .getElementById(
        'faqResult'
      );


  const messageBox =
    document
      .getElementById(
        'faqMessage'
      );


  if (!keyword) {

    showMessage(
      messageBox,
      '請輸入 FAQ 關鍵字。',
      'error'
    );

    return;

  }


  const button =
    document
      .getElementById(
        'faqButton'
      );


  button.disabled = true;

  button.textContent =
    '搜尋中...';


  resultBox.innerHTML =
    '<div class="loading">正在搜尋 FAQ...</div>';


  messageBox.className =
    'message';


  callAPI(

    {
      action: 'faq',

      keyword: keyword

    },

    function(result) {

      button.disabled = false;

      button.textContent =
        '搜尋 FAQ';


      if (
        !result ||
        !result.success
      ) {

        resultBox.innerHTML = '';

        showMessage(
          messageBox,
          result &&
          result.error
            ? result.error
            : 'FAQ 查詢失敗。',
          'error'
        );

        return;

      }


      renderFAQ(
        result.data || []
      );

    }

  );

}


/* ========================================
   顯示 FAQ
======================================== */

function renderFAQ(
  list
) {

  const box =
    document.getElementById(
      'faqResult'
    );


  if (!list.length) {

    box.innerHTML =
      '<div class="empty">' +
      '找不到符合條件的 FAQ。' +
      '</div>';

    return;

  }


  box.innerHTML =
    list
      .map(
        function(item) {

          return `

<div class="card faq-card">

  <div class="faq-question">

    ❓

    ${escapeHTML(
      item.keyword
    )}

  </div>

  <div class="faq-answer">

    ${escapeHTML(
      item.answer
    )}

  </div>

</div>

`;

        }
      )
      .join('');

}


/* ========================================
   意見回饋
======================================== */

function sendFeedback() {

  const name =
    document
      .getElementById(
        'feedbackName'
      )
      .value
      .trim();


  const message =
    document
      .getElementById(
        'feedbackMessage'
      )
      .value
      .trim();


  const box =
    document
      .getElementById(
        'feedbackMessageBox'
      );


  if (!message) {

    showMessage(
      box,
      '請輸入您的意見內容。',
      'error'
    );

    return;

  }


  if (
    !lineProfile.userId
  ) {

    showMessage(
      box,
      '尚未取得 LINE 使用者資料，請重新開啟。',
      'error'
    );

    return;

  }


  const button =
    document
      .getElementById(
        'feedbackButton'
      );


  button.disabled = true;

  button.textContent =
    '送出中...';


  box.className =
    'message';


  callAPI(

    {

      action: 'feedback',

      userId:
        lineProfile.userId,

      name:
        name,

      message:
        message

    },

    function(result) {

      button.disabled = false;

      button.textContent =
        '送出意見';


      if (
        !result ||
        !result.success
      ) {

        showMessage(
          box,
          result &&
          result.error
            ? result.error
            : '意見送出失敗。',
          'error'
        );

        return;

      }


      showMessage(
        box,
        result.message ||
        '已收到您的意見，謝謝您的回饋！',
        'success'
      );


      document
        .getElementById(
          'feedbackName'
        )
        .value = '';


      document
        .getElementById(
          'feedbackMessage'
        )
        .value = '';

    }

  );

}


/* ========================================
   Message
======================================== */

function showMessage(
  element,
  text,
  type
) {

  element.textContent =
    text;


  element.className =
    'message show ' +
    (type || '');

}


/* ========================================
   HTML 安全處理
======================================== */

function escapeHTML(
  value
) {

  return String(
    value === null ||
    value === undefined
      ? ''
      : value
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}

</script>

</body>

</html>
