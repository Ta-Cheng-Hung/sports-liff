<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>實踐大學體育室</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #f4f8fb;
      color: #333;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
    }

    .header {
      background: linear-gradient(
        135deg,
        #0066a1,
        #0089c9
      );

      color: white;

      padding: 30px 20px;

      text-align: center;

      border-radius:
        0 0 25px 25px;
    }

    .logo {
      width: 70px;
      height: 70px;

      margin: 0 auto 12px;

      background: white;

      color: #0066a1;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      margin: 5px 0;
      font-size: 23px;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 13px;
      opacity: .9;
    }

    .container {
      width: 100%;
      max-width: 520px;

      margin: 0 auto;

      padding: 18px 16px 40px;
    }

    .status {
      background: white;

      border-radius: 14px;

      padding: 15px;

      margin-bottom: 15px;

      text-align: center;

      box-shadow:
        0 3px 12px rgba(0,0,0,.06);

      font-size: 14px;
    }

    .status-dot {
      display: inline-block;

      width: 9px;
      height: 9px;

      margin-right: 6px;

      border-radius: 50%;

      background: #999;
    }

    .status-dot.ok {
      background: #06c755;
    }

    .card {
      background: white;

      border-radius: 18px;

      padding: 20px;

      margin-bottom: 14px;

      box-shadow:
        0 3px 12px rgba(0,0,0,.06);
    }

    .card h2 {
      margin: 0 0 10px;

      font-size: 19px;
    }

    .card p {
      margin: 0 0 15px;

      color: #666;

      font-size: 14px;

      line-height: 1.7;
    }

    button {
      width: 100%;

      border: none;

      border-radius: 11px;

      padding: 13px;

      background: #0066a1;

      color: white;

      font-size: 15px;

      font-weight: bold;
    }

    .debug {
      margin-top: 15px;

      padding: 12px;

      background: #f1f3f5;

      border-radius: 10px;

      font-size: 12px;

      line-height: 1.7;

      word-break: break-all;

      color: #666;
    }

    .footer {
      text-align: center;

      margin-top: 20px;

      color: #999;

      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="header">

    <div class="logo">
      體
    </div>

    <h1>
      實踐大學體育室
    </h1>

    <div class="subtitle">
      LINE 智慧服務
    </div>

  </div>


  <div class="container">

    <div class="status">

      <span
        id="statusDot"
        class="status-dot"
      ></span>

      <span id="status">
        正在啟動 LIFF...
      </span>

    </div>


    <div class="card">

      <h2>
        📚 課程查詢
      </h2>

      <p>
        查詢體育課程、教師、時間及上課地點。
      </p>

      <button
        type="button"
        onclick="testMessage('課程查詢')"
      >
        開啟課程查詢
      </button>

    </div>


    <div class="card">

      <h2>
        ❓ FAQ
      </h2>

      <p>
        查詢體育室常見問題。
      </p>

      <button
        type="button"
        onclick="testMessage('FAQ')"
      >
        開啟 FAQ
      </button>

    </div>


    <div class="card">

      <h2>
        📝 意見回饋
      </h2>

      <p>
        提供問題、建議或服務意見。
      </p>

      <button
        type="button"
        onclick="testMessage('意見回饋')"
      >
        開啟意見回饋
      </button>

    </div>


    <div
      id="debug"
      class="debug"
    >
      LIFF 初始化中...
    </div>


    <div class="footer">
      實踐大學體育室
      <br>
      LINE 智慧服務中心
    </div>

  </div>


  <!-- ==============================
       LINE LIFF SDK
       ============================== -->

  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js"
  ></script>


  <script>

    const LIFF_ID =
      "2011040456-bmrz6CGx";


    const statusElement =
      document.getElementById("status");


    const statusDot =
      document.getElementById("statusDot");


    const debugElement =
      document.getElementById("debug");


    function setStatus(
      text,
      success
    ) {

      statusElement.textContent =
        text;


      if (success) {

        statusDot.classList.add(
          "ok"
        );

      }

    }


    async function initLIFF() {

      try {

        debugElement.textContent =
          "1. LIFF SDK 已載入";


        if (
          typeof liff === "undefined"
        ) {

          throw new Error(
            "LIFF SDK 載入失敗"
          );

        }


        debugElement.textContent =
          "2. 正在執行 liff.init()";


        await liff.init({

          liffId:
            LIFF_ID

        });


        debugElement.textContent =
          "3. LIFF 初始化成功";


        setStatus(
          "LIFF 已連線",
          true
        );


        /*
         * LINE App 內
         */

        if (
          liff.isInClient()
        ) {

          setStatus(
            "LINE LIFF 已正常啟動",
            true
          );


          debugElement.textContent =
            "4. 執行環境：LINE App";


          /*
           * 嘗試取得 Profile
           */

          try {

            const profile =
              await liff.getProfile();


            debugElement.textContent =
              "5. LINE 使用者：" +
              profile.displayName;

          }

          catch (profileError) {

            debugElement.textContent =
              "5. LIFF 正常，但無法取得 Profile：" +
              profileError.message;

          }


          return;

        }


        /*
         * 外部瀏覽器
         */

        debugElement.textContent =
          "4. 執行環境：外部瀏覽器";


        if (
          !liff.isLoggedIn()
        ) {

          setStatus(
            "請登入 LINE",
            false
          );


          debugElement.textContent =
            "5. 尚未登入，準備 LINE Login";


          liff.login({

            redirectUri:
              window.location.href

          });


          return;

        }


        setStatus(
          "LINE 登入成功",
          true
        );


        debugElement.textContent =
          "5. 外部瀏覽器 LINE Login 成功";


      }

      catch (error) {

        console.error(
          "LIFF ERROR:",
          error
        );


        setStatus(
          "LIFF 啟動失敗",
          false
        );


        debugElement.textContent =
          "錯誤：" +
          (
            error &&
            error.message
              ? error.message
              : String(error)
          );

      }

    }


    function testMessage(
      name
    ) {

      alert(
        name +
        " 按鈕正常。"
      );

    }


    window.addEventListener(
      "load",
      initLIFF
    );

  </script>

</body>
</html>
