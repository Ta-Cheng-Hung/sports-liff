<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>意見・課程・FAQ｜實踐大學體育室</title>


<style>

/* ==========================================
   基本設定
   ========================================== */

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  background:
    linear-gradient(
      180deg,
      #eef7ff 0%,
      #f7f9fc 100%
    );

  color: #333;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}


/* ==========================================
   Header
   ========================================== */

.header {

  background:
    linear-gradient(
      135deg,
      #0066a1,
      #0089c9
    );

  color: white;

  padding:
    26px
    20px
    30px;

  text-align: center;

  border-radius:
    0
    0
    28px
    28px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.12);

}


.logo {

  width: 68px;

  height: 68px;

  margin:
    0
    auto
    12px;

  background: white;

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #0066a1;

  font-size: 28px;

  font-weight: bold;

}


.header h1 {

  margin:
    5px
    0;

  font-size: 23px;

}


.header p {

  margin:
    7px
    0
    0;

  font-size: 13px;

  opacity: .9;

}


/* ==========================================
   Container
   ========================================== */

.container {

  max-width: 520px;

  margin: auto;

  padding:
    18px
    16px
    40px;

}


/* ==========================================
   User
   ========================================== */

.user {

  background: white;

  border-radius: 14px;

  padding:
    12px
    15px;

  margin-bottom: 14px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);

  font-size: 13px;

  color: #666;

}


/* ==========================================
   Tabs
   ========================================== */

.tabs {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 8px;

  margin-bottom: 15px;

}


.tab {

  border: none;

  background: white;

  padding:
    13px
    5px;

  border-radius: 12px;

  font-size: 14px;

  font-weight: bold;

  color: #555;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.05);

  cursor: pointer;

}


.tab.active {

  background: #0066a1;

  color: white;

}


/* ==========================================
   Panel
   ========================================== */

.panel {

  display: none;

  background: white;

  border-radius: 18px;

  padding: 18px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.06);

}


.panel.active {

  display: block;

}


.panel h2 {

  margin:
    0
    0
    8px;

  font-size: 19px;

}


.description {

  color: #777;

  font-size: 13px;

  line-height: 1.6;

  margin-bottom: 15px;

}


/* ==========================================
   Input
   ========================================== */

.input {

  width: 100%;

  border:
    1px
    solid
    #ddd;

  border-radius: 11px;

  padding: 12px;

  font-size: 15px;

  outline: none;

  margin-bottom: 10px;

}


.input:focus {

  border-color: #1683c5;

}


textarea.input {

  min-height: 130px;

  resize: vertical;

}


/* ==========================================
   Button
   ========================================== */

.button {

  width: 100%;

  border: none;

  border-radius: 11px;

  padding: 13px;

  background: #0066a1;

  color: white;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;

}


.button:active {

  transform: scale(.98);

}


.button:disabled {

  opacity: .55;

  cursor: not-allowed;

}


/* ==========================================
   Message
   ========================================== */

.message {

  margin-top: 12px;

  padding: 11px;

  border-radius: 10px;

  background: #f2f7fa;

  color: #666;

  font-size: 13px;

  line-height: 1.6;

  display: none;

}


.message.show {

  display: block;

}


.message.success {

  background: #eefaf3;

  color: #07883a;

}


.message.error {

  background: #fff2f2;

  color: #c62828;

}


/* ==========================================
   Result
   ========================================== */

.result {

  margin-top: 15px;

}


/* ==========================================
   Card
   ========================================== */

.card {

  background: #f8fafc;

  border-radius: 13px;

  padding: 14px;

  margin-bottom: 10px;

  border-left:
    4px
    solid
    #1683c5;

}


.card-title {

  font-size: 16px;

  font-weight: bold;

  margin-bottom: 8px;

}


.card-row {

  font-size: 13px;

  color: #555;

  line-height: 1.7;

}


.card-row strong {

  color: #333;

}


/* ==========================================
   FAQ
   ========================================== */

.faq-card {

  border-left-color: #ef8b2c;

}


.faq-question {

  font-weight: bold;

  margin-bottom: 7px;

  font-size: 15px;

}


.faq-answer {

  font-size: 13px;

  line-height: 1.8;

  color: #555;

  white-space: pre-wrap;

}


/* ==========================================
   Loading
   ========================================== */

.loading {

  text-align: center;

  color: #888;

  padding:
    20px
    5px;

  font-size: 13px;

}


/* ==========================================
   Empty
   ========================================== */

.empty {

  text-align: center;

  color: #999;

  padding:
    25px
    5px;

  font-size: 13px;

}


/* ==========================================
   Footer
   ========================================== */

.footer {

  margin-top: 25px;

  text-align: center;

  color: #999;

  font-size: 12px;

  line-height: 1.7;

}

</style>

</head>


<body>


<!-- ==========================================
     Header
     ========================================== -->

<div class="header">

  <div class="logo">
    體
  </div>

  <h1>
    意見・課程・FAQ
  </h1>

  <p>
    實踐大學體育室 LINE 智慧服務
  </p>

</div>


<div class="container">


<!-- ==========================================
     LINE 使用者
     ========================================== -->

<div class="user">

  <span id="userStatus">
    正在初始化 LINE 使用者...
  </span>

</div>


<!-- ==========================================
     Tabs
     ========================================== -->

<div class="tabs">

  <button
    class="tab active"
    onclick="showTab('course')"
  >
    📚 課程查詢
  </button>


  <button
    class="tab"
    onclick="showTab('faq')"
  >
    ❓ FAQ
  </button>


  <button
    class="tab"
    onclick="showTab('feedback')"
  >
    📝 意見回饋
  </button>

</div>


<!-- ==========================================
     課程查詢
     ========================================== -->

<div
  id="coursePanel"
  class="panel active"
>

  <h2>
    📚 課程查詢
  </h2>


  <div class="description">

    可輸入課程代碼、課程名稱、
    教師、上課時間、地點或限選條件查詢。

  </div>


  <input

    class="input"
    type="text"

    onkeydown="courseEnter(event)"
  >


  <button
    id="courseButton"
    class="button"
    onclick="searchCourse()"
  >
    查詢課程
  </button>


  <div
    id="courseMessage"
    class="message"
  ></div>


  <div
    id="courseResult"
    class="result"
  ></div>

</div>


<!-- ==========================================
     FAQ
     ========================================== -->

<div
  id="faqPanel"
  class="panel"
>

  <h2>
    ❓ 常見問題 FAQ
  </h2>


  <div class="description">

    請輸入您想詢問的問題或關鍵字。

  </div>

    class="button"
    onclick="searchFAQ()"

  </button>

    class="message"
  ></div>


  <div
    id="faqResult"

<!-- ==========================================

     ========================================== -->

<div
  id="feedbackPanel"
  class="panel"
>

  <h2>
    📝 意見回饋
  </h2>


  <div class="description">

    如果您對體育室服務有任何問題或建議，

  <input

  <input
    id="feedbackGrade"

  <input

  <button

    class="button"

  <div

    class="message"
  ></div>

</div>


<!-- ==========================================
     Footer
     ========================================== -->

<div class="footer">

  實踐大學體育室

  <br>

  LINE 智慧服務中心

  <br>

  © Shih Chien University

</div>


</div>


<!-- ==========================================
     LIFF SDK
     ========================================== -->

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<script>


/* ==========================================
   設定
   ========================================== */


const LIFF_ID =
  '2011040456-bmrz6CGx';


/*
 * 這裡已經改成你剛剛測試成功的
 * GAS ② API
 */

const API_URL =
  'https://script.google.com/macros/s/AKfycbxXooVgRx7_JPDS7TqdkXDU86PwEAL81rHQtQY_oI4X3avgzwNbAPeaXtYO5A996fyZ5g/exec';


/*
 * LINE 使用者資料
 */

let lineProfile = {

  userId: '',

  displayName: ''

};


/* ==========================================
   初始化
   ========================================== */


window.addEventListener(
  'load',
  initLIFF
);


async function initLIFF() {

  try {

    /*
     * 初始化 LIFF
     */

    await liff.init({

      liffId:
        LIFF_ID

    });


    /*
     * 如果尚未登入
     */

    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }


    /*
     * 取得 LINE Profile
     */

    const profile =
      await liff.getProfile();


    lineProfile.userId =
      profile.userId || '';


    lineProfile.displayName =
      profile.displayName || '';


    /*
     * 顯示使用者名稱
     */

    document
      .getElementById(
        'userStatus'
      )
      .textContent =
        '您好，' +
        lineProfile.displayName +
        ' 👋';


    /*
     * 測試 API
     */

    pingAPI();


  } catch (err) {

    console.error(
      'LIFF 初始化錯誤：',
      err
    );


    document
      .getElementById(
        'userStatus'
      )
      .textContent =
        'LINE 初始化失敗，請重新開啟此服務。';

  }

}


/* ==========================================
   API JSONP
   ========================================== */


function callAPI(
  params,
  callback
) {

  /*
   * 建立唯一 callback 名稱
   */

  const callbackName =
    'apiCallback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );


  /*
   * 加入 callback
   */

  params.callback =
    callbackName;


  /*
   * 建立 Query String
   */

  const query =
    Object.keys(params)

      .map(
        function(key) {

          return (
            encodeURIComponent(key) +
            '=' +
            encodeURIComponent(
              params[key]
            )
          );

        }
      )

      .join('&');


  /*
   * 建立 Script
   */

  const script =
    document.createElement(
      'script'
    );


  /*
   * 15 秒逾時
   */

  const timeout =
    setTimeout(
      function() {

        cleanup();

        callback({

          success: false,

          error:
            'API 連線逾時'

        });

      },
      15000
    );


  /*
   * JSONP callback
   */

  window[callbackName] =
    function(data) {

      clearTimeout(timeout);

      cleanup();

      callback(data);

    };


  /*
   * 清除 callback / script
   */

  function cleanup() {

    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }


    try {

      delete window[
        callbackName
      ];

    } catch (e) {

      window[
        callbackName
      ] = undefined;

    }

  }


  /*
   * Script 載入錯誤
   */

  script.onerror =
    function() {

      clearTimeout(timeout);

      cleanup();

      callback({

        success: false,

        error:
          '無法連線至 API'

      });

    };


  /*
   * API URL
   */

  script.src =
    API_URL +
    '?' +
    query;


  /*
   * 加入頁面
   */

  document.body.appendChild(
    script
  );

}


/* ==========================================
   API 測試
   ========================================== */


function pingAPI() {

  callAPI(

    {

      action:
        'ping'

    },

    function(result) {

      console.log(
        'LIFF 1 API：',
        result
      );


      /*
       * API 正常
       */

      if (
        result &&
        result.success
      ) {

        console.log(
          'GAS ② API 連線成功'
        );

      } else {

        console.error(
          'GAS ② API 回應錯誤：',
          result
        );

      }

    }

  );

}


/* ==========================================
   Tabs
   ========================================== */


function showTab(name) {

  /*
   * 隱藏所有 Panel
   */

  const panels =
    document.querySelectorAll(
      '.panel'
    );


  panels.forEach(
    function(panel) {

      panel.classList.remove(
        'active'
      );

    }
  );


  /*
   * 移除所有 Tab active
   */

  const tabs =
    document.querySelectorAll(
      '.tab'
    );


  tabs.forEach(
    function(tab) {

      tab.classList.remove(
        'active'
      );

    }
  );


  /*
   * 顯示指定 Panel
   */

  document
    .getElementById(
      name + 'Panel'
    )
    .classList.add(
      'active'
    );


  /*
   * Tab 對應位置
   */

  const index = {

    course: 0,

    faq: 1,

    feedback: 2

  };


  tabs[
    index[name]
  ].classList.add(
    'active'
  );

}


/* ==========================================
   課程 Enter
   ========================================== */


function courseEnter(event) {

  if (
    event.key === 'Enter'
  ) {

    searchCourse();

  }

}


/* ==========================================
   課程查詢
   ========================================== */


function searchCourse() {

  const keyword =
    document
      .getElementById(
        'courseKeyword'
      )
      .value
      .trim();


  const resultBox =
    document
      .getElementById(
        'courseResult'
      );


  const messageBox =
    document
      .getElementById(
        'courseMessage'
      );


  /*
   * 沒有輸入關鍵字
   */

  if (!keyword) {

    showMessage(

      messageBox,

      '請輸入查詢關鍵字。',

      'error'

    );

    return;

  }


  /*
   * 查詢按鈕
   */

  const button =
    document
      .getElementById(
        'courseButton'
      );


  button.disabled = true;

  button.textContent =
    '查詢中...';


  /*
   * 顯示 Loading
   */

  resultBox.innerHTML =
    '<div class="loading">' +
    '正在查詢課程...' +
    '</div>';


  messageBox.className =
    'message';


  /*
   * 呼叫 GAS
   */

  callAPI(

    {

      action:
        'course',

      keyword:
        keyword

    },

    function(result) {

      button.disabled = false;

      button.textContent =
        '查詢課程';


      /*
       * API 失敗
       */

      if (
        !result ||
        !result.success
      ) {

        resultBox.innerHTML =
          '';

        showMessage(

          messageBox,

          result &&
          result.error
            ? result.error
            : '課程查詢失敗。',

          'error'

        );

        return;

      }


      /*
       * 顯示結果
       */

      renderCourses(
        result.data || []
      );

    }

  );

}


/* ==========================================
   顯示課程
   ========================================== */


function renderCourses(
  courses
) {

  const box =
    document
      .getElementById(
        'courseResult'
      );


  /*
   * 無結果
   */

  if (!courses.length) {

    box.innerHTML =
      '<div class="empty">' +
      '找不到符合條件的課程。' +
      '</div>';

    return;

  }


  /*
   * 顯示課程
   */

  box.innerHTML =
    courses

      .map(
        function(course) {

          return `

<div class="card">

  <div class="card-title">

    ${escapeHTML(
      course.code
    )}

    ${
      course.name
        ? '｜' +
          escapeHTML(
            course.name
          )
        : ''
    }

  </div>


  <div class="card-row">

    <strong>
      教師：
    </strong>

    ${escapeHTML(
      course.teacher
    )}

  </div>


  <div class="card-row">

    <strong>
      時間：
    </strong>

    ${escapeHTML(
      course.time
    )}

  </div>


  <div class="card-row">

    <strong>
      地點：
    </strong>

    ${escapeHTML(
      course.location
    )}

  </div>


  <div class="card-row">

    <strong>
      名額：
    </strong>

    ${escapeHTML(
      String(
        course.limit
      )
    )}

  </div>


  ${
    course.note
      ? `

  <div class="card-row">

    <strong>
      備註：
    </strong>

    ${escapeHTML(
      course.note
    )}

  </div>

      `
      : ''
  }

</div>

`;

        }
      )

      .join('');

}


/* ==========================================
   FAQ Enter
   ========================================== */


function faqEnter(event) {

  if (
    event.key === 'Enter'
  ) {

    searchFAQ();

  }

}


/* ==========================================
   FAQ 查詢
   ========================================== */


function searchFAQ() {

  const keyword =
    document
      .getElementById(
        'faqKeyword'
      )
      .value
      .trim();


  const resultBox =
    document
      .getElementById(
        'faqResult'
      );


  const messageBox =
    document
      .getElementById(
        'faqMessage'
      );


  /*
   * 沒有輸入關鍵字
   */

  if (!keyword) {

    showMessage(

      messageBox,

      '請輸入 FAQ 關鍵字。',

      'error'

    );

    return;

  }


  /*
   * 搜尋按鈕
   */

  const button =
    document
      .getElementById(
        'faqButton'
      );


  button.disabled = true;

  button.textContent =
    '搜尋中...';


  /*
   * Loading
   */

  resultBox.innerHTML =
    '<div class="loading">' +
    '正在搜尋 FAQ...' +
    '</div>';


  messageBox.className =
    'message';


  /*
   * 呼叫 API
   */

  callAPI(

    {

      action:
        'faq',

      keyword:
        keyword

    },

    function(result) {

      button.disabled = false;

      button.textContent =
        '搜尋 FAQ';


      /*
       * API 失敗
       */

      if (
        !result ||
        !result.success
      ) {

        resultBox.innerHTML =
          '';

        showMessage(

          messageBox,

          result &&
          result.error
            ? result.error
            : 'FAQ 查詢失敗。',

          'error'

        );

        return;

      }


      /*
       * 顯示 FAQ
       */

      renderFAQ(
        result.data || []
      );

    }

  );

}


/* ==========================================
   顯示 FAQ
   ========================================== */


function renderFAQ(
  list
) {

  const box =
    document
      .getElementById(
        'faqResult'
      );


  /*
   * 無結果
   */

  if (!list.length) {

    box.innerHTML =
      '<div class="empty">' +
      '找不到符合條件的 FAQ。' +
      '</div>';

    return;

  }


  /*
   * 顯示結果
   */

  box.innerHTML =
    list

      .map(
        function(item) {

          return `

<div class="card faq-card">

  <div class="faq-question">

    ❓

    ${escapeHTML(
      item.keyword
    )}

  </div>


  <div class="faq-answer">

    ${escapeHTML(
      item.answer
    )}

  </div>

</div>

`;

        }
      )

      .join('');

}


/* ==========================================
   意見回饋
   ========================================== */


function sendFeedback() {

  /*
   * 取得欄位
   */

  const department =
    document
      .getElementById(
        'feedbackDepartment'
      )
      .value
      .trim();


  const grade =
    document
      .getElementById(
        'feedbackGrade'
      )
      .value
      .trim();


  const studentId =
    document
      .getElementById(
        'feedbackStudentId'
      )
      .value
      .trim();


  const name =
    document
      .getElementById(
        'feedbackName'
      )
      .value
      .trim();


  const email =
    document
      .getElementById(
        'feedbackEmail'
      )
      .value
      .trim();


  const question =
    document
      .getElementById(
        'feedbackQuestion'
      )
      .value
      .trim();


  const box =
    document
      .getElementById(
        'feedbackMessageBox'
      );


  /*
   * 問題不能空白
   */

  if (!question) {

    showMessage(

      box,

      '請輸入您的問題或意見內容。',

      'error'

    );

    return;

  }


  /*
   * 按鈕
   */

  const button =
    document
      .getElementById(
        'feedbackButton'
      );


  button.disabled = true;

  button.textContent =
    '送出中...';


  box.className =
    'message';


  /*
   * 呼叫 GAS ②
   */

  callAPI(

    {

      action:
        'feedback',

      department:
        department,

      grade:
        grade,

      studentId:
        studentId,

      name:
        name,

      email:
        email,

      question:
        question

    },

    function(result) {

      button.disabled = false;

      button.textContent =
        '送出問題';


      /*
       * API 失敗
       */

      if (
        !result ||
        !result.success
      ) {

        showMessage(

          box,

          result &&
          result.error
            ? result.error
            : '問題送出失敗。',

          'error'

        );

        return;

      }


      /*
       * GAS 回傳：
       *
       * result.data.message
       */

      showMessage(

        box,

        result.data &&
        result.data.message
          ? result.data.message
          : '已收到您的問題，謝謝您的回饋！',

        'success'

      );


      /*
       * 清空表單
       */

      document
        .getElementById(
          'feedbackDepartment'
        )
        .value = '';


      document
        .getElementById(
          'feedbackGrade'
        )
        .value = '';


      document
        .getElementById(
          'feedbackStudentId'
        )
        .value = '';


      document
        .getElementById(
          'feedbackName'
        )
        .value = '';


      document
        .getElementById(
          'feedbackEmail'
        )
        .value = '';


      document
        .getElementById(
          'feedbackQuestion'
        )
        .value = '';

    }

  );

}


/* ==========================================
   Message
   ========================================== */


function showMessage(
  element,
  text,
  type
) {

  element.textContent =
    text;


  element.className =
    'message show ' +
    (type || '');

}


/* ==========================================
   HTML 安全處理
   ========================================== */


function escapeHTML(
  value
) {

  return String(

    value === null ||
    value === undefined
      ? ''
      : value

  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


</script>
