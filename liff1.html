<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>實踐大學體育室｜智慧服務</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#eef7ff,#f7f9fc);
  color:#333;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif
}

.header{
  background:linear-gradient(135deg,#0066a1,#0089c9);
  color:#fff;
  text-align:center;
  padding:28px 20px 30px;
  border-radius:0 0 25px 25px
}

.logo{
  width:65px;
  height:65px;
  margin:0 auto 10px;
  background:#fff;
  color:#0066a1;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold
}

.header h1{
  margin:5px 0;
  font-size:22px
}

.header p{
  margin:6px 0 0;
  font-size:13px;
  opacity:.9
}

.container{
  max-width:520px;
  margin:auto;
  padding:16px
}

.user{
  background:#fff;
  padding:11px;
  border-radius:12px;
  text-align:center;
  color:#666;
  font-size:13px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.05)
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  background:#06c755;
  border-radius:50%;
  margin-right:5px
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px
}

.tab{
  border:0;
  background:#fff;
  padding:12px 4px;
  border-radius:11px;
  font-size:14px;
  font-weight:bold;
  color:#555;
  box-shadow:0 2px 7px rgba(0,0,0,.05)
}

.tab.active{
  background:#0066a1;
  color:#fff
}

.panel{
  display:none;
  background:#fff;
  padding:18px;
  border-radius:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06)
}

.panel.active{
  display:block
}

h2{
  margin:0 0 8px;
  font-size:19px
}

.desc{
  color:#777;
  font-size:13px;
  line-height:1.7;
  margin-bottom:14px
}

.input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  outline:none
}

.input:focus{
  border-color:#1683c5
}

textarea.input{
  min-height:120px;
  resize:vertical
}

.button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#0066a1;
  color:#fff;
  font-size:15px;
  font-weight:bold
}

.button:disabled{
  opacity:.55
}

.message{
  display:none;
  margin-top:10px;
  padding:10px;
  border-radius:9px;
  font-size:13px;
  line-height:1.6
}

.message.show{
  display:block
}

.message.error{
  background:#fff1f1;
  color:#c62828
}

.message.success{
  background:#eefaf3;
  color:#07883a
}

.loading,
.empty{
  text-align:center;
  color:#999;
  padding:20px 5px;
  font-size:13px
}

.result{
  margin-top:14px
}

.card{
  background:#f8fafc;
  padding:13px;
  margin-bottom:10px;
  border-radius:12px;
  border-left:4px solid #1683c5
}

.card-title{
  font-weight:bold;
  font-size:16px;
  margin-bottom:7px
}

.card-row{
  font-size:13px;
  line-height:1.7;
  color:#555
}

.faq-card{
  border-left-color:#ef8b2c
}

.faq-question{
  font-weight:bold;
  margin-bottom:6px
}

.faq-answer{
  font-size:13px;
  line-height:1.8;
  white-space:pre-wrap
}

.footer{
  text-align:center;
  color:#999;
  font-size:12px;
  line-height:1.7;
  margin:22px 0
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">體</div>
  <h1>意見・課程・FAQ</h1>
  <p>實踐大學體育室 LINE 智慧服務</p>
</div>

<div class="container">

  <div class="user">
    <span class="dot"></span>
    <span id="status">智慧服務已開啟</span>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="course">📚 課程查詢</button>
    <button class="tab" data-tab="faq">❓ FAQ</button>
    <button class="tab" data-tab="feedback">📝 意見回饋</button>
  </div>

  <!-- 課程 -->
  <div id="coursePanel" class="panel active">

    <h2>📚 課程查詢</h2>

    <div class="desc">
      請輸入課程名稱、教師、上課時間或課程代碼。
    </div>

    <input
      id="courseKeyword"
      class="input"
      type="text"
      placeholder="例如：籃球、王老師、三6~7、SPE-12A-51-A1"
    >

    <button id="courseButton" class="button">
      查詢課程
    </button>

    <div id="courseMessage" class="message"></div>
    <div id="courseResult" class="result"></div>

  </div>

  <!-- FAQ -->
  <div id="faqPanel" class="panel">

    <h2>❓ 常見問題 FAQ</h2>

    <div class="desc">
      請輸入問題關鍵字。
    </div>

    <input
      id="faqKeyword"
      class="input"
      type="text"
      placeholder="例如：重補修、體育3、適應體育、體育室"
    >

    <button id="faqButton" class="button">
      搜尋 FAQ
    </button>

    <div id="faqMessage" class="message"></div>
    <div id="faqResult" class="result"></div>

  </div>

  <!-- 意見 -->
  <div id="feedbackPanel" class="panel">

    <h2>📝 意見回饋</h2>

    <div class="desc">
      歡迎留下您的問題或建議。
    </div>

    <input id="feedbackDepartment" class="input" placeholder="科系">
    <input id="feedbackGrade" class="input" placeholder="年級">
    <input id="feedbackStudentId" class="input" placeholder="學號">
    <input id="feedbackName" class="input" placeholder="姓名">
    <input id="feedbackEmail" class="input" type="email" placeholder="Email">

    <textarea
      id="feedbackQuestion"
      class="input"
      placeholder="請輸入您的問題或意見..."
    ></textarea>

    <button id="feedbackButton" class="button">
      送出問題
    </button>

    <div id="feedbackMessage" class="message"></div>

  </div>

  <div class="footer">
    實踐大學體育室<br>
    LINE 智慧服務中心<br>
    © Shih Chien University
  </div>

</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
"use strict";

/* ==========================================
   設定
========================================== */

const LIFF_ID = "2011040456-bmrz6CGx";

const API_URL =
"https://script.google.com/macros/s/AKfycbxCAzAPaWf6d9Vurpl8pQ64S_3w_tihKNrB3SdlrLI2IQU3BGIOwG4T79TXziKPjWLQ/exec";


/* ==========================================
   啟動
========================================== */

document.addEventListener("DOMContentLoaded", function(){

  document.querySelectorAll(".tab").forEach(function(tab){

    tab.addEventListener("click", function(){

      showTab(this.dataset.tab);

    });

  });


  document
    .getElementById("courseButton")
    .addEventListener("click", searchCourse);


  document
    .getElementById("faqButton")
    .addEventListener("click", searchFAQ);


  document
    .getElementById("feedbackButton")
    .addEventListener("click", sendFeedback);


  document
    .getElementById("courseKeyword")
    .addEventListener("keydown", function(e){

      if(e.key === "Enter"){
        e.preventDefault();
        searchCourse();
      }

    });


  document
    .getElementById("faqKeyword")
    .addEventListener("keydown", function(e){

      if(e.key === "Enter"){
        e.preventDefault();
        searchFAQ();
      }

    });


  init();

});


/* ==========================================
   初始化
========================================== */

async function init(){

  const status =
    document.getElementById("status");

  /*
   * LIFF 只負責顯示 LINE 狀態
   * 不影響 API 功能
   */

  try{

    if(typeof liff !== "undefined"){

      await liff.init({
        liffId: LIFF_ID
      });

      if(liff.isLoggedIn()){

        try{

          const profile =
            await liff.getProfile();

          status.textContent =
            "您好，" +
            (profile.displayName || "LINE 使用者") +
            " 👋";

        }catch(e){

          status.textContent =
            "智慧服務已開啟";

        }

      }

    }

  }catch(e){

    console.log("LIFF:", e);

    status.textContent =
      "智慧服務已開啟";

  }

}


/* ==========================================
   JSONP
========================================== */

function callAPI(params){

  return new Promise(function(resolve){

    const callbackName =
      "sportsAPI_" +
      Date.now() +
      "_" +
      Math.floor(Math.random()*100000);


    const query =
      Object.keys(params)
        .map(function(key){

          return encodeURIComponent(key) +
            "=" +
            encodeURIComponent(
              params[key] == null ? "" : params[key]
            );

        })
        .join("&");


    const script =
      document.createElement("script");


    let done = false;


    const timer =
      setTimeout(function(){

        if(done) return;

        done = true;

        cleanup();

        resolve({
          success:false,
          error:"API 連線逾時，請稍後再試。"
        });

      },15000);


    window[callbackName] =
      function(data){

        if(done) return;

        done = true;

        clearTimeout(timer);

        cleanup();

        resolve(data);

      };


    function cleanup(){

      if(script.parentNode){
        script.parentNode.removeChild(script);
      }

      try{
        delete window[callbackName];
      }catch(e){
        window[callbackName] = undefined;
      }

    }


    script.onerror =
      function(){

        if(done) return;

        done = true;

        clearTimeout(timer);

        cleanup();

        resolve({
          success:false,
          error:"無法連線至 GAS API。"
        });

      };


    script.src =
      API_URL +
      "?" +
      query +
      "&callback=" +
      encodeURIComponent(callbackName);


    document.head.appendChild(script);

  });

}


/* ==========================================
   分頁
========================================== */

function showTab(name){

  document.querySelectorAll(".panel")
    .forEach(function(panel){
      panel.classList.remove("active");
    });


  document.querySelectorAll(".tab")
    .forEach(function(tab){
      tab.classList.remove("active");
    });


  const panel =
    document.getElementById(name + "Panel");


  const tab =
    document.querySelector(
      '.tab[data-tab="' + name + '"]'
    );


  if(panel){
    panel.classList.add("active");
  }


  if(tab){
    tab.classList.add("active");
  }

}


/* ==========================================
   課程查詢
========================================== */

async function searchCourse(){

  const keyword =
    document
      .getElementById("courseKeyword")
      .value
      .trim();


  const button =
    document.getElementById("courseButton");


  const message =
    document.getElementById("courseMessage");


  const result =
    document.getElementById("courseResult");


  hideMessage(message);


  if(!keyword){

    result.innerHTML = "";

    showMessage(
      message,
      "請輸入查詢關鍵字。",
      "error"
    );

    return;

  }


  button.disabled = true;
  button.textContent = "查詢中...";


  result.innerHTML =
    '<div class="loading">正在查詢...</div>';


  const data =
    await callAPI({
      action:"course",
      keyword:keyword
    });


  button.disabled = false;
  button.textContent = "查詢課程";


  if(!data || !data.success){

    result.innerHTML = "";

    showMessage(
      message,
      data && data.error
        ? data.error
        : "課程查詢失敗。",
      "error"
    );

    return;

  }


  renderCourses(
    Array.isArray(data.data)
      ? data.data
      : []
  );

}


/* ==========================================
   課程結果
========================================== */

function renderCourses(list){

  const box =
    document.getElementById("courseResult");


  if(!list.length){

    box.innerHTML =
      '<div class="empty">找不到符合條件的課程。</div>';

    return;

  }


  box.innerHTML =
    list.map(function(c){

      return `
        <div class="card">

          <div class="card-title">
            ${escapeHTML(c.code)}
            ${c.name ? "｜" + escapeHTML(c.name) : ""}
          </div>

          <div class="card-row">
            <strong>教師：</strong>
            ${escapeHTML(c.teacher)}
          </div>

          <div class="card-row">
            <strong>時間：</strong>
            ${escapeHTML(c.time)}
          </div>

          <div class="card-row">
            <strong>地點：</strong>
            ${escapeHTML(c.location || "未提供")}
          </div>

          <div class="card-row">
            <strong>名額：</strong>
            ${escapeHTML(c.limit || "未提供")}
          </div>

          ${
            c.note
            ? `
              <div class="card-row">
                <strong>備註：</strong>
                ${escapeHTML(c.note)}
              </div>
            `
            : ""
          }

        </div>
      `;

    }).join("");

}


/* ==========================================
   FAQ
========================================== */

async function searchFAQ(){

  const keyword =
    document
      .getElementById("faqKeyword")
      .value
      .trim();


  const button =
    document.getElementById("faqButton");


  const message =
    document.getElementById("faqMessage");


  const result =
    document.getElementById("faqResult");


  hideMessage(message);


  if(!keyword){

    result.innerHTML = "";

    showMessage(
      message,
      "請輸入 FAQ 關鍵字。",
      "error"
    );

    return;

  }


  button.disabled = true;
  button.textContent = "搜尋中...";


  result.innerHTML =
    '<div class="loading">正在搜尋...</div>';


  const data =
    await callAPI({
      action:"faq",
      keyword:keyword
    });


  button.disabled = false;
  button.textContent = "搜尋 FAQ";


  if(!data || !data.success){

    result.innerHTML = "";

    showMessage(
      message,
      data && data.error
        ? data.error
        : "FAQ 查詢失敗。",
      "error"
    );

    return;

  }


  renderFAQ(
    Array.isArray(data.data)
      ? data.data
      : []
  );

}


/* ==========================================
   FAQ 結果
========================================== */

function renderFAQ(list){

  const box =
    document.getElementById("faqResult");


  if(!list.length){

    box.innerHTML =
      '<div class="empty">找不到符合條件的 FAQ。</div>';

    return;

  }


  box.innerHTML =
    list.map(function(item){

      return `
        <div class="card faq-card">

          <div class="faq-question">
            ❓ ${escapeHTML(item.keyword)}
          </div>

          <div class="faq-answer">
            ${escapeHTML(item.answer)}
          </div>

        </div>
      `;

    }).join("");

}


/* ==========================================
   意見回饋
========================================== */

async function sendFeedback(){

  const button =
    document.getElementById("feedbackButton");


  const message =
    document.getElementById("feedbackMessage");


  const question =
    document
      .getElementById("feedbackQuestion")
      .value
      .trim();


  hideMessage(message);


  if(!question){

    showMessage(
      message,
      "請輸入您的問題或意見。",
      "error"
    );

    return;

  }


  button.disabled = true;
  button.textContent = "送出中...";


  const data =
    await callAPI({

      action:"feedback",

      department:
        document.getElementById("feedbackDepartment").value.trim(),

      grade:
        document.getElementById("feedbackGrade").value.trim(),

      studentId:
        document.getElementById("feedbackStudentId").value.trim(),

      name:
        document.getElementById("feedbackName").value.trim(),

      email:
        document.getElementById("feedbackEmail").value.trim(),

      question:question

    });


  button.disabled = false;
  button.textContent = "送出問題";


  if(!data || !data.success){

    showMessage(
      message,
      data && data.error
        ? data.error
        : "問題送出失敗。",
      "error"
    );

    return;

  }


  showMessage(
    message,
    data.data && data.data.message
      ? data.data.message
      : "已收到您的問題，謝謝您的回饋！",
    "success"
  );


  [
    "feedbackDepartment",
    "feedbackGrade",
    "feedbackStudentId",
    "feedbackName",
    "feedbackEmail",
    "feedbackQuestion"
  ].forEach(function(id){

    document.getElementById(id).value = "";

  });

}


/* ==========================================
   訊息
========================================== */

function showMessage(el,text,type){

  el.textContent = text;

  el.className =
    "message show " +
    (type || "");

}


function hideMessage(el){

  el.textContent = "";

  el.className = "message";

}


/* ==========================================
   HTML 安全
========================================== */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
</script>

</body>
</html>
