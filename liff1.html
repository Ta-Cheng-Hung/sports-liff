<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>實踐大學體育室｜智慧服務</title>


<style>

/* =========================================================
   基本
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:linear-gradient(
    180deg,
    #eef7ff 0%,
    #f7f9fc 100%
  );

  color:#333;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    Arial,
    sans-serif;

  overflow-x:hidden;
}


/* =========================================================
   Header
========================================================= */

.header{
  background:linear-gradient(
    135deg,
    #0066a1,
    #0089c9
  );

  color:#fff;

  text-align:center;

  padding:
    28px
    20px
    30px;

  border-radius:
    0
    0
    25px
    25px;
}

.logo{
  width:65px;
  height:65px;

  margin:
    0
    auto
    10px;

  background:#fff;
  color:#0066a1;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;
  font-weight:bold;
}

.header h1{
  margin:5px 0;
  font-size:22px;
}

.header p{
  margin:6px 0 0;
  font-size:13px;
  opacity:.9;
}


/* =========================================================
   Container
========================================================= */

.container{
  width:100%;
  max-width:520px;

  margin:0 auto;

  padding:
    16px;
}


/* =========================================================
   User
========================================================= */

.user{
  background:#fff;

  padding:11px;

  border-radius:12px;

  text-align:center;

  color:#666;

  font-size:13px;

  margin-bottom:12px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.05);
}

.dot{
  display:inline-block;

  width:8px;
  height:8px;

  background:#06c755;

  border-radius:50%;

  margin-right:5px;
}


/* =========================================================
   Tabs
========================================================= */

.tabs{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

  margin-bottom:12px;
}

.tab{
  border:0;

  background:#fff;

  padding:
    12px
    4px;

  border-radius:11px;

  font-size:14px;

  font-weight:bold;

  color:#555;

  box-shadow:
    0 2px 7px rgba(0,0,0,.05);

  cursor:pointer;
}

.tab.active{
  background:#0066a1;
  color:#fff;
}


/* =========================================================
   Panel
========================================================= */

.panel{
  display:none;

  background:#fff;

  padding:18px;

  border-radius:16px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.06);

  width:100%;

  /*
   * 重要：
   * 不設定 height
   * 不設定 min-height
   * 不設定固定高度
   */
  height:auto;
  min-height:0;
}

.panel.active{
  display:block;
}


/* =========================================================
   標題
========================================================= */

h2{
  margin:
    0
    0
    8px;

  font-size:19px;
}

.desc{
  color:#777;

  font-size:13px;

  line-height:1.7;

  margin-bottom:14px;
}


/* =========================================================
   Input
========================================================= */

.input{
  width:100%;

  padding:12px;

  margin-bottom:10px;

  border:
    1px
    solid
    #ddd;

  border-radius:10px;

  font-size:15px;

  outline:none;

  background:#fff;
}

.input:focus{
  border-color:#1683c5;
}

textarea.input{
  min-height:120px;
  resize:vertical;
}


/* =========================================================
   Button
========================================================= */

.button{
  width:100%;

  padding:13px;

  border:0;

  border-radius:10px;

  background:#0066a1;

  color:#fff;

  font-size:15px;

  font-weight:bold;

  cursor:pointer;
}

.button:disabled{
  opacity:.55;
}


/* =========================================================
   Message
========================================================= */

.message{
  display:none;

  margin-top:10px;

  padding:10px;

  border-radius:9px;

  font-size:13px;

  line-height:1.6;
}

.message.show{
  display:block;
}

.message.error{
  background:#fff1f1;
  color:#c62828;
}

.message.success{
  background:#eefaf3;
  color:#07883a;
}


/* =========================================================
   Loading / Empty
========================================================= */

.loading,
.empty{
  width:100%;

  text-align:center;

  color:#999;

  padding:
    20px
    5px;

  font-size:13px;

  height:auto;

  min-height:0;
}


/* =========================================================
   查詢結果
========================================================= */

.result{
  width:100%;

  margin-top:14px;

  height:auto;

  min-height:0;

  /*
   * 非常重要：
   * 不允許結果區域自己產生固定高度
   */
  max-height:none;

  overflow:visible;
}


/* =========================================================
   課程卡片
========================================================= */

.card{

  display:block;

  width:100%;

  /*
   * 關鍵修正
   */
  height:auto !important;

  min-height:0 !important;

  max-height:none !important;

  overflow:visible;

  background:#f8fafc;

  padding:13px;

  margin:
    0
    0
    10px
    0;

  border-radius:12px;

  border-left:
    4px
    solid
    #1683c5;

  /*
   * 防止 Flex/Grid 將卡片拉高
   */
  align-self:flex-start;
}


/* =========================================================
   卡片標題
========================================================= */

.card-title{

  display:block;

  width:100%;

  height:auto !important;

  min-height:0 !important;

  font-weight:bold;

  font-size:16px;

  line-height:1.5;

  margin:
    0
    0
    7px;

  word-break:break-word;

  overflow-wrap:anywhere;
}


/* =========================================================
   卡片內容
========================================================= */

.card-row{

  display:block;

  width:100%;

  height:auto !important;

  min-height:0 !important;

  font-size:13px;

  line-height:1.7;

  color:#555;

  margin:0;

  padding:0;

  word-break:break-word;

  overflow-wrap:anywhere;
}


/* =========================================================
   FAQ
========================================================= */

.faq-card{
  border-left-color:#ef8b2c;
}

.faq-question{
  font-weight:bold;
  margin-bottom:6px;
}

.faq-answer{
  font-size:13px;
  line-height:1.8;

  white-space:pre-wrap;

  word-break:break-word;
}


/* =========================================================
   Footer
========================================================= */

.footer{
  text-align:center;

  color:#999;

  font-size:12px;

  line-height:1.7;

  margin:
    22px
    0;
}


/* =========================================================
   手機版
========================================================= */

@media(max-width:480px){

  .container{
    padding:
      12px;
  }

  .panel{
    padding:
      15px;
  }

  .card{
    padding:
      12px;
  }

  .card-title{
    font-size:15px;
  }

  .card-row{
    font-size:13px;
  }

}

</style>

</head>

<!-- =====================================================
     LINE LIFF SDK
===================================================== -->

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>



<script>

"use strict";


// =========================================================
// 設定
// =========================================================

const LIFF_ID =
  "2011040456-bmrz6CGx";


const API_URL =
  "https://script.google.com/macros/s/AKfycbzvOFa6AZG15y82ykySh3vBPL5wirIyMcX6avhb5rYBLmM1dmXlOhViu2gwovBw_8GWdA/exec";



// =========================================================
// 啟動
// =========================================================

document.addEventListener(
  "DOMContentLoaded",
  function(){

    document
      .querySelectorAll(".tab")
      .forEach(
        function(tab){

          tab.addEventListener(
            "click",
            function(){

              showTab(
                this.dataset.tab
              );

            }
          );

        }
      );


    document
      .getElementById("courseButton")
      .addEventListener(
        "click",
        searchCourse
      );


    document
      .getElementById("faqButton")
      .addEventListener(
        "click",
        searchFAQ
      );


    document
      .getElementById("feedbackButton")
      .addEventListener(
        "click",
        sendFeedback
      );


    document
      .getElementById("courseKeyword")
      .addEventListener(
        "keydown",
        function(e){

          if(e.key === "Enter"){

            e.preventDefault();

            searchCourse();

          }

        }
      );


    document
      .getElementById("faqKeyword")
      .addEventListener(
        "keydown",
        function(e){

          if(e.key === "Enter"){

            e.preventDefault();

            searchFAQ();

          }

        }
      );


    init();

  }
);



// =========================================================
// LIFF 初始化
// =========================================================

async function init(){

  const status =
    document.getElementById(
      "status"
    );


  try{

    if(
      typeof liff !== "undefined"
    ){

      await liff.init({
        liffId: LIFF_ID
      });


      if(
        liff.isLoggedIn()
      ){

        try{

          const profile =
            await liff.getProfile();


          status.textContent =
            "您好，"
            +
            (
              profile.displayName
              ||
              "LINE 使用者"
            )
            +
            " 👋";


        }catch(e){

          status.textContent =
            "智慧服務已開啟";

        }

      }

    }

  }catch(e){

    console.log(
      "LIFF:",
      e
    );

    status.textContent =
      "智慧服務已開啟";

  }

}



// =========================================================
// JSONP
// =========================================================

function callAPI(params){

  return new Promise(
    function(resolve){

      const callbackName =
        "sportsAPI_"
        +
        Date.now()
        +
        "_"
        +
        Math.floor(
          Math.random() * 100000
        );


      const query =
        Object.keys(params)
          .map(
            function(key){

              return (
                encodeURIComponent(key)
                +
                "="
                +
                encodeURIComponent(
                  params[key] == null
                    ? ""
                    : params[key]
                )
              );

            }
          )
          .join("&");


      const script =
        document.createElement(
          "script"
        );


      let done = false;


      const timer =
        setTimeout(
          function(){

            if(done){
              return;
            }


            done = true;


            cleanup();


            resolve({

              success:false,

              error:
                "API 連線逾時，請稍後再試。"

            });

          },
          15000
        );


      window[callbackName] =
        function(data){

          if(done){
            return;
          }


          done = true;


          clearTimeout(
            timer
          );


          cleanup();


          resolve(data);

        };


      function cleanup(){

        if(
          script.parentNode
        ){

          script.parentNode
            .removeChild(
              script
            );

        }


        try{

          delete window[
            callbackName
          ];

        }catch(e){

          window[
            callbackName
          ] = undefined;

        }

      }


      script.onerror =
        function(){

          if(done){
            return;
          }


          done = true;


          clearTimeout(
            timer
          );


          cleanup();


          resolve({

            success:false,

            error:
              "無法連線至 GAS API。"

          });

        };


      script.src =
        API_URL
        +
        "?"
        +
        query
        +
        "&callback="
        +
        encodeURIComponent(
          callbackName
        );


      document.head.appendChild(
        script
      );

    }
  );

}



// =========================================================
// 分頁
// =========================================================

function showTab(name){

  document
    .querySelectorAll(".panel")
    .forEach(
      function(panel){

        panel.classList.remove(
          "active"
        );

      }
    );


  document
    .querySelectorAll(".tab")
    .forEach(
      function(tab){

        tab.classList.remove(
          "active"
        );

      }
    );


  const panel =
    document.getElementById(
      name + "Panel"
    );


  const tab =
    document.querySelector(
      '.tab[data-tab="' +
      name +
      '"]'
    );


  if(panel){

    panel.classList.add(
      "active"
    );

  }


  if(tab){

    tab.classList.add(
      "active"
    );

  }

}



// =========================================================
// 課程查詢
// =========================================================

async function searchCourse(){

  const keyword =
    document
      .getElementById(
        "courseKeyword"
      )
      .value
      .trim();


  const button =
    document.getElementById(
      "courseButton"
    );


  const message =
    document.getElementById(
      "courseMessage"
    );


  const result =
    document.getElementById(
      "courseResult"
    );


  hideMessage(
    message
  );


  if(!keyword){

    result.innerHTML =
      "";


    showMessage(
      message,
      "請輸入查詢關鍵字。",
      "error"
    );


    return;

  }


  button.disabled =
    true;


  button.textContent =
    "查詢中...";


  result.innerHTML =
    '<div class="loading">正在查詢...</div>';


  const data =
    await callAPI({

      action:
        "course",

      keyword:
        keyword

    });


  button.disabled =
    false;


  button.textContent =
    "查詢課程";


  if(
    !data ||
    !data.success
  ){

    result.innerHTML =
      "";


    showMessage(
      message,

      data &&
      data.error
        ? data.error
        : "課程查詢失敗。",

      "error"
    );


    return;

  }


  renderCourses(
    Array.isArray(data.data)
      ? data.data
      : []
  );

}



// =========================================================
// 課程結果
//
// 這裡特別不用巨大 template literal
// 改用 DOM 建立卡片
//
// 可以避免部分 LIFF WebView 排版問題
// =========================================================

function renderCourses(list){

  const box =
    document.getElementById(
      "courseResult"
    );


  box.innerHTML =
    "";


  if(
    !list ||
    !list.length
  ){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "empty";


    empty.textContent =
      "找不到符合條件的課程。";


    box.appendChild(
      empty
    );


    return;

  }



  // =======================================================
  // 一筆一筆建立課程卡片
  // =======================================================

  list.forEach(
    function(c){

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      // ---------------------------------------------------
      // 課程標題
      // ---------------------------------------------------

      const title =
        document.createElement(
          "div"
        );


      title.className =
        "card-title";


      const code =
        c.code || "";


      const name =
        c.name || "";


      title.textContent =
        code +
        (
          name
            ? "｜" + name
            : ""
        );


      card.appendChild(
        title
      );



      // ---------------------------------------------------
      // 教師
      // ---------------------------------------------------

      addCourseRow(
        card,
        "教師：",
        c.teacher
      );



      // ---------------------------------------------------
      // 時間
      // ---------------------------------------------------

      addCourseRow(
        card,
        "時間：",
        c.time
      );



      // ---------------------------------------------------
      // 地點
      // ---------------------------------------------------

      addCourseRow(
        card,
        "地點：",
        c.location || "未提供"
      );



      // ---------------------------------------------------
      // 名額
      // ---------------------------------------------------

      addCourseRow(
        card,
        "名額：",
        c.limit || "未提供"
      );



      // ---------------------------------------------------
      // 備註
      // ---------------------------------------------------

      if(c.note){

        addCourseRow(
          card,
          "備註：",
          c.note
        );

      }



      // ---------------------------------------------------
      // 加入結果區
      // ---------------------------------------------------

      box.appendChild(
        card
      );

    }
  );

}



// =========================================================
// 建立課程資料列
// =========================================================

function addCourseRow(
  card,
  label,
  value
){

  const row =
    document.createElement(
      "div"
    );


  row.className =
    "card-row";


  const strong =
    document.createElement(
      "strong"
    );


  strong.textContent =
    label;


  row.appendChild(
    strong
  );


  const text =
    document.createTextNode(
      " " +
      (
        value == null
          ? ""
          : String(value)
      )
    );


  row.appendChild(
    text
  );


  card.appendChild(
    row
  );

}



// =========================================================
// FAQ
// =========================================================

async function searchFAQ(){

  const keyword =
    document
      .getElementById(
        "faqKeyword"
      )
      .value
      .trim();


  const button =
    document.getElementById(
      "faqButton"
    );


  const message =
    document.getElementById(
      "faqMessage"
    );


  const result =
    document.getElementById(
      "faqResult"
    );


  hideMessage(
    message
  );


  if(!keyword){

    result.innerHTML =
      "";


    showMessage(
      message,
      "請輸入 FAQ 關鍵字。",
      "error"
    );


    return;

  }


  button.disabled =
    true;


  button.textContent =
    "搜尋中...";


  result.innerHTML =
    '<div class="loading">正在搜尋...</div>';


  const data =
    await callAPI({

      action:
        "faq",

      keyword:
        keyword

    });


  button.disabled =
    false;


  button.textContent =
    "搜尋 FAQ";


  if(
    !data ||
    !data.success
  ){

    result.innerHTML =
      "";


    showMessage(
      message,

      data &&
      data.error
        ? data.error
        : "FAQ 查詢失敗。",

      "error"
    );


    return;

  }


  renderFAQ(
    Array.isArray(data.data)
      ? data.data
      : []
  );

}



// =========================================================
// FAQ 結果
// =========================================================

function renderFAQ(list){

  const box =
    document.getElementById(
      "faqResult"
    );


  box.innerHTML =
    "";


  if(
    !list ||
    !list.length
  ){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "empty";


    empty.textContent =
      "找不到符合條件的 FAQ。";


    box.appendChild(
      empty
    );


    return;

  }


  list.forEach(
    function(item){

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card faq-card";


      const question =
        document.createElement(
          "div"
        );


      question.className =
        "faq-question";


      question.textContent =
        "❓ " +
        (
          item.keyword || ""
        );


      card.appendChild(
        question
      );


      const answer =
        document.createElement(
          "div"
        );


      answer.className =
        "faq-answer";


      answer.textContent =
        item.answer || "";


      card.appendChild(
        answer
      );


      box.appendChild(
        card
      );

    }
  );

}



// =========================================================
// 意見回饋
// =========================================================

async function sendFeedback(){

  const button =
    document.getElementById(
      "feedbackButton"
    );


  const message =
    document.getElementById(
      "feedbackMessage"
    );


  const question =
    document
      .getElementById(
        "feedbackQuestion"
      )
      .value
      .trim();


  hideMessage(
    message
  );


  if(!question){

    showMessage(
      message,
      "請輸入您的問題或意見。",
      "error"
    );


    return;

  }


  button.disabled =
    true;


  button.textContent =
    "送出中...";


  const data =
    await callAPI({

      action:
        "feedback",

      department:
        document
          .getElementById(
            "feedbackDepartment"
          )
          .value
          .trim(),

      grade:
        document
          .getElementById(
            "feedbackGrade"
          )
          .value
          .trim(),

      studentId:
        document
          .getElementById(
            "feedbackStudentId"
          )
          .value
          .trim(),

      name:
        document
          .getElementById(
            "feedbackName"
          )
          .value
          .trim(),

      email:
        document
          .getElementById(
            "feedbackEmail"
          )
          .value
          .trim(),

      question:
        question

    });


  button.disabled =
    false;


  button.textContent =
    "送出問題";


  if(
    !data ||
    !data.success
  ){

    showMessage(
      message,

      data &&
      data.error
        ? data.error
        : "問題送出失敗。",

      "error"
    );


    return;

  }


  showMessage(
    message,

    data.message ||
    "已收到您的問題，謝謝您的回饋！",

    "success"
  );


  [
    "feedbackDepartment",
    "feedbackGrade",
    "feedbackStudentId",
    "feedbackName",
    "feedbackEmail",
    "feedbackQuestion"

  ].forEach(
    function(id){

      document
        .getElementById(id)
        .value = "";

    }
  );

}



// =========================================================
// 顯示訊息
// =========================================================

function showMessage(
  el,
  text,
  type
){

  el.textContent =
    text;


  el.className =
    "message show " +
    (
      type || ""
    );

}



// =========================================================
// 隱藏訊息
// =========================================================

function hideMessage(
  el
){

  el.textContent =
    "";


  el.className =
    "message";

}

</script>
