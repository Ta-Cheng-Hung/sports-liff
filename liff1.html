<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>意見・課程・FAQ｜實踐大學體育室</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        linear-gradient(
          180deg,
          #eef7ff 0%,
          #f7f9fc 100%
        );

      color: #333;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
    }


    /* ==========================================
       Header
       ========================================== */

    .header {
      background:
        linear-gradient(
          135deg,
          #0066a1,
          #0089c9
        );

      color: white;

      padding:
        28px
        20px
        32px;

      text-align: center;

      border-radius:
        0
        0
        28px
        28px;

      box-shadow:
        0 4px 15px
        rgba(0, 0, 0, .12);
    }


    .logo {
      width: 70px;
      height: 70px;

      margin:
        0
        auto
        12px;

      background: white;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #0066a1;

      font-size: 30px;

      font-weight: bold;
    }


    .header h1 {
      margin:
        5px
        0;

      font-size: 23px;
    }


    .header p {
      margin:
        7px
        0
        0;

      font-size: 13px;

      opacity: .9;
    }


    /* ==========================================
       Container
       ========================================== */

    .container {
      width: 100%;

      max-width: 520px;

      margin: 0 auto;

      padding:
        18px
        16px
        40px;
    }


    /* ==========================================
       User
       ========================================== */

    .user {
      background: white;

      border-radius: 14px;

      padding:
        12px
        15px;

      margin-bottom: 14px;

      box-shadow:
        0 3px 12px
        rgba(0, 0, 0, .05);

      font-size: 13px;

      color: #666;

      text-align: center;
    }


    .status-dot {
      display: inline-block;

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #999;

      margin-right: 6px;
    }


    .status-dot.success {
      background: #06c755;
    }


    .status-dot.error {
      background: #e53935;
    }


    .status-dot.loading {
      background: #ff9800;
    }


    /* ==========================================
       Tabs
       ========================================== */

    .tabs {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;

      margin-bottom: 15px;
    }


    .tab {
      border: none;

      background: white;

      padding:
        13px
        5px;

      border-radius: 12px;

      font-size: 14px;

      font-weight: bold;

      color: #555;

      box-shadow:
        0 2px 8px
        rgba(0, 0, 0, .05);

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;
    }


    .tab.active {
      background: #0066a1;

      color: white;
    }


    /* ==========================================
       Panel
       ========================================== */

    .panel {
      display: none;

      background: white;

      border-radius: 18px;

      padding: 18px;

      box-shadow:
        0 3px 12px
        rgba(0, 0, 0, .06);
    }


    .panel.active {
      display: block;
    }


    .panel h2 {
      margin:
        0
        0
        8px;

      font-size: 19px;
    }


    .description {
      color: #777;

      font-size: 13px;

      line-height: 1.7;

      margin-bottom: 15px;
    }


    /* ==========================================
       Input
       ========================================== */

    .input {
      width: 100%;

      border:
        1px
        solid
        #ddd;

      border-radius: 11px;

      padding: 12px;

      font-size: 15px;

      outline: none;

      margin-bottom: 10px;

      background: white;

      color: #333;
    }


    .input:focus {
      border-color: #1683c5;

      box-shadow:
        0 0 0 2px
        rgba(22, 131, 197, .08);
    }


    textarea.input {
      min-height: 130px;

      resize: vertical;
    }


    /* ==========================================
       Button
       ========================================== */

    .button {
      width: 100%;

      border: none;

      border-radius: 11px;

      padding: 13px;

      background: #0066a1;

      color: white;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;
    }


    .button:active {
      transform: scale(.98);
    }


    .button:disabled {
      opacity: .55;

      cursor: not-allowed;
    }


    /* ==========================================
       Message
       ========================================== */

    .message {
      margin-top: 12px;

      padding: 11px;

      border-radius: 10px;

      background: #f2f7fa;

      color: #666;

      font-size: 13px;

      line-height: 1.6;

      display: none;

      word-break: break-word;
    }


    .message.show {
      display: block;
    }


    .message.success {
      background: #eefaf3;

      color: #07883a;
    }


    .message.error {
      background: #fff2f2;

      color: #c62828;
    }


    /* ==========================================
       Result
       ========================================== */

    .result {
      margin-top: 15px;
    }


    /* ==========================================
       Card
       ========================================== */

    .card {
      background: #f8fafc;

      border-radius: 13px;

      padding: 14px;

      margin-bottom: 10px;

      border-left:
        4px
        solid
        #1683c5;
    }


    .card-title {
      font-size: 16px;

      font-weight: bold;

      margin-bottom: 8px;

      color: #222;

      word-break: break-word;
    }


    .card-row {
      font-size: 13px;

      color: #555;

      line-height: 1.7;

      word-break: break-word;
    }


    .card-row strong {
      color: #333;
    }


    /* ==========================================
       FAQ
       ========================================== */

    .faq-card {
      border-left-color:
        #ef8b2c;
    }


    .faq-question {
      font-weight: bold;

      margin-bottom: 7px;

      font-size: 15px;

      word-break: break-word;
    }


    .faq-answer {
      font-size: 13px;

      line-height: 1.8;

      color: #555;

      white-space: pre-wrap;

      word-break: break-word;
    }


    /* ==========================================
       Loading
       ========================================== */

    .loading {
      text-align: center;

      color: #888;

      padding:
        20px
        5px;

      font-size: 13px;
    }


    /* ==========================================
       Empty
       ========================================== */

    .empty {
      text-align: center;

      color: #999;

      padding:
        25px
        5px;

      font-size: 13px;
    }


    /* ==========================================
       Footer
       ========================================== */

    .footer {
      margin-top: 25px;

      text-align: center;

      color: #999;

      font-size: 12px;

      line-height: 1.7;
    }


    /* ==========================================
       API Debug
       ========================================== */

    .debug {
      margin-top: 12px;

      padding: 10px;

      background: #f5f5f5;

      border-radius: 10px;

      color: #888;

      font-size: 11px;

      line-height: 1.5;

      word-break: break-all;

      display: none;
    }


    .debug.show {
      display: block;
    }


    /* ==========================================
       Mobile
       ========================================== */

    @media (max-width: 360px) {

      .container {
        padding-left: 12px;
        padding-right: 12px;
      }

      .tab {
        font-size: 13px;
      }

    }

  </style>

</head>


<body>


  <!-- ==========================================
       Header
       ========================================== -->

  <div class="header">

    <div class="logo">
      體
    </div>

    <h1>
      意見・課程・FAQ
    </h1>

    <p>
      實踐大學體育室 LINE 智慧服務
    </p>

  </div>


  <div class="container">


    <!-- ==========================================
         LINE 使用者
         ========================================== -->

    <div class="user">

      <span
        id="statusDot"
        class="status-dot loading"
      ></span>

      <span id="userStatus">
        正在初始化 LINE 使用者...
      </span>

    </div>


    <!-- ==========================================
         Tabs
         ========================================== -->

    <div class="tabs">

      <button
        type="button"
        class="tab active"
        onclick="showTab('course')"
      >
        📚 課程查詢
      </button>


      <button
        type="button"
        class="tab"
        onclick="showTab('faq')"
      >
        ❓ FAQ
      </button>


      <button
        type="button"
        class="tab"
        onclick="showTab('feedback')"
      >
        📝 意見回饋
      </button>

    </div>


    <!-- ==========================================
         課程查詢
         ========================================== -->

    <div
      id="coursePanel"
      class="panel active"
    >

      <h2>
        📚 課程查詢
      </h2>

      <div class="description">
        可輸入課程代碼、課程名稱、教師、
        上課時間、地點或限選條件查詢。
      </div>


      <input
        id="courseKeyword"
        class="input"
        type="text"
        placeholder="例如：籃球、王老師、二1~2"
        onkeydown="courseEnter(event)"
      >


      <button
        id="courseButton"
        type="button"
        class="button"
        onclick="searchCourse()"
      >
        查詢課程
      </button>


      <div
        id="courseMessage"
        class="message"
      ></div>


      <div
        id="courseResult"
        class="result"
      ></div>

    </div>


    <!-- ==========================================
         FAQ
         ========================================== -->

    <div
      id="faqPanel"
      class="panel"
    >

      <h2>
        ❓ 常見問題 FAQ
      </h2>


      <div class="description">
        請輸入您想詢問的問題或關鍵字。
      </div>


      <input
        id="faqKeyword"
        class="input"
        type="text"
        placeholder="例如：重補修、體育3、體育4"
        onkeydown="faqEnter(event)"
      >


      <button
        id="faqButton"
        type="button"
        class="button"
        onclick="searchFAQ()"
      >
        搜尋 FAQ
      </button>


      <div
        id="faqMessage"
        class="message"
      ></div>


      <div
        id="faqResult"
        class="result"
      ></div>

    </div>


    <!-- ==========================================
         意見回饋
         ========================================== -->

    <div
      id="feedbackPanel"
      class="panel"
    >

      <h2>
        📝 意見回饋
      </h2>


      <div class="description">
        如果您對體育室服務有任何問題或建議，
        歡迎留下您的資料與問題。
      </div>


      <input
        id="feedbackDepartment"
        class="input"
        type="text"
        placeholder="科系"
      >


      <input
        id="feedbackGrade"
        class="input"
        type="text"
        placeholder="年級"
      >


      <input
        id="feedbackStudentId"
        class="input"
        type="text"
        placeholder="學號"
      >


      <input
        id="feedbackName"
        class="input"
        type="text"
        placeholder="姓名"
      >


      <input
        id="feedbackEmail"
        class="input"
        type="email"
        placeholder="Email"
      >


      <textarea
        id="feedbackQuestion"
        class="input"
        placeholder="請輸入您的問題或意見..."
      ></textarea>


      <button
        id="feedbackButton"
        type="button"
        class="button"
        onclick="sendFeedback()"
      >
        送出問題
      </button>


      <div
        id="feedbackMessageBox"
        class="message"
      ></div>

    </div>


    <!-- ==========================================
         Debug
         ========================================== -->

    <div
      id="debugBox"
      class="debug"
    ></div>


    <!-- ==========================================
         Footer
         ========================================== -->

    <div class="footer">

      實踐大學體育室

      <br>

      LINE 智慧服務中心

      <br>

      © Shih Chien University

    </div>

  </div>


  <!-- ==========================================
       LIFF SDK
       ========================================== -->

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <script>

    /* ==========================================
       系統設定
       ========================================== */

    const LIFF_ID =
      '2011040456-bmrz6CGx';


    const API_URL =
      'https://script.google.com/macros/s/AKfycbxXooVgRx7_JPDS7TqdkXDU86PwEAL81rHQtQY_oI4X3avgzwNbAPeaXtYO5A996fyZ5g/exec';


    /* ==========================================
       LINE 使用者資料
       ========================================== */

    let lineProfile = {
      userId: '',
      displayName: ''
    };


    /* ==========================================
       頁面載入
       ========================================== */

    window.addEventListener(
      'load',
      initLIFF
    );


    /* ==========================================
       LIFF 初始化
       ========================================== */

    async function initLIFF() {

      const status =
        document.getElementById(
          'userStatus'
        );


      try {

        setStatus(
          'loading',
          '正在載入 LINE 智慧服務...'
        );


        /* --------------------------------------
           檢查 LIFF SDK
           -------------------------------------- */

        if (
          typeof liff === 'undefined'
        ) {

          throw new Error(
            'LIFF SDK 載入失敗'
          );

        }


        /* --------------------------------------
           LIFF init
           -------------------------------------- */

        await liff.init({
          liffId: LIFF_ID
        });


        console.log(
          'LIFF 初始化成功'
        );


        /* --------------------------------------
           判斷登入
           -------------------------------------- */

        if (
          !liff.isLoggedIn()
        ) {

          setStatus(
            'loading',
            '正在登入 LINE...'
          );


          liff.login({
            redirectUri:
              window.location.href
          });


          return;

        }


        /* --------------------------------------
           取得 LINE Profile
           -------------------------------------- */

        let profile = null;


        try {

          profile =
            await liff.getProfile();

        }

        catch (profileError) {

          console.warn(
            '取得 LINE Profile 失敗：',
            profileError
          );

        }


        if (profile) {

          lineProfile.userId =
            profile.userId || '';

          lineProfile.displayName =
            profile.displayName ||
            'LINE 使用者';

        }

        else {

          lineProfile.displayName =
            'LINE 使用者';

        }


        setStatus(
          'success',
          '您好，' +
          lineProfile.displayName +
          ' 👋'
        );


        /* --------------------------------------
           測試 GAS API
           -------------------------------------- */

        pingAPI();

      }

      catch (error) {

        console.error(
          'LIFF 初始化錯誤：',
          error
        );


        setStatus(
          'error',
          'LINE 初始化失敗'
        );


        showMessage(
          document.getElementById(
            'courseMessage'
          ),
          'LIFF 初始化失敗：' +
          getErrorMessage(error),
          'error'
        );


        showDebug(
          'LIFF 錯誤：' +
          getErrorMessage(error)
        );

      }

    }


    /* ==========================================
       狀態顯示
       ========================================== */

    function setStatus(
      type,
      text
    ) {

      const dot =
        document.getElementById(
          'statusDot'
        );


      const status =
        document.getElementById(
          'userStatus'
        );


      dot.className =
        'status-dot ' +
        type;


      status.textContent =
        text;

    }


    /* ==========================================
       JSONP API
       ========================================== */

    function callAPI(
      params,
      callback
    ) {

      const callbackName =
        'apiCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      const requestParams =
        Object.assign(
          {},
          params
        );


      requestParams.callback =
        callbackName;


      const query =
        Object.keys(requestParams)

          .map(
            function(key) {

              return (
                encodeURIComponent(key) +
                '=' +
                encodeURIComponent(
                  requestParams[key]
                )
              );

            }
          )

          .join('&');


      const script =
        document.createElement(
          'script'
        );


      let finished = false;


      let timeoutId =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished = true;


            cleanup();


            callback({
              success: false,
              error:
                'API 連線逾時，請稍後再試。'
            });

          },
          15000
        );


      window[callbackName] =
        function(data) {

          if (finished) {
            return;
          }


          finished = true;


          clearTimeout(
            timeoutId
          );


          cleanup();


          callback(
            data
          );

        };


      function cleanup() {

        if (
          script &&
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        try {

          delete window[
            callbackName
          ];

        }

        catch (e) {

          window[
            callbackName
          ] = undefined;

        }

      }


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished = true;


          clearTimeout(
            timeoutId
          );


          cleanup();


          callback({
            success: false,
            error:
              '無法連線至 GAS ② API。'
          });

        };


      script.src =
        API_URL +
        '?' +
        query;


      console.log(
        'API Request:',
        script.src
      );


      document.body.appendChild(
        script
      );

    }


    /* ==========================================
       GAS API Ping
       ========================================== */

    function pingAPI() {

      callAPI(

        {
          action: 'ping'
        },

        function(result) {

          console.log(
            'GAS ② ping：',
            result
          );


          if (
            result &&
            result.success
          ) {

            console.log(
              'GAS ② API 連線成功'
            );


            showDebug(
              'GAS ② API 連線成功'
            );

          }

          else {

            console.error(
              'GAS ② API 錯誤：',
              result
            );


            showMessage(

              document.getElementById(
                'courseMessage'
              ),

              result &&
              result.error
                ? result.error
                : 'GAS ② API 連線失敗。',

              'error'

            );


            showDebug(
              'GAS ② API 連線失敗：' +
              JSON.stringify(result)
            );

          }

        }

      );

    }


    /* ==========================================
       Tabs
       ========================================== */

    function showTab(
      name
    ) {

      const panels =
        document.querySelectorAll(
          '.panel'
        );


      panels.forEach(
        function(panel) {

          panel.classList.remove(
            'active'
          );

        }
      );


      const tabs =
        document.querySelectorAll(
          '.tab'
        );


      tabs.forEach(
        function(tab) {

          tab.classList.remove(
            'active'
          );

        }
      );


      const target =
        document.getElementById(
          name + 'Panel'
        );


      if (!target) {
        return;
      }


      target.classList.add(
        'active'
      );


      const index = {
        course: 0,
        faq: 1,
        feedback: 2
      };


      if (
        typeof index[name] !==
        'undefined'
      ) {

        tabs[
          index[name]
        ].classList.add(
          'active'
        );

      }

    }


    /* ==========================================
       課程 Enter
       ========================================== */

    function courseEnter(
      event
    ) {

      if (
        event.key === 'Enter'
      ) {

        event.preventDefault();

        searchCourse();

      }

    }


    /* ==========================================
       課程查詢
       ========================================== */

    function searchCourse() {

      const keyword =
        document
          .getElementById(
            'courseKeyword'
          )
          .value
          .trim();


      const resultBox =
        document.getElementById(
          'courseResult'
        );


      const messageBox =
        document.getElementById(
          'courseMessage'
        );


      if (!keyword) {

        resultBox.innerHTML =
          '';


        showMessage(
          messageBox,
          '請輸入查詢關鍵字。',
          'error'
        );


        return;

      }


      const button =
        document.getElementById(
          'courseButton'
        );


      button.disabled = true;

      button.textContent =
        '查詢中...';


      resultBox.innerHTML =
        '<div class="loading">' +
        '正在查詢課程...' +
        '</div>';


      messageBox.className =
        'message';


      callAPI(

        {
          action: 'course',
          keyword: keyword
        },

        function(result) {

          button.disabled = false;

          button.textContent =
            '查詢課程';


          if (
            !result ||
            !result.success
          ) {

            resultBox.innerHTML =
              '';


            showMessage(

              messageBox,

              result &&
              result.error
                ? result.error
                : '課程查詢失敗。',

              'error'

            );


            return;

          }


          renderCourses(
            result.data || []
          );

        }

      );

    }


    /* ==========================================
       顯示課程
       ========================================== */

    function renderCourses(
      courses
    ) {

      const box =
        document.getElementById(
          'courseResult'
        );


      if (
        !Array.isArray(courses) ||
        courses.length === 0
      ) {

        box.innerHTML =
          '<div class="empty">' +
          '找不到符合條件的課程。' +
          '</div>';


        return;

      }


      box.innerHTML =
        courses

          .map(
            function(course) {

              const code =
                escapeHTML(
                  course.code
                );


              const name =
                escapeHTML(
                  course.name
                );


              const teacher =
                escapeHTML(
                  course.teacher
                );


              const time =
                escapeHTML(
                  course.time
                );


              const location =
                escapeHTML(
                  course.location
                );


              const limit =
                escapeHTML(
                  course.limit ===
                  undefined ||
                  course.limit ===
                  null ||
                  course.limit === ''
                    ? '未提供'
                    : course.limit
                );


              const note =
                escapeHTML(
                  course.note
                );


              return (

                '<div class="card">' +

                  '<div class="card-title">' +

                    code +

                    (
                      name
                        ? '｜' + name
                        : ''
                    ) +

                  '</div>' +

                  '<div class="card-row">' +

                    '<strong>教師：</strong>' +

                    teacher +

                  '</div>' +

                  '<div class="card-row">' +

                    '<strong>時間：</strong>' +

                    time +

                  '</div>' +

                  '<div class="card-row">' +

                    '<strong>地點：</strong>' +

                    location +

                  '</div>' +

                  '<div class="card-row">' +

                    '<strong>名額：</strong>' +

                    limit +

                  '</div>' +

                  (
                    note
                      ? (
                        '<div class="card-row">' +
                        '<strong>備註：</strong>' +
                        note +
                        '</div>'
                      )
                      : ''
                  ) +

                '</div>'

              );

            }
          )

          .join('');

    }


    /* ==========================================
       FAQ Enter
       ========================================== */

    function faqEnter(
      event
    ) {

      if (
        event.key === 'Enter'
      ) {

        event.preventDefault();

        searchFAQ();

      }

    }


    /* ==========================================
       FAQ
       ========================================== */

    function searchFAQ() {

      const keyword =
        document
          .getElementById(
            'faqKeyword'
          )
          .value
          .trim();


      const resultBox =
        document.getElementById(
          'faqResult'
        );


      const messageBox =
        document.getElementById(
          'faqMessage'
        );


      if (!keyword) {

        resultBox.innerHTML =
          '';


        showMessage(
          messageBox,
          '請輸入 FAQ 關鍵字。',
          'error'
        );


        return;

      }


      const button =
        document.getElementById(
          'faqButton'
        );


      button.disabled = true;

      button.textContent =
        '搜尋中...';


      resultBox.innerHTML =
        '<div class="loading">' +
        '正在搜尋 FAQ...' +
        '</div>';


      messageBox.className =
        'message';


      callAPI(

        {
          action: 'faq',
          keyword: keyword
        },

        function(result) {

          button.disabled = false;

          button.textContent =
            '搜尋 FAQ';


          if (
            !result ||
            !result.success
          ) {

            resultBox.innerHTML =
              '';


            showMessage(

              messageBox,

              result &&
              result.error
                ? result.error
                : 'FAQ 查詢失敗。',

              'error'

            );


            return;

          }


          renderFAQ(
            result.data || []
          );

        }

      );

    }


    /* ==========================================
       顯示 FAQ
       ========================================== */

    function renderFAQ(
      list
    ) {

      const box =
        document.getElementById(
          'faqResult'
        );


      if (
        !Array.isArray(list) ||
        list.length === 0
      ) {

        box.innerHTML =
          '<div class="empty">' +
          '找不到符合條件的 FAQ。' +
          '</div>';


        return;

      }


      box.innerHTML =
        list

          .map(
            function(item) {

              return (

                '<div class="card faq-card">' +

                  '<div class="faq-question">' +

                    '❓ ' +

                    escapeHTML(
                      item.keyword
                    ) +

                  '</div>' +

                  '<div class="faq-answer">' +

                    escapeHTML(
                      item.answer
                    ) +

                  '</div>' +

                '</div>'

              );

            }
          )

          .join('');

    }


    /* ==========================================
       意見回饋
       ========================================== */

    function sendFeedback() {

      const department =
        document
          .getElementById(
            'feedbackDepartment'
          )
          .value
          .trim();


      const grade =
        document
          .getElementById(
            'feedbackGrade'
          )
          .value
          .trim();


      const studentId =
        document
          .getElementById(
            'feedbackStudentId'
          )
          .value
          .trim();


      const name =
        document
          .getElementById(
            'feedbackName'
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            'feedbackEmail'
          )
          .value
          .trim();


      const question =
        document
          .getElementById(
            'feedbackQuestion'
          )
          .value
          .trim();


      const box =
        document.getElementById(
          'feedbackMessageBox'
        );


      if (!question) {

        showMessage(
          box,
          '請輸入您的問題或意見內容。',
          'error'
        );


        return;

      }


      const button =
        document.getElementById(
          'feedbackButton'
        );


      button.disabled = true;

      button.textContent =
        '送出中...';


      box.className =
        'message';


      callAPI(

        {
          action: 'feedback',

          department:
            department,

          grade:
            grade,

          studentId:
            studentId,

          name:
            name,

          email:
            email,

          question:
            question
        },

        function(result) {

          button.disabled = false;

          button.textContent =
            '送出問題';


          if (
            !result ||
            !result.success
          ) {

            showMessage(

              box,

              result &&
              result.error
                ? result.error
                : '問題送出失敗。',

              'error'

            );


            return;

          }


          showMessage(

            box,

            result.data &&
            result.data.message

              ? result.data.message

              : '已收到您的問題，謝謝您的回饋！',

            'success'

          );


          document
            .getElementById(
              'feedbackDepartment'
            )
            .value = '';


          document
            .getElementById(
              'feedbackGrade'
            )
            .value = '';


          document
            .getElementById(
              'feedbackStudentId'
            )
            .value = '';


          document
            .getElementById(
              'feedbackName'
            )
            .value = '';


          document
            .getElementById(
              'feedbackEmail'
            )
            .value = '';


          document
            .getElementById(
              'feedbackQuestion'
            )
            .value = '';

        }

      );

    }


    /* ==========================================
       Message
       ========================================== */

    function showMessage(
      element,
      text,
      type
    ) {

      if (!element) {
        return;
      }


      element.textContent =
        text;


      element.className =
        'message show ' +
        (
          type || ''
        );

    }


    /* ==========================================
       Debug
       ========================================== */

    function showDebug(
      text
    ) {

      const box =
        document.getElementById(
          'debugBox'
        );


      if (!box) {
        return;
      }


      box.textContent =
        text;


      box.classList.add(
        'show'
      );

    }


    /* ==========================================
       Error
       ========================================== */

    function getErrorMessage(
      error
    ) {

      if (!error) {
        return '未知錯誤';
      }


      if (
        error.message
      ) {

        return error.message;

      }


      return String(
        error
      );

    }


    /* ==========================================
       HTML 安全處理
       ========================================== */

    function escapeHTML(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return '';

      }


      return String(value)

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }

  </script>
