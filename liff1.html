<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>智慧服務｜實踐大學體育室</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background: linear-gradient(180deg, #eef7ff 0%, #f7f9fc 100%);
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    Arial,
    sans-serif;
}

/* =========================
   Header
========================= */

.header {
  background: linear-gradient(135deg, #0066a1, #0089c9);
  color: #fff;
  text-align: center;
  padding: 28px 20px 30px;
  border-radius: 0 0 26px 26px;
  box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

.logo {
  width: 68px;
  height: 68px;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: #fff;
  color: #0066a1;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 30px;
  font-weight: bold;
}

.header h1 {
  margin: 0;
  font-size: 23px;
}

.header p {
  margin: 8px 0 0;
  font-size: 13px;
  opacity: .92;
}

/* =========================
   Container
========================= */

.container {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 18px 16px 40px;
}

/* =========================
   LINE status
========================= */

.user {
  background: #fff;
  border-radius: 14px;
  padding: 12px 15px;
  margin-bottom: 14px;

  box-shadow: 0 3px 12px rgba(0,0,0,.05);

  font-size: 13px;
  color: #666;
  text-align: center;
}

.status-dot {
  display: inline-block;

  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: #999;

  margin-right: 6px;
}

.status-dot.ok {
  background: #06c755;
}

.status-dot.error {
  background: #e53935;
}

.status-dot.loading {
  background: #f5a623;
}

/* =========================
   API status
========================= */

.api-status {
  display: none;

  background: #fff;
  border-radius: 12px;

  padding: 10px 12px;
  margin-bottom: 14px;

  font-size: 12px;
  line-height: 1.6;

  color: #666;
}

.api-status.show {
  display: block;
}

.api-status.success {
  background: #eefaf3;
  color: #087f3e;
}

.api-status.error {
  background: #fff1f1;
  color: #c62828;
}

/* =========================
   Tabs
========================= */

.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 15px;
}

.tab {
  border: none;
  background: #fff;

  padding: 13px 5px;

  border-radius: 12px;

  font-size: 14px;
  font-weight: bold;

  color: #555;

  box-shadow: 0 2px 8px rgba(0,0,0,.05);

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.tab.active {
  background: #0066a1;
  color: #fff;
}

/* =========================
   Panel
========================= */

.panel {
  display: none;

  background: #fff;

  border-radius: 18px;

  padding: 18px;

  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.panel.active {
  display: block;
}

.panel h2 {
  margin: 0 0 8px;
  font-size: 19px;
}

.description {
  color: #777;
  font-size: 13px;
  line-height: 1.7;
  margin-bottom: 15px;
}

/* =========================
   Input
========================= */

.input {
  width: 100%;

  border: 1px solid #ddd;

  border-radius: 11px;

  padding: 12px;

  font-size: 15px;

  outline: none;

  margin-bottom: 10px;

  background: #fff;
  color: #333;
}

.input:focus {
  border-color: #1683c5;

  box-shadow:
    0 0 0 2px rgba(22,131,197,.08);
}

textarea.input {
  min-height: 130px;
  resize: vertical;
}

/* =========================
   Button
========================= */

.button {
  width: 100%;

  border: none;

  border-radius: 11px;

  padding: 13px;

  background: #0066a1;

  color: #fff;

  font-size: 15px;
  font-weight: bold;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.button:active {
  transform: scale(.98);
}

.button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

/* =========================
   Message
========================= */

.message {
  display: none;

  margin-top: 12px;

  padding: 11px;

  border-radius: 10px;

  background: #f2f7fa;

  color: #666;

  font-size: 13px;

  line-height: 1.6;
}

.message.show {
  display: block;
}

.message.success {
  background: #eefaf3;
  color: #07883a;
}

.message.error {
  background: #fff2f2;
  color: #c62828;
}

/* =========================
   Result
========================= */

.result {
  margin-top: 15px;
}

/* =========================
   Card
========================= */

.card {
  background: #f8fafc;

  border-radius: 13px;

  padding: 14px;

  margin-bottom: 10px;

  border-left: 4px solid #1683c5;
}

.card-title {
  font-size: 16px;
  font-weight: bold;

  margin-bottom: 8px;

  color: #222;
}

.card-row {
  font-size: 13px;
  color: #555;

  line-height: 1.7;
}

.card-row strong {
  color: #333;
}

/* =========================
   FAQ
========================= */

.faq-card {
  border-left-color: #ef8b2c;
}

.faq-question {
  font-weight: bold;

  margin-bottom: 7px;

  font-size: 15px;
}

.faq-answer {
  font-size: 13px;

  line-height: 1.8;

  color: #555;

  white-space: pre-wrap;
}

/* =========================
   Loading
========================= */

.loading {
  text-align: center;

  color: #888;

  padding: 20px 5px;

  font-size: 13px;
}

/* =========================
   Empty
========================= */

.empty {
  text-align: center;

  color: #999;

  padding: 25px 5px;

  font-size: 13px;
}

/* =========================
   Footer
========================= */

.footer {
  margin-top: 25px;

  text-align: center;

  color: #999;

  font-size: 12px;

  line-height: 1.7;
}

/* =========================
   Debug
========================= */

.debug {
  display: none;

  margin-top: 12px;

  background: #222;

  color: #eee;

  border-radius: 10px;

  padding: 10px;

  font-size: 11px;

  line-height: 1.5;

  word-break: break-all;
}

.debug.show {
  display: block;
}

/* =========================
   Mobile
========================= */

@media (max-width: 360px) {

  .container {
    padding-left: 12px;
    padding-right: 12px;
  }

  .tab {
    font-size: 13px;
  }

}
</style>
</head>

<body>

<!-- =========================
     Header
========================= -->

<div class="header">

  <div class="logo">
    體
  </div>

  <h1>
    智慧服務
  </h1>

  <p>
    實踐大學體育室 LINE 智慧服務
  </p>

</div>


<div class="container">

  <!-- =========================
       LINE User
  ========================= -->

  <div class="user">

    <span
      id="statusDot"
      class="status-dot loading"
    ></span>

    <span id="userStatus">
      正在初始化服務...
    </span>

  </div>


  <!-- =========================
       API Status
  ========================= -->

  <div
    id="apiStatus"
    class="api-status"
  ></div>


  <!-- =========================
       Tabs
  ========================= -->

  <div class="tabs">

    <button
      type="button"
      class="tab active"

    <button

  <div

    <button

      class="button"

    <div

  <div

    </div>

    <input

</div>


<!-- =========================
     LIFF SDK
========================= -->

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<script>

/* =========================================================
   設定
========================================================= */

const LIFF_ID = '2011040456-bmrz6CGx';

const API_URL =
  'https://script.google.com/macros/s/AKfycbxXooVgRx7_JPDS7TqdkXDU86PwEAL81rHQtQY_oI4X3avgzwNbAPeaXtYO5A996fyZ5g/exec';


/* =========================================================
   LINE Profile
========================================================= */

let lineProfile = {
  userId: '',
  displayName: ''
};


/* =========================================================
   頁面啟動
========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    /*
     * 非常重要：
     * 先讓頁面正常顯示。
     * 不把畫面顯示綁在 LIFF init。
     */

    setStatus(
      '智慧服務已載入',
      'loading'
    );

    /*
     * API 與 LIFF 分開測試。
     */

    testAPI();

    initLIFF();

  }
);


/* =========================================================
   設定 LINE 狀態
========================================================= */

function setStatus(
  text,
  type
) {

  const status =
    document.getElementById(
      'userStatus'
    );

  const dot =
    document.getElementById(
      'statusDot'
    );

  if (status) {
    status.textContent = text;
  }

  if (dot) {

    dot.className =
      'status-dot ' +
      (
        type || ''
      );

  }

}


/* =========================================================
   API 狀態
========================================================= */

function showAPIStatus(
  text,
  type
) {

  const box =
    document.getElementById(
      'apiStatus'
    );

  if (!box) {
    return;
  }

  box.textContent = text;

  box.className =
    'api-status show ' +
    (
      type || ''
    );

}


/* =========================================================
   LIFF 初始化
========================================================= */

async function initLIFF() {

  try {

    /*
     * 檢查 SDK
     */

    if (
      typeof liff === 'undefined'
    ) {

      console.warn(
        'LIFF SDK 尚未載入'
      );

      setStatus(
        '智慧服務已載入',
        'error'
      );

      return;

    }


    /*
     * LIFF init
     */

    await liff.init({
      liffId: LIFF_ID
    });


    console.log(
      'LIFF init OK'
    );


    /*
     * LINE App 內
     */

    if (
      liff.isInClient()
    ) {

      try {

        const profile =
          await liff.getProfile();

        lineProfile.userId =
          profile.userId || '';

        lineProfile.displayName =
          profile.displayName ||
          'LINE 使用者';

        setStatus(
          '您好，' +
          lineProfile.displayName +
          ' 👋',
          'ok'
        );

      }
      catch (profileError) {

        console.warn(
          'getProfile 失敗',
          profileError
        );

        setStatus(
          'LINE 已連線',
          'ok'
        );

      }

      return;

    }


    /*
     * LINE App 外
     */

    if (
      !liff.isLoggedIn()
    ) {

      setStatus(
        '請登入 LINE 後使用',
        'loading'
      );

      /*
       * 不在頁面載入時強制 liff.login。
       * 避免 GitHub Pages / LIFF redirect
       * 造成空白或循環。
       */

      return;

    }


    /*
     * 已登入
     */

    try {

      const profile =
        await liff.getProfile();

      lineProfile.userId =
        profile.userId || '';

      lineProfile.displayName =
        profile.displayName ||
        'LINE 使用者';

      setStatus(
        '您好，' +
        lineProfile.displayName +
        ' 👋',
        'ok'
      );

    }
    catch (profileError) {

      console.warn(
        'Profile error',
        profileError
      );

      setStatus(
        'LINE 已連線',
        'ok'
      );

    }

  }
  catch (error) {

    console.error(
      'LIFF 初始化失敗',
      error
    );

    /*
     * 注意：
     * LIFF 失敗不能讓整頁消失。
     */

    setStatus(
      '智慧服務已載入',
      'error'
    );

    showDebug(
      'LIFF：' +
      (
        error.message ||
        String(error)
      )
    );

  }

}


/* =========================================================
   測試 GAS API
========================================================= */

function testAPI() {

  showAPIStatus(
    '正在連線智慧服務 API...',
    ''
  );

  callAPI(
    {
      action: 'ping'
    },
    function(result) {

      console.log(
        'API ping result:',
        result
      );


      if (
        result &&
        result.success === true
      ) {

        showAPIStatus(
          '✓ 智慧服務 API 已連線',
          'success'
        );

        return;

      }


      showAPIStatus(
        '✕ API 無法連線：' +
        (
          result &&
          result.error
            ? result.error
            : '未知錯誤'
        ),
        'error'
      );


      showDebug(
        JSON.stringify(
          result || {},
          null,
          2
        )
      );

    }
  );

}


/* =========================================================
   JSONP API
========================================================= */

function callAPI(
  params,
  callback
) {

  const callbackName =
    'sportsAPI_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 1000000
    );


  const requestParams =
    Object.assign(
      {},
      params || {}
    );


  requestParams.callback =
    callbackName;


  const query =
    Object.keys(
      requestParams
    )
      .map(
        function(key) {

          return (
            encodeURIComponent(key) +
            '=' +
            encodeURIComponent(
              requestParams[key]
            )
          );

        }
      )
      .join('&');


  const script =
    document.createElement(
      'script'
    );


  let finished = false;


  const timer =
    setTimeout(
      function() {

        if (finished) {
          return;
        }

        finished = true;

        cleanup();

        callback({
          success: false,
          error:
            'API 連線逾時。'
        });

      },
      15000
    );


  window[callbackName] =
    function(data) {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timer);

      cleanup();

      callback(
        data
      );

    };


  function cleanup() {

    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

    try {

      delete window[
        callbackName
      ];

    }
    catch (e) {

      window[
        callbackName
      ] = undefined;

    }

  }


  script.onerror =
    function() {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timer);

      cleanup();

      callback({
        success: false,
        error:
          '無法載入 GAS API。'
      });

    };


  script.src =
    API_URL +
    '?' +
    query;


  document.body.appendChild(
    script
  );

}


/* =========================================================
   Tabs
========================================================= */

function showTab(
  name
) {

  const panels =
    document.querySelectorAll(
      '.panel'
    );


  panels.forEach(
    function(panel) {

      panel.classList.remove(
        'active'
      );

    }
  );


  const tabs =
    document.querySelectorAll(
      '.tab'
    );


  tabs.forEach(
    function(tab) {

      tab.classList.remove(
        'active'
      );

    }
  );


  const panel =
    document.getElementById(
      name + 'Panel'
    );


  if (!panel) {
    return;
  }


  panel.classList.add(
    'active'
  );


  const index = {
    course: 0,
    faq: 1,
    feedback: 2
  };


  if (
    index[name] !== undefined &&
    tabs[index[name]]
  ) {

    tabs[index[name]]
      .classList.add(
        'active'
      );

  }

}


/* =========================================================
   Course Enter
========================================================= */

function courseEnter(
  event
) {

  if (
    event.key === 'Enter'
  ) {

    event.preventDefault();

    searchCourse();

  }

}


/* =========================================================
   課程查詢
========================================================= */

function searchCourse() {

  const input =
    document.getElementById(
      'courseKeyword'
    );

  const resultBox =
    document.getElementById(
      'courseResult'
    );

  const messageBox =
    document.getElementById(
      'courseMessage'
    );

  const button =
    document.getElementById(
      'courseButton'
    );


  const keyword =
    input.value.trim();


  if (!keyword) {

    resultBox.innerHTML = '';

    showMessage(
      messageBox,
      '請輸入查詢關鍵字。',
      'error'
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    '查詢中...';


  messageBox.className =
    'message';


  resultBox.innerHTML =
    '<div class="loading">' +
    '正在查詢課程...' +
    '</div>';


  callAPI(
    {
      action: 'course',
      keyword: keyword
    },
    function(result) {

      button.disabled = false;

      button.textContent =
        '查詢課程';


      if (
        !result ||
        result.success !== true
      ) {

        resultBox.innerHTML = '';

        showMessage(
          messageBox,
          result &&
          result.error
            ? result.error
            : '課程查詢失敗。',
          'error'
        );

        return;

      }


      renderCourses(
        result.data
      );

    }
  );

}


/* =========================================================
   顯示課程
========================================================= */

function renderCourses(
  courses
) {

  const box =
    document.getElementById(
      'courseResult'
    );


  if (
    !Array.isArray(courses) ||
    courses.length === 0
  ) {

    box.innerHTML =
      '<div class="empty">' +
      '找不到符合條件的課程。' +
      '</div>';

    return;

  }


  box.innerHTML =
    courses
      .map(
        function(course) {

          const code =
            escapeHTML(
              course.code
            );

          const name =
            escapeHTML(
              course.name
            );

          const teacher =
            escapeHTML(
              course.teacher
            );

          const time =
            escapeHTML(
              course.time
            );

          const location =
            escapeHTML(
              course.location
            );

          const limit =
            escapeHTML(
              course.limit
            );

          const note =
            escapeHTML(
              course.note
            );


          return (

            '<div class="card">' +

              '<div class="card-title">' +

                code +

                (
                  name
                    ? '｜' + name
                    : ''
                ) +

              '</div>' +

              '<div class="card-row">' +
                '<strong>教師：</strong>' +
                teacher +
              '</div>' +

              '<div class="card-row">' +
                '<strong>時間：</strong>' +
                time +
              '</div>' +

              '<div class="card-row">' +
                '<strong>地點：</strong>' +
                location +
              '</div>' +

              '<div class="card-row">' +
                '<strong>名額：</strong>' +
                limit +
              '</div>' +

              (
                note
                  ? (
                    '<div class="card-row">' +
                    '<strong>備註：</strong>' +
                    note +
                    '</div>'
                  )
                  : ''
              ) +

            '</div>'

          );

        }
      )
      .join('');

}


/* =========================================================
   FAQ Enter
========================================================= */

function faqEnter(
  event
) {

  if (
    event.key === 'Enter'
  ) {

    event.preventDefault();

    searchFAQ();

  }

}


/* =========================================================
   FAQ
========================================================= */

function searchFAQ() {

  const input =
    document.getElementById(
      'faqKeyword'
    );

  const resultBox =
    document.getElementById(
      'faqResult'
    );

  const messageBox =
    document.getElementById(
      'faqMessage'
    );

  const button =
    document.getElementById(
      'faqButton'
    );


  const keyword =
    input.value.trim();


  if (!keyword) {

    resultBox.innerHTML = '';

    showMessage(
      messageBox,
      '請輸入 FAQ 關鍵字。',
      'error'
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    '搜尋中...';


  messageBox.className =
    'message';


  resultBox.innerHTML =
    '<div class="loading">' +
    '正在搜尋 FAQ...' +
    '</div>';


  callAPI(
    {
      action: 'faq',
      keyword: keyword
    },
    function(result) {

      button.disabled = false;

      button.textContent =
        '搜尋 FAQ';


      if (
        !result ||
        result.success !== true
      ) {

        resultBox.innerHTML = '';

        showMessage(
          messageBox,
          result &&
          result.error
            ? result.error
            : 'FAQ 查詢失敗。',
          'error'
        );

        return;

      }


      renderFAQ(
        result.data
      );

    }
  );

}


/* =========================================================
   顯示 FAQ
========================================================= */

function renderFAQ(
  list
) {

  const box =
    document.getElementById(
      'faqResult'
    );


  if (
    !Array.isArray(list) ||
    list.length === 0
  ) {

    box.innerHTML =
      '<div class="empty">' +
      '找不到符合條件的 FAQ。' +
      '</div>';

    return;

  }


  box.innerHTML =
    list
      .map(
        function(item) {

          return (

            '<div class="card faq-card">' +

              '<div class="faq-question">' +
                '❓ ' +
                escapeHTML(
                  item.keyword
                ) +
              '</div>' +

              '<div class="faq-answer">' +
                escapeHTML(
                  item.answer
                ) +
              '</div>' +

            '</div>'

          );

        }
      )
      .join('');

}


/* =========================================================
   意見回饋
========================================================= */

function sendFeedback() {

  const department =
    document.getElementById(
      'feedbackDepartment'
    ).value.trim();

  const grade =
    document.getElementById(
      'feedbackGrade'
    ).value.trim();

  const studentId =
    document.getElementById(
      'feedbackStudentId'
    ).value.trim();

  const name =
    document.getElementById(
      'feedbackName'
    ).value.trim();

  const email =
    document.getElementById(
      'feedbackEmail'
    ).value.trim();

  const question =
    document.getElementById(
      'feedbackQuestion'
    ).value.trim();

  const box =
    document.getElementById(
      'feedbackMessageBox'
    );

  const button =
    document.getElementById(
      'feedbackButton'
    );


  if (!question) {

    showMessage(
      box,
      '請輸入您的問題或意見內容。',
      'error'
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    '送出中...';


  box.className =
    'message';


  callAPI(
    {
      action: 'feedback',

      department: department,

      grade: grade,

      studentId: studentId,

      name: name,

      email: email,

      question: question

    },
    function(result) {

      button.disabled = false;

      button.textContent =
        '送出問題';


      if (
        !result ||
        result.success !== true
      ) {

        showMessage(
          box,
          result &&
          result.error
            ? result.error
            : '問題送出失敗。',
          'error'
        );

        return;

      }


      showMessage(
        box,

        result.data &&
        result.data.message
          ? result.data.message
          : '已收到您的問題，謝謝您的回饋！',

        'success'
      );


      document.getElementById(
        'feedbackDepartment'
      ).value = '';

      document.getElementById(
        'feedbackGrade'
      ).value = '';

      document.getElementById(
        'feedbackStudentId'
      ).value = '';

      document.getElementById(
        'feedbackName'
      ).value = '';

      document.getElementById(
        'feedbackEmail'
      ).value = '';

      document.getElementById(
        'feedbackQuestion'
      ).value = '';

    }
  );

}


/* =========================================================
   Message
========================================================= */

function showMessage(
  element,
  text,
  type
) {

  if (!element) {
    return;
  }


  element.textContent =
    text;


  element.className =
    'message show ' +
    (
      type || ''
    );

}


/* =========================================================
   HTML Escape
========================================================= */

function escapeHTML(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }


  return String(value)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/* =========================================================
   Debug
========================================================= */

function showDebug(
  text
) {

  const box =
    document.getElementById(
      'debug'
    );

  if (!box) {
    return;
  }

  box.textContent =
    text || '';

  box.classList.add(
    'show'
  );

}
