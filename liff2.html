<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>場館使用｜實踐大學體育室</title>

<style>

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {

  margin: 0;

  background:
    linear-gradient(
      180deg,
      #fff8f0 0%,
      #f7f9fc 100%
    );

  color: #333;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}


/* =====================================================
   Header
===================================================== */

.header {

  background:
    linear-gradient(
      135deg,
      #e87918,
      #f39a45
    );

  color: white;

  text-align: center;

  padding: 28px 18px 30px;

  border-radius:
    0 0 28px 28px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.12);
}

.logo {

  width: 68px;
  height: 68px;

  margin:
    0 auto 12px;

  border-radius: 50%;

  background: white;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #e87918;

  font-size: 30px;

  font-weight: bold;
}

.header h1 {

  margin: 5px 0;

  font-size: 23px;
}

.header p {

  margin: 7px 0 0;

  font-size: 13px;

  opacity: .92;
}


/* =====================================================
   Container
===================================================== */

.container {

  width: 100%;

  max-width: 1100px;

  margin: 0 auto;

  padding:
    18px 12px 40px;
}


/* =====================================================
   使用者
===================================================== */

.user-box {

  background: white;

  border-radius: 14px;

  padding:
    11px 14px;

  margin-bottom: 14px;

  color: #666;

  font-size: 13px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);
}


/* =====================================================
   場地選擇
===================================================== */

.select-box {

  background: white;

  border-radius: 18px;

  padding: 18px;

  margin-bottom: 15px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.06);
}

.select-title {

  font-size: 19px;

  font-weight: bold;

  margin-bottom: 6px;
}

.select-description {

  font-size: 13px;

  color: #777;

  line-height: 1.6;

  margin-bottom: 13px;
}

.venue-select {

  width: 100%;

  height: 48px;

  border:
    1px solid #ddd;

  border-radius: 11px;

  background: white;

  padding:
    0 13px;

  font-size: 16px;

  color: #333;

  outline: none;
}

.venue-select:focus {

  border-color: #e87918;

  box-shadow:
    0 0 0 3px
    rgba(232,121,24,.12);
}

.current-venue {

  margin-top: 12px;

  padding:
    10px 12px;

  background:
    #fff6ed;

  border-radius: 10px;

  color: #c46110;

  font-size: 13px;
}


/* =====================================================
   圖例
===================================================== */

.legend {

  background: white;

  border-radius: 15px;

  padding:
    12px 14px;

  margin-bottom: 15px;

  display: flex;

  flex-wrap: wrap;

  align-items: center;

  gap:
    8px 15px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);

  font-size: 12px;

  color: #555;
}

.legend-title {

  font-weight: bold;
}

.legend-item {

  display: inline-flex;

  align-items: center;

  gap: 5px;
}

.legend-dot {

  width: 13px;
  height: 13px;

  border-radius: 50%;
}

.dot-class {
  background: #e53935;
}

.dot-available {
  background: #2e9d50;
}

.dot-reserved {
  background: #e3b800;
}


/* =====================================================
   表格標題
===================================================== */

.table-title {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin:
    0 3px 9px;
}

.table-title-main {

  font-size: 18px;

  font-weight: bold;
}

.table-title-count {

  color: #999;

  font-size: 12px;
}


/* =====================================================
   每一天
===================================================== */

.day-block {

  background: white;

  border-radius: 17px;

  margin-bottom: 16px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.08);

  overflow: hidden;
}

.day-header {

  background:
    #f2f4f6;

  padding:
    13px 15px;

  border-bottom:
    1px solid #ddd;

  font-size: 17px;

  font-weight: bold;

  color: #444;
}

.day-body {

  padding: 10px;
}


/* =====================================================
   時段卡片
===================================================== */

.time-row {

  display: flex;

  align-items: stretch;

  border:
    1px solid #e5e7e9;

  border-radius: 12px;

  overflow: hidden;

  margin-bottom: 8px;

  background: white;
}

.time-row:last-child {

  margin-bottom: 0;
}


/* =====================================================
   時間
===================================================== */

.time-cell {

  width: 125px;

  min-width: 125px;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 10px;

  background:
    #f8f9fa;

  color: #555;

  font-size: 13px;

  font-weight: bold;

  border-right:
    1px solid #e5e7e9;

  text-align: center;
}


/* =====================================================
   狀態
===================================================== */

.status-cell {

  flex: 1;

  padding: 7px;
}

.status {

  width: 100%;

  min-height: 48px;

  padding:
    7px 8px;

  border-radius: 9px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 5px;

  line-height: 1.4;

  font-size: 13px;

  font-weight: bold;

  text-align: center;
}


/* =====================================================
   上課
===================================================== */

.status-class {

  background:
    #ffdede;

  color:
    #c62828;

  border:
    1px solid #ffb0b0;
}


/* =====================================================
   可使用
===================================================== */

.status-available {

  background:
    #ddf5e4;

  color:
    #16833a;

  border:
    1px solid #a4d9b1;
}


/* =====================================================
   已預約
===================================================== */

.status-reserved {

  background:
    #fff2b8;

  color:
    #806500;

  border:
    1px solid #e5cf69;
}


/* =====================================================
   其他
===================================================== */

.status-other {

  background:
    #f1f3f5;

  color:
    #666;

  border:
    1px solid #ddd;
}


/* =====================================================
   Loading
===================================================== */

.loading {

  background: white;

  border-radius: 16px;

  padding:
    32px 15px;

  text-align: center;

  color: #888;

  font-size: 13px;
}


/* =====================================================
   Error
===================================================== */

.error {

  background:
    #fff1f1;

  border:
    1px solid #ffc8c8;

  color:
    #c62828;

  border-radius: 14px;

  padding:
    16px;

  font-size: 13px;

  line-height: 1.7;
}


/* =====================================================
   空資料
===================================================== */

.empty {

  background: white;

  border-radius: 16px;

  padding:
    35px 15px;

  text-align: center;

  color: #999;

  font-size: 13px;
}


/* =====================================================
   更新時間
===================================================== */

.update-time {

  text-align: right;

  margin-top: 8px;

  color: #aaa;

  font-size: 11px;
}


/* =====================================================
   Footer
===================================================== */

.footer {

  margin-top: 25px;

  text-align: center;

  color: #999;

  font-size: 12px;

  line-height: 1.7;
}


/* =====================================================
   手機
===================================================== */

@media (max-width: 600px) {

  .container {

    padding-left: 8px;

    padding-right: 8px;
  }

  .header {

    padding:
      24px 15px 27px;
  }

  .header h1 {

    font-size: 21px;
  }

  .time-cell {

    width: 105px;

    min-width: 105px;

    font-size: 12px;
  }

  .status {

    font-size: 12px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     Header
===================================================== -->

<div class="header">

  <div class="logo">
    館
  </div>

  <h1>
    場館使用
  </h1>

  <p>
    實踐大學體育室 LINE 智慧服務
  </p>

</div>


<div class="container">


<!-- =====================================================
     LINE 使用者
===================================================== -->

<div class="user-box">

  <span id="userStatus">
    正在連線...
  </span>

</div>


<!-- =====================================================
     場地選擇
===================================================== -->

<div class="select-box">

  <div class="select-title">
    🏟️ 選擇場地
  </div>

  <div class="select-description">

    請選擇要查詢的場地，
    下方將依星期顯示各自的使用時段。

  </div>

  <select
    id="venueSelect"
    class="venue-select"
    onchange="changeVenue()"
    disabled
  >

    <option value="">
      正在載入場地...
    </option>

  </select>

  <div
    id="currentVenue"
    class="current-venue"
    style="display:none;"
  ></div>

</div>


<!-- =====================================================
     圖例
===================================================== -->

<div class="legend">

  <span class="legend-title">
    狀態：
  </span>

  <span class="legend-item">

    <span class="legend-dot dot-class"></span>

    上課

  </span>

  <span class="legend-item">

    <span class="legend-dot dot-available"></span>

    可使用

  </span>

  <span class="legend-item">

    <span class="legend-dot dot-reserved"></span>

    已預約

  </span>

</div>


<!-- =====================================================
     標題
===================================================== -->

<div class="table-title">

  <div
    id="tableTitle"
    class="table-title-main"
  >
    場館使用狀況
  </div>

  <div
    id="tableCount"
    class="table-title-count"
  ></div>

</div>


<!-- =====================================================
     結果
===================================================== -->

<div id="result">

  <div class="loading">
    ⏳ 正在載入場館資料...
  </div>

</div>


<div
  id="updateTime"
  class="update-time"
></div>


<!-- =====================================================
     Footer
===================================================== -->

<div class="footer">

  實踐大學體育室

  <br>

  LINE 智慧服務中心

  <br>

  © Shih Chien University

</div>


</div>


<!-- =====================================================
     LIFF SDK
===================================================== -->

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<script>

/* =====================================================
   設定
===================================================== */

const LIFF_ID =
  '2011024432-afjj4k3z';


const API_URL =
  'https://script.google.com/macros/s/AKfycbxAtGrBNm5axEpPqajl5OZhd-TJlP0Ys-8oov_zWQh_JfVY939-c51fqG0Ae0Sge0pQ/exec';


/* =====================================================
   全部資料
===================================================== */

let allVenueData = [];


/* =====================================================
   目前場地
===================================================== */

let selectedVenue = '';


/* =====================================================
   星期
===================================================== */

const DAYS = [

  '星期一',
  '星期二',
  '星期三',
  '星期四',
  '星期五',
  '星期六',
  '星期日'

];


/* =====================================================
   LINE 使用者
===================================================== */

let lineProfile = {

  userId: '',
  displayName: ''

};


/* =====================================================
   啟動
===================================================== */

window.addEventListener(
  'load',
  initLIFF
);


/* =====================================================
   LIFF
===================================================== */

async function initLIFF() {

  try {

    await liff.init({

      liffId: LIFF_ID

    });


    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }


    const profile =
      await liff.getProfile();


    lineProfile.userId =
      profile.userId || '';


    lineProfile.displayName =
      profile.displayName || '';


    document
      .getElementById('userStatus')
      .textContent =
        '您好，' +
        lineProfile.displayName +
        ' 👋';


    loadVenueData();


  } catch (error) {

    console.error(error);

    document
      .getElementById('userStatus')
      .textContent =
        'LINE 初始化失敗';


    showError(
      'LINE 初始化失敗：' +
      (error.message || error)
    );

  }

}


/* =====================================================
   載入 GAS
===================================================== */

function loadVenueData() {

  showLoading();


  callAPI(

    {
      action: 'all'
    },

    function(result) {

      console.log(
        'GAS 回傳：',
        result
      );


      /* ================================================
         檢查 GAS 回傳
      ================================================= */

      if (!result) {

        showError(
          'GAS 沒有回傳資料。'
        );

        return;

      }


      if (result.success !== true) {

        showError(
          result.error ||
          'GAS 回傳失敗。'
        );

        return;

      }


      /* ================================================
         檢查 data
      ================================================= */

      if (!Array.isArray(result.data)) {

        console.error(
          'GAS data 不是陣列：',
          result.data
        );


        showError(
          'GAS 回傳格式錯誤：data 不是陣列。'
        );

        return;

      }


      /* ================================================
         儲存
      ================================================= */

      allVenueData =
        result.data.map(
          function(item) {

            /*
             * ★★★★★★★★★★★★★★★★★★★★★
             * 這裡明確直接讀 GAS 的四個欄位
             * ★★★★★★★★★★★★★★★★★★★★★
             */

            return {

              weekday:
                String(
                  item.weekday ?? ''
                ).trim(),

              name:
                String(
                  item.name ?? ''
                ).trim(),

              time:
                normalizeTime(
                  item.time
                ),

              status:
                String(
                  item.status ?? ''
                ).trim()

            };

          }
        );


      console.log(
        '整理後資料：',
        allVenueData
      );


      /* ================================================
         檢查是否有 undefined
      ================================================= */

      const invalid =
        allVenueData.filter(
          function(item) {

            return (
              item.weekday === 'undefined' ||
              item.name === 'undefined' ||
              item.time === 'undefined' ||
              item.status === 'undefined'
            );

          }
        );


      if (invalid.length > 0) {

        console.error(
          '發現 undefined 資料：',
          invalid
        );

      }


      buildVenueSelect();


      document
        .getElementById('result')
        .innerHTML =
          '<div class="empty">' +
          '請先選擇場地。' +
          '</div>';


      document
        .getElementById('tableCount')
        .textContent = '';


      updateTime();

    }

  );

}


/* =====================================================
   建立場地選單
===================================================== */

function buildVenueSelect() {

  const select =
    document.getElementById(
      'venueSelect'
    );


  const venues = [];


  allVenueData.forEach(
    function(item) {

      const name =
        item.name;


      if (
        name &&
        name !== 'undefined' &&
        !venues.includes(name)
      ) {

        venues.push(name);

      }

    }
  );


  venues.sort(
    function(a, b) {

      return a.localeCompare(
        b,
        'zh-Hant'
      );

    }
  );


  select.innerHTML = '';


  const defaultOption =
    document.createElement(
      'option'
    );


  defaultOption.value = '';

  defaultOption.textContent =
    '請選擇場地';


  select.appendChild(
    defaultOption
  );


  venues.forEach(
    function(venue) {

      const option =
        document.createElement(
          'option'
        );


      option.value =
        venue;

      option.textContent =
        venue;


      select.appendChild(
        option
      );

    }
  );


  select.disabled = false;


  if (!venues.length) {

    select.innerHTML =
      '<option value="">' +
      '目前沒有場地資料' +
      '</option>';

    select.disabled = true;

  }

}


/* =====================================================
   更換場地
===================================================== */

function changeVenue() {

  const select =
    document.getElementById(
      'venueSelect'
    );


  selectedVenue =
    select.value;


  if (!selectedVenue) {

    document
      .getElementById(
        'currentVenue'
      )
      .style.display =
        'none';


    document
      .getElementById(
        'result'
      )
      .innerHTML =
        '<div class="empty">' +
        '請先選擇場地。' +
        '</div>';


    document
      .getElementById(
        'tableTitle'
      )
      .textContent =
        '場館使用狀況';


    document
      .getElementById(
        'tableCount'
      )
      .textContent =
        '';

    return;

  }


  const currentVenue =
    document.getElementById(
      'currentVenue'
    );


  currentVenue.style.display =
    'block';


  currentVenue.innerHTML =
    '目前查詢：<strong>' +
    escapeHTML(
      selectedVenue
    ) +
    '</strong>';


  renderSchedule();

}


/* =====================================================
   顯示星期資料
===================================================== */

function renderSchedule() {


  /* ===================================================
     只取目前場地
  =================================================== */

  const venueData =
    allVenueData.filter(
      function(item) {

        return (
          item.name ===
          selectedVenue
        );

      }
    );


  if (!venueData.length) {

    document
      .getElementById('result')
      .innerHTML =
        '<div class="empty">' +
        '此場地目前沒有資料。' +
        '</div>';

    return;

  }


  /* ===================================================
     建立星期區塊
  =================================================== */

  let html = '';


  let totalCount = 0;


  DAYS.forEach(
    function(day) {


      /* ================================================
         ★ 只抓這一天
      ================================================= */

      const dayData =
        venueData.filter(
          function(item) {

            return (
              normalizeWeekday(
                item.weekday
              ) === day
            );

          }
        );


      /* ================================================
         該星期沒有資料
      ================================================= */

      if (!dayData.length) {

        return;

      }


      totalCount +=
        dayData.length;


      /* ================================================
         ★★★★★★★★★★★★★★★★★★★★★
         每個星期自己的時間排序
         不與其他星期共用時間
         ★★★★★★★★★★★★★★★★★★★★★
      ================================================= */

      dayData.sort(
        function(a, b) {

          return (
            getStartMinutes(a.time) -
            getStartMinutes(b.time)
          );

        }
      );


      html +=
        '<div class="day-block">';


      html +=
        '<div class="day-header">' +
        day +
        '</div>';


      html +=
        '<div class="day-body">';


      /* ================================================
         該星期的每一個時段
      ================================================= */

      dayData.forEach(
        function(item) {


          /*
           * ★★★ 這裡直接使用 GAS status ★★★
           */

          const status =
            item.status;


          const time =
            item.time;


          html +=
            '<div class="time-row">';


          /* 時間 */

          html +=
            '<div class="time-cell">' +
            escapeHTML(
              time
            ) +
            '</div>';


          /* 狀態 */

          html +=
            '<div class="status-cell">';


          /*
           * ★★★★★★★★★★★★★★★★★★★★★
           * 狀態直接來自：
           *
           * GAS → item.status
           *
           * 不是自己判斷
           * 不是 item.state
           * 不是 item.value
           * ★★★★★★★★★★★★★★★★★★★★★
           */

          html +=
            createStatusHTML(
              status
            );


          html +=
            '</div>';


          html +=
            '</div>';

        }
      );


      html +=
        '</div>';


      html +=
        '</div>';

    }
  );


  if (!html) {

    html =
      '<div class="empty">' +
      '此場地沒有可顯示的星期資料。' +
      '</div>';

  }


  document
    .getElementById('result')
    .innerHTML =
      html;


  document
    .getElementById('tableTitle')
    .textContent =
      selectedVenue +
      ' 使用狀況';


  document
    .getElementById('tableCount')
    .textContent =
      totalCount +
      ' 筆';

}


/* =====================================================
   ★ 狀態
===================================================== */

function createStatusHTML(status) {


  /*
   * ★★★★★★★★★★★★★★★★★★★★★
   *
   * 直接接收 GAS：
   *
   * item.status
   *
   * ★★★★★★★★★★★★★★★★★★★★★
   */

  const text =
    String(
      status ?? ''
    ).trim();


  console.log(
    '目前狀態：',
    text
  );


  let className =
    'status-other';


  let icon =
    '⚪';


  /* ===================================================
     三種狀態
  =================================================== */

  if (text === '上課') {

    className =
      'status-class';

    icon =
      '🔴';

  }

  else if (
    text === '可使用'
  ) {

    className =
      'status-available';

    icon =
      '🟢';

  }

  else if (
    text === '已預約'
  ) {

    className =
      'status-reserved';

    icon =
      '🟡';

  }


  /*
   * 如果 GAS 真的是空白
   */

  if (!text) {

    return `
      <div class="status status-other">
        ⚪ 未設定狀態
      </div>
    `;

  }


  /*
   * 如果真的收到 undefined 字串
   */

  if (
    text.toLowerCase() ===
    'undefined'
  ) {

    console.error(
      'GAS 回傳 status = undefined'
    );


    return `
      <div class="status status-other">
        ⚠️ 狀態資料錯誤
      </div>
    `;

  }


  return (

    '<div class="status ' +
    className +
    '">' +

    '<span>' +
    icon +
    '</span>' +

    '<span>' +
    escapeHTML(
      text
    ) +
    '</span>' +

    '</div>'

  );

}


/* =====================================================
   星期
===================================================== */

function normalizeWeekday(value) {

  let text =
    String(
      value ?? ''
    ).trim();


  text =
    text
      .replace(
        /^週/,
        '星期'
      )
      .replace(
        /^周/,
        '星期'
      );


  if (
    /^[一二三四五六日]$/.test(
      text
    )
  ) {

    text =
      '星期' +
      text;

  }


  return text;

}


/* =====================================================
   時間標準化
===================================================== */

function normalizeTime(value) {

  let text =
    String(
      value ?? ''
    ).trim();


  if (
    !text ||
    text === 'undefined' ||
    text === 'null'
  ) {

    return '';

  }


  /* 全形冒號 */

  text =
    text.replace(
      /：/g,
      ':'
    );


  /* 不同破折號全部統一 */

  text =
    text.replace(
      /–|—|－|~|～/g,
      '-'
    );


  /* 去除左右空白 */

  text =
    text.replace(
      /\s+/g,
      ''
    );


  return text;

}


/* =====================================================
   取得開始分鐘
===================================================== */

function getStartMinutes(value) {

  const text =
    normalizeTime(value);


  /*
   * 支援：
   *
   * 8:00-10:00
   * 08:00-10:00
   * 9:00~21:00
   */

  const match =
    text.match(
      /^(\d{1,2}):(\d{1,2})/
    );


  if (!match) {

    return 99999;

  }


  return (
    Number(match[1]) * 60 +
    Number(match[2])
  );

}


/* =====================================================
   GAS JSONP
===================================================== */

function callAPI(params, callback) {


  const callbackName =
    'venueCallback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );


  params.callback =
    callbackName;


  const query =
    Object.keys(params)
      .map(
        function(key) {

          return (
            encodeURIComponent(key) +
            '=' +
            encodeURIComponent(
              params[key]
            )
          );

        }
      )
      .join('&');


  const script =
    document.createElement(
      'script'
    );


  let finished =
    false;


  const timeout =
    setTimeout(
      function() {

        if (finished) {
          return;
        }


        finished = true;


        cleanup();


        callback({

          success: false,

          error:
            'GAS API 連線逾時'

        });

      },
      15000
    );


  window[callbackName] =
    function(data) {

      if (finished) {
        return;
      }


      finished = true;


      clearTimeout(timeout);


      cleanup();


      callback(data);

    };


  function cleanup() {

    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(script);

    }


    try {

      delete window[
        callbackName
      ];

    }

    catch (e) {

      window[
        callbackName
      ] = undefined;

    }

  }


  script.onerror =
    function() {

      if (finished) {
        return;
      }


      finished = true;


      clearTimeout(timeout);


      cleanup();


      callback({

        success: false,

        error:
          '無法連線至 GAS API'

      });

    };


  /*
   * ★★★ 真正連接 GAS ★★★
   */

  script.src =
    API_URL +
    '?' +
    query;


  console.log(
    '呼叫 GAS：',
    script.src
  );


  document.body.appendChild(
    script
  );

}


/* =====================================================
   Loading
===================================================== */

function showLoading() {

  document
    .getElementById('result')
    .innerHTML =
      '<div class="loading">' +
      '⏳ 正在載入場館資料...' +
      '</div>';

}


/* =====================================================
   Error
===================================================== */

function showError(message) {

  document
    .getElementById('result')
    .innerHTML =
      '<div class="error">' +

      '⚠️ ' +

      escapeHTML(
        message
      ) +

      '<br><br>' +

      '請確認 GAS ③ Web App URL、' +
      '工作表「場館使用」以及四個欄位：' +
      '星期、場地、時間、狀態。' +

      '</div>';

}


/* =====================================================
   更新時間
===================================================== */

function updateTime() {

  const now =
    new Date();


  document
    .getElementById('updateTime')
    .textContent =
      '最後更新：' +
      now.toLocaleString(
        'zh-TW',
        {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        }
      );

}


/* =====================================================
   HTML 安全
===================================================== */

function escapeHTML(value) {

  return String(
    value === null ||
    value === undefined
      ? ''
      : value
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
