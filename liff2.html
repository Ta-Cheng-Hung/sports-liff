<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>場館使用｜實踐大學體育室</title>

<style>

/* =====================================================
   基本
===================================================== */

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: linear-gradient(
    180deg,
    #fff8f0 0%,
    #f7f9fc 100%
  );
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}


/* =====================================================
   Header
===================================================== */

.header {
  background: linear-gradient(
    135deg,
    #e87918,
    #f39a45
  );

  color: white;
  text-align: center;

  padding: 28px 18px 30px;

  border-radius: 0 0 28px 28px;

  box-shadow:
    0 4px 15px rgba(0,0,0,.12);
}

.logo {
  width: 68px;
  height: 68px;

  margin: 0 auto 12px;

  border-radius: 50%;

  background: white;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #e87918;

  font-size: 30px;
  font-weight: bold;
}

.header h1 {
  margin: 5px 0;
  font-size: 23px;
}

.header p {
  margin: 7px 0 0;
  font-size: 13px;
  opacity: .92;
}


/* =====================================================
   Container
===================================================== */

.container {
  width: 100%;
  max-width: 1100px;

  margin: 0 auto;

  padding: 18px 12px 40px;
}


/* =====================================================
   使用者
===================================================== */

.user-box {
  background: white;

  border-radius: 14px;

  padding: 11px 14px;

  margin-bottom: 14px;

  color: #666;

  font-size: 13px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.05);
}


/* =====================================================
   場地選擇
===================================================== */

.select-box {
  background: white;

  border-radius: 18px;

  padding: 18px;

  margin-bottom: 15px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.06);
}

.select-title {
  font-size: 19px;
  font-weight: bold;

  margin-bottom: 6px;
}

.select-description {
  font-size: 13px;
  color: #777;

  line-height: 1.6;

  margin-bottom: 13px;
}

.venue-select {
  width: 100%;

  height: 48px;

  border: 1px solid #ddd;

  border-radius: 11px;

  background: white;

  padding: 0 13px;

  font-size: 16px;

  color: #333;

  outline: none;
}

.venue-select:focus {
  border-color: #e87918;

  box-shadow:
    0 0 0 3px rgba(232,121,24,.12);
}

.current-venue {
  margin-top: 12px;

  padding: 10px 12px;

  background: #fff6ed;

  border-radius: 10px;

  color: #c46110;

  font-size: 13px;
}


/* =====================================================
   圖例
===================================================== */

.legend {
  background: white;

  border-radius: 15px;

  padding: 12px 14px;

  margin-bottom: 15px;

  display: flex;

  flex-wrap: wrap;

  align-items: center;

  gap: 8px 15px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.05);

  font-size: 12px;

  color: #555;
}

.legend-title {
  font-weight: bold;
}

.legend-item {
  display: inline-flex;

  align-items: center;

  gap: 5px;
}

.legend-dot {
  width: 13px;
  height: 13px;

  border-radius: 50%;
}

.dot-class {
  background: #e53935;
}

.dot-available {
  background: #2e9d50;
}

.dot-reserved {
  background: #e3b800;
}


/* =====================================================
   星期區塊
===================================================== */

.day-section {
  background: white;

  border-radius: 17px;

  margin-bottom: 14px;

  overflow: hidden;

  box-shadow:
    0 3px 12px rgba(0,0,0,.07);
}


/* =====================================================
   星期標題
===================================================== */

.day-header {
  padding: 13px 15px;

  background: #f2f4f6;

  border-bottom: 1px solid #e0e3e6;

  display: flex;

  justify-content: space-between;

  align-items: center;
}

.day-name {
  font-size: 18px;

  font-weight: bold;

  color: #444;
}

.day-count {
  font-size: 12px;

  color: #999;
}


/* =====================================================
   星期內容
===================================================== */

.day-content {
  padding: 12px;
}


/* =====================================================
   時間項目
===================================================== */

.time-item {
  display: flex;

  align-items: stretch;

  gap: 10px;

  margin-bottom: 10px;
}

.time-item:last-child {
  margin-bottom: 0;
}


/* =====================================================
   時間
===================================================== */

.time-box {
  width: 105px;

  min-width: 105px;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #f7f8fa;

  border-radius: 10px;

  padding: 8px 5px;

  font-size: 13px;

  font-weight: bold;

  color: #555;

  text-align: center;
}


/* =====================================================
   狀態
===================================================== */

.status-box {
  flex: 1;

  min-height: 48px;

  border-radius: 10px;

  padding: 8px 12px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 6px;

  font-size: 13px;

  font-weight: bold;

  text-align: center;
}


/* =====================================================
   上課
===================================================== */

.status-class {
  background: #ffdede;

  color: #c62828;

  border: 1px solid #ffb0b0;
}


/* =====================================================
   可使用
===================================================== */

.status-available {
  background: #ddf5e4;

  color: #16833a;

  border: 1px solid #a4d9b1;
}


/* =====================================================
   已預約
===================================================== */

.status-reserved {
  background: #fff2b8;

  color: #806500;

  border: 1px solid #e5cf69;
}


/* =====================================================
   其他
===================================================== */

.status-other {
  background: #f1f3f5;

  color: #666;

  border: 1px solid #ddd;
}


/* =====================================================
   無資料
===================================================== */

.status-empty {
  background: #fafafa;

  color: #aaa;

  border: 1px solid #eee;

  text-align: center;

  padding: 20px;
}


/* =====================================================
   Loading
===================================================== */

.loading {
  background: white;

  border-radius: 16px;

  padding: 32px 15px;

  text-align: center;

  color: #888;

  font-size: 13px;
}


/* =====================================================
   Error
===================================================== */

.error {
  background: #fff1f1;

  border: 1px solid #ffc8c8;

  color: #c62828;

  border-radius: 14px;

  padding: 16px;

  font-size: 13px;

  line-height: 1.7;
}


/* =====================================================
   空資料
===================================================== */

.empty {
  background: white;

  border-radius: 16px;

  padding: 35px 15px;

  text-align: center;

  color: #999;

  font-size: 13px;
}


/* =====================================================
   更新時間
===================================================== */

.update-time {
  text-align: right;

  margin-top: 8px;

  color: #aaa;

  font-size: 11px;
}


/* =====================================================
   Footer
===================================================== */

.footer {
  margin-top: 25px;

  text-align: center;

  color: #999;

  font-size: 12px;

  line-height: 1.7;
}


/* =====================================================
   手機
===================================================== */

@media (max-width: 600px) {

  .container {
    padding-left: 8px;
    padding-right: 8px;
  }

  .header {
    padding: 24px 15px 27px;
  }

  .header h1 {
    font-size: 21px;
  }

  .time-box {
    width: 100px;
    min-width: 100px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     Header
===================================================== -->

<div class="header">

  <div class="logo">
    館
  </div>

  <h1>
    場館使用
  </h1>

  <p>
    實踐大學體育室 LINE 智慧服務
  </p>

</div>


<div class="container">


<!-- =====================================================
     LINE 使用者
===================================================== -->

<div class="user-box">

  <span id="userStatus">
    正在連線...
  </span>

</div>


<!-- =====================================================
     場地選擇
===================================================== -->

<div class="select-box">

  <div class="select-title">
    🏟️ 選擇場地
  </div>

  <div class="select-description">

    請選擇要查詢的場地，
    下方將顯示星期一至星期日的使用狀況。

  </div>

  <select
    id="venueSelect"
    class="venue-select"
    onchange="changeVenue()"
    disabled
  >

    <option value="">
      正在載入場地...
    </option>

  </select>

  <div
    id="currentVenue"
    class="current-venue"
    style="display:none;"
  ></div>

</div>


<!-- =====================================================
     圖例
===================================================== -->

<div class="legend">

  <span class="legend-title">
    狀態：
  </span>

  <span class="legend-item">

    <span class="legend-dot dot-class"></span>

    上課

  </span>

  <span class="legend-item">

    <span class="legend-dot dot-available"></span>

    可使用

  </span>

  <span class="legend-item">

    <span class="legend-dot dot-reserved"></span>

    已預約

  </span>

</div>


<!-- =====================================================
     結果
===================================================== -->

<div id="result">

  <div class="loading">
    ⏳ 正在載入場館資料...
  </div>

</div>


<div
  id="updateTime"
  class="update-time"
></div>


<!-- =====================================================
     Footer
===================================================== -->

<div class="footer">

  實踐大學體育室

  <br>

  LINE 智慧服務中心

  <br>

  © Shih Chien University

</div>


</div>


<!-- =====================================================
     LIFF SDK
===================================================== -->

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<script>

/* =====================================================
   GAS / LIFF 設定
===================================================== */

const LIFF_ID =
  '2011024432-afjj4k3z';


const API_URL =
  'https://script.google.com/macros/s/AKfycbwyWQ_pv0Mfu7X9B46xALn8QaDMvbK22MHYINIZl1vMrLxJtwQmsGUU_Sx6UnA4AuyR/exec';


/* =====================================================
   全域資料
===================================================== */

let allVenueData = [];

let selectedVenue = '';

let lineProfile = {
  userId: '',
  displayName: ''
};


/* =====================================================
   星期
===================================================== */

const DAYS = [

  '星期一',
  '星期二',
  '星期三',
  '星期四',
  '星期五',
  '星期六',
  '星期日'

];


/* =====================================================
   啟動
===================================================== */

window.addEventListener(
  'load',
  initLIFF
);


/* =====================================================
   LIFF 初始化
===================================================== */

async function initLIFF() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });


    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }


    const profile =
      await liff.getProfile();


    lineProfile.userId =
      profile.userId || '';


    lineProfile.displayName =
      profile.displayName || '';


    document
      .getElementById('userStatus')
      .textContent =
        '您好，' +
        lineProfile.displayName +
        ' 👋';


    loadVenueData();


  } catch (error) {

    console.error(
      'LIFF ERROR:',
      error
    );


    document
      .getElementById('userStatus')
      .textContent =
        'LINE 初始化失敗';


    showError(
      'LINE 初始化失敗：' +
      (error.message || error)
    );

  }

}


/* =====================================================
   載入 GAS 資料
===================================================== */

function loadVenueData() {

  showLoading();


  callAPI(

    {
      action: 'all'
    },

    function(result) {

      console.log(
        'GAS 原始回傳：',
        result
      );


      if (
        !result ||
        result.success !== true
      ) {

        showError(

          result &&
          result.error

            ? result.error

            : 'GAS 沒有正確回傳資料'

        );

        return;

      }


      /*
       * =================================================
       * 非常重要
       *
       * GAS 應該回傳：
       *
       * {
       *   success:true,
       *   data:[...]
       * }
       *
       * 這裡只接受 data 陣列
       * =================================================
       */

      if (
        !Array.isArray(result.data)
      ) {

        showError(
          'GAS 回傳的 data 不是陣列'
        );

        console.error(
          '錯誤的 GAS data：',
          result.data
        );

        return;

      }


      /*
       * =================================================
       * 正規化資料
       *
       * 這裡直接抓：
       *
       * item.weekday
       * item.name
       * item.time
       * item.status
       *
       * 不再使用其他名稱
       * =================================================
       */

      allVenueData =
        result.data
          .map(normalizeData)
          .filter(function(item) {

            return (
              item.name !== '' &&
              item.weekday !== '' &&
              item.time !== ''
            );

          });


      console.log(
        '正規化後資料：',
        allVenueData
      );


      buildVenueSelect();


      document
        .getElementById('result')
        .innerHTML =

          '<div class="empty">' +

          '請先選擇場地。' +

          '</div>';


      document
        .getElementById('tableCount')
        ?.textContent || '';


      updateTime();

    }

  );

}


/* =====================================================
   正規化 GAS 資料
===================================================== */

function normalizeData(item) {

  /*
   * 確保 item 一定是物件
   */

  if (
    !item ||
    typeof item !== 'object'
  ) {

    return {

      weekday: '',
      name: '',
      time: '',
      status: ''

    };

  }


  /*
   * 星期
   */

  const weekday =
    normalizeDay(
      item.weekday
    );


  /*
   * 場地
   */

  const name =
    String(
      item.name == null
        ? ''
        : item.name
    ).trim();


  /*
   * 時間
   */

  const time =
    normalizeTime(
      item.time
    );


  /*
   * 狀態
   *
   * ★★★ 關鍵 ★★★
   *
   * 就是讀取 GAS：
   *
   * item.status
   *
   * 不再從其他欄位判斷
   */

  let status = '';


  if (
    item.status !== null &&
    item.status !== undefined
  ) {

    status =
      String(
        item.status
      ).trim();

  }


  /*
   * 如果 GAS 回傳 undefined
   *
   * 直接變成空字串
   *
   * 絕對不讓畫面出現 undefined
   */

  if (
    status === 'undefined' ||
    status === 'null'
  ) {

    status = '';

  }


  return {

    weekday: weekday,

    name: name,

    time: time,

    status: status

  };

}


/* =====================================================
   建立場地選單
===================================================== */

function buildVenueSelect() {

  const select =
    document.getElementById(
      'venueSelect'
    );


  const venueMap = {};


  allVenueData.forEach(
    function(item) {

      const name =
        String(
          item.name || ''
        ).trim();


      if (name) {

        venueMap[name] = true;

      }

    }
  );


  const venues =
    Object.keys(venueMap);


  venues.sort(
    function(a, b) {

      return a.localeCompare(
        b,
        'zh-Hant'
      );

    }
  );


  select.innerHTML = '';


  const defaultOption =
    document.createElement(
      'option'
    );


  defaultOption.value = '';

  defaultOption.textContent =
    '請選擇場地';


  select.appendChild(
    defaultOption
  );


  venues.forEach(
    function(venue) {

      const option =
        document.createElement(
          'option'
        );


      option.value =
        venue;


      option.textContent =
        venue;


      select.appendChild(
        option
      );

    }
  );


  select.disabled =
    venues.length === 0;


  if (!venues.length) {

    select.innerHTML =

      '<option value="">' +

      '目前沒有場地資料' +

      '</option>';

  }

}


/* =====================================================
   更換場地
===================================================== */

function changeVenue() {

  const select =
    document.getElementById(
      'venueSelect'
    );


  selectedVenue =
    String(
      select.value || ''
    ).trim();


  const currentVenue =
    document.getElementById(
      'currentVenue'
    );


  if (!selectedVenue) {

    currentVenue.style.display =
      'none';


    document
      .getElementById('result')
      .innerHTML =

        '<div class="empty">' +

        '請先選擇場地。' +

        '</div>';


    return;

  }


  currentVenue.style.display =
    'block';


  currentVenue.innerHTML =

    '目前查詢：<strong>' +

    escapeHTML(
      selectedVenue
    ) +

    '</strong>';


  renderSchedule();

}


/* =====================================================
   顯示星期資料
===================================================== */

function renderSchedule() {

  /*
   * 只抓目前選擇的場地
   */

  const venueData =
    allVenueData.filter(
      function(item) {

        return (

          String(
            item.name || ''
          ).trim() ===
          selectedVenue

        );

      }
    );


  if (!venueData.length) {

    document
      .getElementById('result')
      .innerHTML =

        '<div class="empty">' +

        '此場地目前沒有資料。' +

        '</div>';

    return;

  }


  /*
   * =================================================
   * 建立 HTML
   * =================================================
   */

  let html = '';


  /*
   * 星期一～日
   */

  DAYS.forEach(
    function(day) {

      /*
       * 找出這一天的資料
       */

      const dayData =
        venueData.filter(
          function(item) {

            return (
              normalizeDay(
                item.weekday
              ) === day
            );

          }
        );


      /*
       * 這一天完全沒有資料
       */

      if (!dayData.length) {

        html +=

          '<div class="day-section">' +

            '<div class="day-header">' +

              '<div class="day-name">' +

                day +

              '</div>' +

              '<div class="day-count">' +

                '0 個時段' +

              '</div>' +

            '</div>' +

            '<div class="day-content">' +

              '<div class="status-box status-empty">' +

                '本日無資料' +

              '</div>' +

            '</div>' +

          '</div>';

        return;

      }


      /*
       * =================================================
       * 同一天的時間排序
       * =================================================
       */

      dayData.sort(
        function(a, b) {

          return (
            getStartMinutes(a.time) -
            getStartMinutes(b.time)
          );

        }
      );


      /*
       * 星期標題
       */

      html +=

        '<div class="day-section">' +

          '<div class="day-header">' +

            '<div class="day-name">' +

              day +

            '</div>' +

            '<div class="day-count">' +

              dayData.length +

              ' 個時段' +

            '</div>' +

          '</div>' +

          '<div class="day-content">';


      /*
       * =================================================
       * 每個時間
       * =================================================
       */

      dayData.forEach(
        function(item) {

          /*
           * 時間
           */

          const time =
            normalizeTime(
              item.time
            );


          /*
           * 狀態
           *
           * ★★★★★★★★★★★★★★★★★★★★★
           *
           * 直接使用 item.status
           *
           * 絕對不使用 undefined
           *
           * ★★★★★★★★★★★★★★★★★★★★★
           */

          const status =
            item.status
              ? String(
                  item.status
                ).trim()
              : '';


          html +=

            '<div class="time-item">' +

              '<div class="time-box">' +

                escapeHTML(
                  time || '未設定時間'
                ) +

              '</div>';


          /*
           * 有狀態
           */

          if (status) {

            html +=
              createStatusHTML(
                status
              );

          }

          /*
           * 沒有狀態
           */

          else {

            html +=

              '<div class="status-box status-empty">' +

                '狀態未設定' +

              '</div>';

          }


          html +=

            '</div>';

        }
      );


      html +=

          '</div>' +

        '</div>';

    }
  );


  document
    .getElementById('result')
    .innerHTML =
      html;

}


/* =====================================================
   狀態 HTML
===================================================== */

function createStatusHTML(status) {

  /*
   * 一律轉成字串
   */

  const text =
    status == null
      ? ''
      : String(status).trim();


  /*
   * 如果空白
   */

  if (!text) {

    return

      '<div class="status-box status-empty">' +

        '狀態未設定' +

      '</div>';

  }


  let className =
    'status-other';

  let icon = '';


  /*
   * 上課
   */

  if (
    text === '上課'
  ) {

    className =
      'status-class';

    icon =
      '🔴';

  }


  /*
   * 可使用
   */

  else if (
    text === '可使用'
  ) {

    className =
      'status-available';

    icon =
      '🟢';

  }


  /*
   * 已預約
   */

  else if (
    text === '已預約'
  ) {

    className =
      'status-reserved';

    icon =
      '🟡';

  }


  /*
   * 其他狀態
   */

  else {

    className =
      'status-other';

    icon =
      '⚪';

  }


  return

    '<div class="status-box ' +

      className +

    '">' +

      '<span>' +

        icon +

      '</span>' +

      '<span>' +

        escapeHTML(text) +

      '</span>' +

    '</div>';

}


/* =====================================================
   星期標準化
===================================================== */

function normalizeDay(value) {

  let text =
    String(
      value == null
        ? ''
        : value
    ).trim();


  if (!text) {
    return '';
  }


  /*
   * 週一 → 星期一
   */

  text =
    text.replace(
      /^週/,
      '星期'
    );


  /*
   * 周一 → 星期一
   */

  text =
    text.replace(
      /^周/,
      '星期'
    );


  /*
   * 一 → 星期一
   */

  if (
    /^[一二三四五六日天]$/.test(text)
  ) {

    if (text === '天') {
      text = '星期日';
    } else {
      text = '星期' + text;
    }

  }


  return text;

}


/* =====================================================
   時間格式標準化
===================================================== */

function normalizeTime(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }


  let text =
    String(value).trim();


  if (!text) {
    return '';
  }


  /*
   * 全形冒號
   *
   * 8：00 → 8:00
   */

  text =
    text.replace(
      /：/g,
      ':'
    );


  /*
   * 去除多餘空白
   */

  text =
    text.replace(
      /\s+/g,
      ''
    );


  /*
   * 支援：
   *
   * 8:00-10:00
   * 08:00-10:00
   * 8:00~10:00
   * 8:00～10:00
   * 8:00－10:00
   */

  text =
    text.replace(
      /[~～－—–]/g,
      '-'
    );


  /*
   * 將 08:00-10:00
   * 顯示成 8:00-10:00
   */

  const match =
    text.match(
      /^(\d{1,2}):(\d{1,2})-(\d{1,2}):(\d{1,2})$/
    );


  if (match) {

    const h1 =
      Number(match[1]);

    const m1 =
      Number(match[2]);

    const h2 =
      Number(match[3]);

    const m2 =
      Number(match[4]);


    return (

      h1 +
      ':' +
      String(m1).padStart(2, '0') +

      '-' +

      h2 +
      ':' +
      String(m2).padStart(2, '0')

    );

  }


  return text;

}


/* =====================================================
   時間排序
===================================================== */

function getStartMinutes(value) {

  const text =
    normalizeTime(value);


  /*
   * 例如：
   *
   * 8:00-10:00
   */

  const match =
    text.match(
      /^(\d{1,2}):(\d{2})/
    );


  if (!match) {

    return 99999;

  }


  return (

    Number(match[1]) * 60 +

    Number(match[2])

  );

}


/* =====================================================
   GAS JSONP
===================================================== */

function callAPI(
  params,
  callback
) {

  const callbackName =

    'venueCallback_' +

    Date.now() +

    '_' +

    Math.floor(
      Math.random() * 100000
    );


  params.callback =
    callbackName;


  const query =

    Object.keys(params)

      .map(
        function(key) {

          return (

            encodeURIComponent(key) +

            '=' +

            encodeURIComponent(
              params[key]
            )

          );

        }
      )

      .join('&');


  const script =
    document.createElement(
      'script'
    );


  let finished = false;


  const timeout =

    setTimeout(
      function() {

        if (finished) {
          return;
        }


        finished = true;


        cleanup();


        callback({

          success: false,

          error:
            'GAS API 連線逾時'

        });

      },

      15000
    );


  window[callbackName] =
    function(data) {

      if (finished) {
        return;
      }


      finished = true;


      clearTimeout(
        timeout
      );


      cleanup();


      callback(data);

    };


  function cleanup() {

    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }


    try {

      delete window[
        callbackName
      ];

    } catch (e) {

      window[
        callbackName
      ] = undefined;

    }

  }


  script.onerror =
    function() {

      if (finished) {
        return;
      }


      finished = true;


      clearTimeout(
        timeout
      );


      cleanup();


      callback({

        success: false,

        error:
          '無法連線至 GAS API'

      });

    };


  script.src =
    API_URL +
    '?' +
    query;


  document.body.appendChild(
    script
  );

}


/* =====================================================
   Loading
===================================================== */

function showLoading() {

  document
    .getElementById('result')
    .innerHTML =

      '<div class="loading">' +

      '⏳ 正在載入場館資料...' +

      '</div>';

}


/* =====================================================
   Error
===================================================== */

function showError(message) {

  document
    .getElementById('result')
    .innerHTML =

      '<div class="error">' +

      '⚠️ ' +

      escapeHTML(
        message
      ) +

      '<br><br>' +

      '請確認 GAS Web App URL、Google Sheet ID，以及 GAS 回傳格式。' +

      '</div>';

}


/* =====================================================
   更新時間
===================================================== */

function updateTime() {

  const now =
    new Date();


  document
    .getElementById('updateTime')
    .textContent =

      '最後更新：' +

      now.toLocaleString(
        'zh-TW',
        {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        }
      );

}


/* =====================================================
   HTML Escape
===================================================== */

function escapeHTML(value) {

  return String(

    value === null ||
    value === undefined

      ? ''

      : value

  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
