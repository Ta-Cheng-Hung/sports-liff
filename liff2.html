<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>場館使用｜實踐大學體育室</title>


<style>

/* =====================================================
   基本設定
===================================================== */

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {

  margin: 0;

  background:
    linear-gradient(
      180deg,
      #fff8f0 0%,
      #f7f9fc 100%
    );

  color: #333;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

}


/* =====================================================
   Header
===================================================== */

.header {

  background:
    linear-gradient(
      135deg,
      #e87918,
      #f39a45
    );

  color: white;

  text-align: center;

  padding:
    28px 18px 30px;

  border-radius:
    0 0 28px 28px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.12);

}


.logo {

  width: 68px;

  height: 68px;

  margin:
    0 auto 12px;

  border-radius: 50%;

  background: white;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #e87918;

  font-size: 30px;

  font-weight: bold;

}


.header h1 {

  margin: 5px 0;

  font-size: 23px;

}


.header p {

  margin:
    7px 0 0;

  font-size: 13px;

  opacity: .92;

}


/* =====================================================
   Container
===================================================== */

.container {

  width: 100%;

  max-width: 1100px;

  margin: 0 auto;

  padding:
    18px 12px 40px;

}


/* =====================================================
   使用者
===================================================== */

.user-box {

  background: white;

  border-radius: 14px;

  padding:
    11px 14px;

  margin-bottom: 14px;

  color: #666;

  font-size: 13px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);

}


/* =====================================================
   場地選擇
===================================================== */

.select-box {

  background: white;

  border-radius: 18px;

  padding: 18px;

  margin-bottom: 15px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.06);

}


.select-title {

  font-size: 19px;

  font-weight: bold;

  margin-bottom: 6px;

}


.select-description {

  font-size: 13px;

  color: #777;

  line-height: 1.6;

  margin-bottom: 13px;

}


.venue-select {

  width: 100%;

  height: 48px;

  border:
    1px solid #ddd;

  border-radius: 11px;

  background: white;

  padding:
    0 13px;

  font-size: 16px;

  color: #333;

  outline: none;

}


.venue-select:focus {

  border-color: #e87918;

  box-shadow:
    0 0 0 3px
    rgba(232,121,24,.12);

}


.current-venue {

  margin-top: 12px;

  padding:
    10px 12px;

  background:
    #fff6ed;

  border-radius: 10px;

  color: #c46110;

  font-size: 13px;

}


/* =====================================================
   圖例
===================================================== */

.legend {

  background: white;

  border-radius: 15px;

  padding:
    12px 14px;

  margin-bottom: 15px;

  display: flex;

  flex-wrap: wrap;

  align-items: center;

  gap:
    8px 15px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);

  font-size: 12px;

  color: #555;

}


.legend-title {

  font-weight: bold;

}


.legend-item {

  display: inline-flex;

  align-items: center;

  gap: 5px;

}


.legend-dot {

  width: 13px;

  height: 13px;

  border-radius: 50%;

}


.dot-class {

  background: #e53935;

}


.dot-available {

  background: #2e9d50;

}


.dot-reserved {

  background: #e3b800;

}


/* =====================================================
   表格標題
===================================================== */

.table-title {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin:
    0 3px 9px;

}


.table-title-main {

  font-size: 18px;

  font-weight: bold;

}


.table-title-count {

  color: #999;

  font-size: 12px;

}


/* =====================================================
   星期區塊
===================================================== */

.day-section {

  background: white;

  border-radius: 17px;

  margin-bottom: 15px;

  overflow: hidden;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.07);

}


/* =====================================================
   星期標題
===================================================== */

.day-section-title {

  padding:
    14px 16px;

  background:
    #f2f4f6;

  border-bottom:
    1px solid #e1e4e7;

  font-size: 17px;

  font-weight: bold;

  color: #333;

}


/* =====================================================
   每天的時間區域
===================================================== */

.day-schedule {

  width: 100%;

}


/* =====================================================
   時間列
===================================================== */

.time-row {

  display: flex;

  align-items: center;

  min-height: 68px;

  padding:
    8px 12px;

  border-bottom:
    1px solid #eeeeee;

}


.time-row:last-child {

  border-bottom:
    none;

}


/* =====================================================
   時間
===================================================== */

.time-label {

  width: 130px;

  min-width: 130px;

  padding:
    0 8px;

  font-size: 13px;

  font-weight: bold;

  color: #555;

  text-align: center;

}


/* =====================================================
   狀態
===================================================== */

.time-status {

  flex: 1;

}


/* =====================================================
   狀態共同
===================================================== */

.status {

  width: 100%;

  min-height: 48px;

  padding:
    8px 10px;

  border-radius: 10px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 6px;

  line-height: 1.4;

  font-size: 13px;

  font-weight: bold;

  text-align: center;

}


/* =====================================================
   上課
===================================================== */

.status-class {

  background:
    #ffdede;

  color:
    #c62828;

  border:
    1px solid #ffb0b0;

}


/* =====================================================
   可使用
===================================================== */

.status-available {

  background:
    #ddf5e4;

  color:
    #16833a;

  border:
    1px solid #a4d9b1;

}


/* =====================================================
   已預約
===================================================== */

.status-reserved {

  background:
    #fff2b8;

  color:
    #806500;

  border:
    1px solid #e5cf69;

}


/* =====================================================
   其他狀態
===================================================== */

.status-other {

  background:
    #f1f3f5;

  color:
    #666;

  border:
    1px solid #ddd;

}


/* =====================================================
   無狀態
===================================================== */

.status-empty {

  background:
    #fafafa;

  color:
    #aaa;

  border:
    1px solid #eee;

  font-weight:
    normal;

}


/* =====================================================
   Loading
===================================================== */

.loading {

  background: white;

  border-radius: 16px;

  padding:
    32px 15px;

  text-align: center;

  color: #888;

  font-size: 13px;

}


/* =====================================================
   Error
===================================================== */

.error {

  background:
    #fff1f1;

  border:
    1px solid #ffc8c8;

  color:
    #c62828;

  border-radius: 14px;

  padding:
    16px;

  font-size: 13px;

  line-height: 1.7;

}


/* =====================================================
   空資料
===================================================== */

.empty {

  background: white;

  border-radius: 16px;

  padding:
    35px 15px;

  text-align: center;

  color: #999;

  font-size: 13px;

}


/* =====================================================
   更新時間
===================================================== */

.update-time {

  text-align: right;

  margin-top: 8px;

  color: #aaa;

  font-size: 11px;

}


/* =====================================================
   Footer
===================================================== */

.footer {

  margin-top: 25px;

  text-align: center;

  color: #999;

  font-size: 12px;

  line-height: 1.7;

}


/* =====================================================
   手機
===================================================== */

@media (
  max-width: 600px
) {

  .container {

    padding-left: 8px;

    padding-right: 8px;

  }


  .header {

    padding:
      24px 15px 27px;

  }


  .header h1 {

    font-size: 21px;

  }


  .time-row {

    min-height: 64px;

    padding:
      7px 8px;

  }


  .time-label {

    width: 105px;

    min-width: 105px;

    padding:
      0 4px;

    font-size: 12px;

  }


  .status {

    min-height: 46px;

    font-size: 12px;

  }

}

</style>

</head>


<body>


<!-- =================================================
     Header
================================================= -->

<div class="header">

  <div class="logo">
    館
  </div>

  <h1>
    場館使用
  </h1>

  <p>
    實踐大學體育室 LINE 智慧服務
  </p>

</div>


<div class="container">


<!-- =================================================
     LINE 使用者
================================================= -->

<div class="user-box">

  <span id="userStatus">
    正在連線...
  </span>

</div>


<!-- =================================================
     場地選擇
================================================= -->

<div class="select-box">

  <div class="select-title">
    🏟️ 選擇場地
  </div>


  <div class="select-description">

    請選擇要查詢的場地，
    下方將依星期分別顯示使用狀況。

  </div>


  <select
    id="venueSelect"
    class="venue-select"
    onchange="changeVenue()"
    disabled
  >

    <option value="">
      正在載入場地...
    </option>

  </select>


  <div
    id="currentVenue"
    class="current-venue"
    style="display:none;"
  ></div>

</div>


<!-- =================================================
     圖例
================================================= -->

<div class="legend">

  <span class="legend-title">
    狀態：
  </span>


  <span class="legend-item">

    <span
      class="legend-dot dot-class"
    ></span>

    上課

  </span>


  <span class="legend-item">

    <span
      class="legend-dot dot-available"
    ></span>

    可使用

  </span>


  <span class="legend-item">

    <span
      class="legend-dot dot-reserved"
    ></span>

    已預約

  </span>

</div>


<!-- =================================================
     表格標題
================================================= -->

<div class="table-title">

  <div
    id="tableTitle"
    class="table-title-main"
  >
    場館使用狀況
  </div>


  <div
    id="tableCount"
    class="table-title-count"
  ></div>

</div>


<!-- =================================================
     結果
================================================= -->

<div id="result">

  <div class="loading">

    ⏳ 正在載入場館資料...

  </div>

</div>


<!-- =================================================
     更新時間
================================================= -->

<div
  id="updateTime"
  class="update-time"
></div>


<!-- =================================================
     Footer
================================================= -->

<div class="footer">

  實踐大學體育室

  <br>

  LINE 智慧服務中心

  <br>

  © Shih Chien University

</div>


</div>


<!-- =================================================
     LIFF SDK
================================================= -->

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<script>

/* =====================================================
   設定
===================================================== */


/*
 * =====================================================
 * LIFF ID
 * =====================================================
 */

const LIFF_ID =
  '2011024432-afjj4k3z';


/*
 * =====================================================
 * GAS Web App URL
 * =====================================================
 */

const API_URL =
  'https://script.google.com/macros/s/AKfycbyrZTXMbSxLhEYI7BcUMdXOCzulvLzw8r1BMGs9bLVPQeqcDNNyKNsG9OoUWQJ7ej9w/exec';


/*
 * =====================================================
 * 全部資料
 * =====================================================
 */

let allVenueData = [];


/*
 * =====================================================
 * 目前選擇場地
 * =====================================================
 */

let selectedVenue = '';


/*
 * =====================================================
 * LINE 使用者
 * =====================================================
 */

let lineProfile = {

  userId: '',

  displayName: ''

};


/*
 * =====================================================
 * 星期順序
 * =====================================================
 */

const DAYS = [

  '星期一',

  '星期二',

  '星期三',

  '星期四',

  '星期五',

  '星期六',

  '星期日'

];


/* =====================================================
   啟動
===================================================== */

window.addEventListener(
  'load',
  initLIFF
);


/* =====================================================
   LIFF 初始化
===================================================== */

async function initLIFF() {

  try {

    /*
     * 初始化 LIFF
     */

    await liff.init({

      liffId:
        LIFF_ID

    });


    /*
     * 尚未登入
     */

    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;

    }


    /*
     * 取得 LINE Profile
     */

    const profile =
      await liff.getProfile();


    lineProfile.userId =
      profile.userId || '';


    lineProfile.displayName =
      profile.displayName || '';


    document
      .getElementById(
        'userStatus'
      )
      .textContent =
        '您好，' +
        lineProfile.displayName +
        ' 👋';


    /*
     * 載入 GAS
     */

    loadVenueData();


  } catch (error) {

    console.error(
      'LIFF 初始化錯誤：',
      error
    );


    document
      .getElementById(
        'userStatus'
      )
      .textContent =
        'LINE 初始化失敗';


    showError(
      'LINE 初始化失敗：' +
      error.message
    );

  }

}


/* =====================================================
   載入 GAS 資料
===================================================== */

function loadVenueData() {

  showLoading();


  callAPI(

    {

      action:
        'all'

    },


    function(result) {

      console.log(
        '================================'
      );

      console.log(
        'GAS 回傳結果：',
        result
      );

      console.log(
        '================================'
      );


      /*
       * GAS 錯誤
       */

      if (
        !result ||
        result.success !== true
      ) {

        showError(

          result &&
          result.error

            ? result.error

            : '無法取得場館資料'

        );

        return;

      }


      /*
       * 確保 data 是 Array
       */

      allVenueData =
        Array.isArray(
          result.data
        )
          ? result.data
          : [];


      /*
       * 顯示第一筆資料供除錯
       */

      if (
        allVenueData.length
      ) {

        console.log(
          '第一筆 GAS 資料：',
          allVenueData[0]
        );

        console.log(
          'weekday：',
          allVenueData[0].weekday
        );

        console.log(
          'name：',
          allVenueData[0].name
        );

        console.log(
          'time：',
          allVenueData[0].time
        );

        console.log(
          'status：',
          allVenueData[0].status
        );

      }


      /*
       * 建立場地選單
       */

      buildVenueSelect();


      /*
       * 預設畫面
       */

      document
        .getElementById(
          'result'
        )
        .innerHTML =

          '<div class="empty">' +

          '請先選擇場地。' +

          '</div>';


      document
        .getElementById(
          'tableCount'
        )
        .textContent =
          '';


      /*
       * 更新時間
       */

      updateTime();

    }

  );

}


/* =====================================================
   建立場地選單
===================================================== */

function buildVenueSelect() {

  const select =
    document.getElementById(
      'venueSelect'
    );


  const venues = [];


  /*
   * 從 GAS data 取得場地
   */

  allVenueData.forEach(
    function(item) {

      const name =
        String(
          item &&
          item.name != null
            ? item.name
            : ''
        ).trim();


      if (
        name &&
        !venues.includes(name)
      ) {

        venues.push(
          name
        );

      }

    }
  );


  /*
   * 排序
   */

  venues.sort(
    function(a, b) {

      return a.localeCompare(
        b,
        'zh-Hant'
      );

    }
  );


  /*
   * 清空
   */

  select.innerHTML = '';


  /*
   * 預設
   */

  const defaultOption =
    document.createElement(
      'option'
    );


  defaultOption.value =
    '';


  defaultOption.textContent =
    '請選擇場地';


  select.appendChild(
    defaultOption
  );


  /*
   * 建立場地
   */

  venues.forEach(
    function(venue) {

      const option =
        document.createElement(
          'option'
        );


      option.value =
        venue;


      option.textContent =
        venue;


      select.appendChild(
        option
      );

    }
  );


  /*
   * 啟用
   */

  select.disabled =
    false;


  /*
   * 沒有場地
   */

  if (
    !venues.length
  ) {

    select.innerHTML =

      '<option value="">' +

      '目前沒有場地資料' +

      '</option>';


    select.disabled =
      true;

  }

}


/* =====================================================
   更換場地
===================================================== */

function changeVenue() {

  const select =
    document.getElementById(
      'venueSelect'
    );


  selectedVenue =
    select.value;


  /*
   * 沒有選擇
   */

  if (
    !selectedVenue
  ) {

    document
      .getElementById(
        'currentVenue'
      )
      .style.display =
        'none';


    document
      .getElementById(
        'result'
      )
      .innerHTML =

        '<div class="empty">' +

        '請先選擇場地。' +

        '</div>';


    document
      .getElementById(
        'tableTitle'
      )
      .textContent =
        '場館使用狀況';


    document
      .getElementById(
        'tableCount'
      )
      .textContent =
        '';


    return;

  }


  /*
   * 顯示目前場地
   */

  const currentVenue =
    document.getElementById(
      'currentVenue'
    );


  currentVenue.style.display =
    'block';


  currentVenue.innerHTML =

    '目前查詢：<strong>' +

    escapeHTML(
      selectedVenue
    ) +

    '</strong>';


  /*
   * 顯示資料
   */

  renderSchedule();

}


/* =====================================================
   建立星期 × 時間
===================================================== */

function renderSchedule() {

  const result =
    document.getElementById(
      'result'
    );


  /*
   * 只篩選目前場地
   */

  const venueData =
    allVenueData.filter(
      function(item) {

        return String(
          item &&
          item.name != null
            ? item.name
            : ''
        ).trim() === selectedVenue;

      }
    );


  /*
   * 沒資料
   */

  if (
    !venueData.length
  ) {

    result.innerHTML =

      '<div class="empty">' +

      '此場地目前沒有資料。' +

      '</div>';


    return;

  }


  /*
   * 建立星期資料
   */

  const dayData = {

    '星期一': [],
    '星期二': [],
    '星期三': [],
    '星期四': [],
    '星期五': [],
    '星期六': [],
    '星期日': []

  };


  /*
   * 將 GAS 資料分到星期
   */

  venueData.forEach(
    function(item) {

      const day =
        normalizeDay(
          item.weekday
        );


      const time =
        normalizeTimeHTML(
          item.time
        );


      /*
       * =============================================
       * ★★★★★
       *
       * 狀態直接讀 GAS 的 status
       *
       * GAS：
       *
       * status: "上課"
       *
       * =============================================
       */

      const status =
        String(
          item &&
          item.status != null
            ? item.status
            : ''
        ).trim();


      console.log(
        '場地：',
        selectedVenue,
        '星期：',
        day,
        '時間：',
        time,
        '狀態：',
        status
      );


      /*
       * 不認識的星期跳過
       */

      if (
        !dayData[day]
      ) {

        return;

      }


      dayData[day].push({

        time:
          time,

        status:
          status

      });

    }
  );


  /*
   * 每一天自己的時間排序
   */

  Object.keys(dayData)
    .forEach(
      function(day) {

        dayData[day].sort(
          function(a, b) {

            return (

              getStartMinutesHTML(
                a.time
              ) -

              getStartMinutesHTML(
                b.time
              )

            );

          }
        );

      }
    );


  /*
   * 建立 HTML
   */

  let html = '';


  DAYS.forEach(
    function(day) {

      const list =
        dayData[day];


      /*
       * 沒有該星期資料
       */

      if (
        !list ||
        !list.length
      ) {

        return;

      }


      /*
       * 星期區塊
       */

      html +=

        '<div class="day-section">';


      /*
       * 星期標題
       */

      html +=

        '<div class="day-section-title">' +

        escapeHTML(
          day
        ) +

        '</div>';


      /*
       * 時間
       */

      html +=

        '<div class="day-schedule">';


      /*
       * 每個時段
       */

      list.forEach(
        function(item) {

          html +=

            '<div class="time-row">';


          /*
           * 時間
           */

          html +=

            '<div class="time-label">' +

            escapeHTML(
              item.time
            ) +

            '</div>';


          /*
           * 狀態
           */

          html +=

            '<div class="time-status">';


          /*
           * ★ 直接顯示 status
           */

          if (
            item.status
          ) {

            html +=

              createStatusHTML(
                item.status
              );

          } else {

            html +=

              '<div class="status status-empty">' +

              '無狀態資料' +

              '</div>';

          }


          html +=
            '</div>';


          html +=
            '</div>';

        }
      );


      html +=
        '</div>';


      html +=
        '</div>';

    }
  );


  /*
   * 完全沒有星期
   */

  if (!html) {

    html =

      '<div class="empty">' +

      '此場地目前沒有星期資料。' +

      '</div>';

  }


  /*
   * 顯示
   */

  result.innerHTML =
    html;


  /*
   * 標題
   */

  document
    .getElementById(
      'tableTitle'
    )
    .textContent =

      selectedVenue +
      ' 使用狀況';


  /*
   * 筆數
   */

  document
    .getElementById(
      'tableCount'
    )
    .textContent =

      venueData.length +
      ' 筆';

}


/* =====================================================
   狀態 HTML
===================================================== */

function createStatusHTML(
  status
) {

  /*
   * ★ status 是唯一來源
   */

  const text =
    String(
      status == null
        ? ''
        : status
    ).trim();


  /*
   * 預設
   */

  let className =
    'status-other';


  let icon =
    '';


  /*
   * 上課
   */

  if (
    text === '上課'
  ) {

    className =
      'status-class';

    icon =
      '🔴';

  }


  /*
   * 可使用
   */

  else if (
    text === '可使用'
  ) {

    className =
      'status-available';

    icon =
      '🟢';

  }


  /*
   * 已預約
   */

  else if (
    text === '已預約'
  ) {

    className =
      'status-reserved';

    icon =
      '🟡';

  }


  /*
   * 空白
   */

  if (!text) {

    return

      '<div class="status status-empty">' +

      '無狀態資料' +

      '</div>';

  }


  /*
   * 正常狀態
   */

  return

    '<div class="status ' +
    className +
    '">' +

      '<span>' +
      icon +
      '</span>' +

      '<span>' +
      escapeHTML(text) +
      '</span>' +

    '</div>';

}


/* =====================================================
   星期標準化
===================================================== */

function normalizeDay(
  value
) {

  let text =
    String(
      value == null
        ? ''
        : value
    ).trim();


  /*
   * 週一 → 星期一
   */

  text =
    text.replace(
      /^週/,
      '星期'
    );


  /*
   * 周一 → 星期一
   */

  text =
    text.replace(
      /^周/,
      '星期'
    );


  /*
   * 一 → 星期一
   */

  if (
    /^[一二三四五六日]$/.test(
      text
    )
  ) {

    text =
      '星期' +
      text;

  }


  return text;

}


/* =====================================================
   時間格式標準化
===================================================== */

function normalizeTimeHTML(
  value
) {

  let text =
    String(
      value == null
        ? ''
        : value
    ).trim();


  /*
   * 全形冒號
   */

  text =
    text.replace(
      /：/g,
      ':'
    );


  /*
   * 時間左右的空白
   */

  text =
    text.replace(
      /\s+/g,
      ' '
    );


  /*
   * 例如：
   *
   * 8:00 - 10:00
   *
   * 保留顯示原本格式
   */

  return text.trim();

}


/* =====================================================
   時間排序
===================================================== */

function getStartMinutesHTML(
  value
) {

  const text =
    normalizeTimeHTML(
      value
    );


  /*
   * 支援：
   *
   * 8:00-10:00
   * 08:00-10:00
   * 8：00-10：00
   * 09:00 - 21:00
   */

  const match =
    text.match(
      /(\d{1,2})\s*:\s*(\d{1,2})/
    );


  /*
   * 無法辨識
   */

  if (!match) {

    return 99999;

  }


  return (

    Number(
      match[1]
    ) * 60 +

    Number(
      match[2]
    )

  );

}


/* =====================================================
   API JSONP
===================================================== */

function callAPI(
  params,
  callback
) {

  /*
   * 建立 callback 名稱
   */

  const callbackName =

    'venueCallback_' +

    Date.now() +

    '_' +

    Math.floor(
      Math.random() * 100000
    );


  /*
   * 加入 callback
   */

  params.callback =
    callbackName;


  /*
   * 建立 Query String
   */

  const query =

    Object.keys(params)

      .map(
        function(key) {

          return (

            encodeURIComponent(
              key
            ) +

            '=' +

            encodeURIComponent(
              params[key]
            )

          );

        }
      )

      .join('&');


  /*
   * 建立 script
   */

  const script =
    document.createElement(
      'script'
    );


  let finished =
    false;


  /*
   * Timeout
   */

  const timeout =

    setTimeout(
      function() {

        if (
          finished
        ) {

          return;

        }


        finished =
          true;


        cleanup();


        callback({

          success: false,

          error:
            'GAS API 連線逾時'

        });

      },

      15000

    );


  /*
   * JSONP callback
   */

  window[callbackName] =

    function(data) {

      if (
        finished
      ) {

        return;

      }


      finished =
        true;


      clearTimeout(
        timeout
      );


      cleanup();


      callback(
        data
      );

    };


  /*
   * 清除
   */

  function cleanup() {

    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }


    try {

      delete window[
        callbackName
      ];

    } catch (e) {

      window[
        callbackName
      ] = undefined;

    }

  }


  /*
   * Script Error
   */

  script.onerror =

    function() {

      if (
        finished
      ) {

        return;

      }


      finished =
        true;


      clearTimeout(
        timeout
      );


      cleanup();


      callback({

        success: false,

        error:
          '無法連線至 GAS API'

      });

    };


  /*
   * 發送 API
   */

  script.src =

    API_URL +

    '?' +

    query;


  document.body.appendChild(
    script
  );

}

/* =====================================================
   HTML 安全處理
===================================================== */

function escapeHTML(
  value
) {

  return String(

    value === null ||
    value === undefined

      ? ''

      : value

  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
