<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>場館使用｜實踐大學體育室</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  background:
    linear-gradient(
      180deg,
      #fff8f0 0%,
      #f7f9fc 100%
    );

  color: #333;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

}


.header {

  background:
    linear-gradient(
      135deg,
      #e87918,
      #f39a45
    );

  color: white;

  padding: 26px 20px 30px;

  text-align: center;

  border-radius:
    0 0 28px 28px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.12);

}


.logo {

  width: 68px;

  height: 68px;

  margin:
    0 auto 12px;

  background: white;

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #e87918;

  font-size: 30px;

  font-weight: bold;

}


.header h1 {

  margin: 5px 0;

  font-size: 23px;

}


.header p {

  margin: 7px 0 0;

  font-size: 13px;

  opacity: .9;

}


.container {

  max-width: 520px;

  margin: auto;

  padding:
    18px 16px 40px;

}


.user {

  background: white;

  border-radius: 14px;

  padding: 12px 15px;

  margin-bottom: 14px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);

  font-size: 13px;

  color: #666;

}


.search-box {

  background: white;

  border-radius: 18px;

  padding: 18px;

  margin-bottom: 15px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.06);

}


.search-box h2 {

  margin:
    0 0 7px;

  font-size: 19px;

}


.description {

  color: #777;

  font-size: 13px;

  line-height: 1.6;

  margin-bottom: 14px;

}


.input {

  width: 100%;

  border:
    1px solid #ddd;

  border-radius: 11px;

  padding: 12px;

  font-size: 15px;

  outline: none;

  margin-bottom: 9px;

}


.input:focus {

  border-color: #e87918;

}


.buttons {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 8px;

}


.button {

  width: 100%;

  border: none;

  border-radius: 11px;

  padding: 13px;

  background: #e87918;

  color: white;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;

}


.button.secondary {

  background: #f1f3f5;

  color: #555;

}


.button:active {

  transform: scale(.98);

}


.button:disabled {

  opacity: .55;

  cursor: not-allowed;

}


.message {

  margin-top: 11px;

  padding: 11px;

  border-radius: 10px;

  background: #fff8ed;

  color: #777;

  font-size: 13px;

  line-height: 1.6;

  display: none;

}


.message.show {

  display: block;

}


.message.error {

  background: #fff2f2;

  color: #c62828;

}


.result {

  margin-top: 15px;

}


.loading {

  text-align: center;

  color: #888;

  padding: 25px 5px;

  font-size: 13px;

}


.empty {

  background: white;

  border-radius: 15px;

  padding: 25px 10px;

  text-align: center;

  color: #999;

  font-size: 13px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);

}


.venue-card {

  background: white;

  border-radius: 17px;

  padding: 16px;

  margin-bottom: 11px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.06);

  border-left:
    4px solid #e87918;

}


.venue-title {

  font-size: 17px;

  font-weight: bold;

  margin-bottom: 10px;

}


.venue-type {

  display: inline-block;

  background: #fff1e4;

  color: #d8680d;

  border-radius: 20px;

  padding: 4px 9px;

  font-size: 11px;

  margin-left: 5px;

  vertical-align: middle;

}


.row {

  font-size: 13px;

  color: #555;

  line-height: 1.75;

  margin-top: 3px;

}


.row strong {

  color: #333;

}


.note {

  margin-top: 9px;

  padding-top: 9px;

  border-top:
    1px solid #eee;

  color: #777;

  font-size: 12px;

  line-height: 1.7;

  white-space: pre-wrap;

}


.count {

  color: #999;

  font-size: 12px;

  margin:
    0 0 8px 3px;

}


.footer {

  margin-top: 25px;

  text-align: center;

  color: #999;

  font-size: 12px;

  line-height: 1.7;

}

</style>

</head>


<body>


<!-- =====================================
     Header
===================================== -->

<div class="header">

  <div class="logo">
    館
  </div>

  <h1>
    場館使用
  </h1>

  <p>
    實踐大學體育室 LINE 智慧服務
  </p>

</div>


<div class="container">


<!-- =====================================
     LINE User
===================================== -->

<div class="user">

  <span id="userStatus">
    正在初始化 LINE 使用者...
  </span>

</div>


<!-- =====================================
     Search
===================================== -->

<div class="search-box">

  <h2>
    🏟️ 場館查詢
  </h2>

  <div class="description">

    可輸入場館名稱、類型、
    開放時間、地點或使用方式查詢。

    <br>

    不輸入關鍵字即可查看全部場館。

  </div>


  <input

    id="keyword"

    class="input"

    type="text"

    placeholder="例如：體育館、籃球、操場"

    onkeydown="enterSearch(event)"

  >


  <div class="buttons">

    <button

      id="searchButton"

      class="button"

      onclick="searchVenue()"

    >

      🔍 搜尋

    </button>


    <button

      id="allButton"

      class="button secondary"

      onclick="loadAllVenue()"

    >

      📋 全部場館

    </button>

  </div>


  <div

    id="message"

    class="message"

  ></div>

</div>


<!-- =====================================
     Result
===================================== -->

<div id="count"
     class="count">
</div>


<div

  id="result"

  class="result"

></div>


<!-- =====================================
     Footer
===================================== -->

<div class="footer">

  實踐大學體育室

  <br>

  LINE 智慧服務中心

  <br>

  © Shih Chien University

</div>


</div>


<!-- =====================================
     LIFF SDK
===================================== -->

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<script>

/* ========================================
   設定
======================================== */

const LIFF_ID =
  '2011024432-afjj4k3z';


const API_URL =
  'https://script.google.com/macros/s/AKfycbycZ6SSJtbZjGgVmkykNjnHkAAajXyawoT2JK-K77mlP4VLmp7IvizUWsM4fkkvFdWa/exec';


let lineProfile = {

  userId: '',

  displayName: ''

};


/* ========================================
   初始化
======================================== */

window.addEventListener(
  'load',
  initLIFF
);


async function initLIFF() {

  try {

    await liff.init({

      liffId:
        LIFF_ID

    });


    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;

    }


    const profile =
      await liff.getProfile();


    lineProfile.userId =
      profile.userId || '';


    lineProfile.displayName =
      profile.displayName || '';


    document
      .getElementById(
        'userStatus'
      )
      .textContent =
        '您好，' +
        lineProfile.displayName +
        ' 👋';


    pingAPI();


    loadAllVenue();


  } catch (err) {

    console.error(err);


    document
      .getElementById(
        'userStatus'
      )
      .textContent =
        'LINE 初始化失敗，請重新開啟此服務。';

  }

}


/* ========================================
   API JSONP
======================================== */

function callAPI(

  params,

  callback

) {


  const callbackName =

    'apiCallback_' +

    Date.now() +

    '_' +

    Math.floor(

      Math.random() * 100000

    );


  params.callback =
    callbackName;


  const query =

    Object.keys(params)

      .map(function(key) {

        return (

          encodeURIComponent(key) +

          '=' +

          encodeURIComponent(
            params[key]
          )

        );

      })

      .join('&');


  const script =
    document.createElement(
      'script'
    );


  let finished = false;


  const timeout =

    setTimeout(

      function() {

        if (finished) {

          return;

        }


        finished = true;


        cleanup();


        callback({

          success: false,

          error:
            'API 連線逾時'

        });

      },

      15000

    );


  window[callbackName] =

    function(data) {

      if (finished) {

        return;

      }


      finished = true;


      clearTimeout(
        timeout
      );


      cleanup();


      callback(data);

    };


  function cleanup() {

    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }


    try {

      delete window[
        callbackName
      ];

    } catch (e) {

      window[
        callbackName
      ] = undefined;

    }

  }


  script.onerror =

    function() {

      if (finished) {

        return;

      }


      finished = true;


      clearTimeout(
        timeout
      );


      cleanup();


      callback({

        success: false,

        error:
          '無法連線至 API'

      });

    };


  script.src =

    API_URL +

    '?' +

    query;


  document.body.appendChild(
    script
  );

}


/* ========================================
   API Ping
======================================== */

function pingAPI() {

  callAPI(

    {

      action:
        'ping'

    },

    function(result) {

      console.log(
        'LIFF 2 API:',
        result
      );

    }

  );

}


/* ========================================
   Enter Search
======================================== */

function enterSearch(event) {

  if (
    event.key === 'Enter'
  ) {

    searchVenue();

  }

}


/* ========================================
   搜尋場館
======================================== */

function searchVenue() {

  const keyword =

    document
      .getElementById(
        'keyword'
      )
      .value
      .trim();


  const button =

    document
      .getElementById(
        'searchButton'
      );


  const resultBox =

    document
      .getElementById(
        'result'
      );


  clearMessage();


  button.disabled =
    true;


  button.textContent =
    '搜尋中...';


  resultBox.innerHTML =

    '<div class="loading">' +

    '正在搜尋場館...' +

    '</div>';


  document
    .getElementById(
      'count'
    )
    .textContent = '';


  callAPI(

    {

      action:
        'venue',

      keyword:
        keyword

    },

    function(result) {


      button.disabled =
        false;


      button.textContent =
        '🔍 搜尋';


      if (

        !result ||

        !result.success

      ) {


        resultBox.innerHTML =
          '';


        showMessage(

          result &&
          result.error

            ? result.error

            : '場館搜尋失敗。',

          'error'

        );


        return;

      }


      renderVenue(

        result.data || []

      );

    }

  );

}


/* ========================================
   全部場館
======================================== */

function loadAllVenue() {


  const button =

    document
      .getElementById(
        'allButton'
      );


  const resultBox =

    document
      .getElementById(
        'result'
      );


  clearMessage();


  button.disabled =
    true;


  button.textContent =
    '載入中...';


  resultBox.innerHTML =

    '<div class="loading">' +

    '正在載入場館資料...' +

    '</div>';


  document
    .getElementById(
      'count'
    )
    .textContent = '';


  callAPI(

    {

      action:
        'all'

    },

    function(result) {


      button.disabled =
        false;


      button.textContent =
        '📋 全部場館';


      if (

        !result ||

        !result.success

      ) {


        resultBox.innerHTML =
          '';


        showMessage(

          result &&
          result.error

            ? result.error

            : '無法載入場館資料。',

          'error'

        );


        return;

      }


      renderVenue(

        result.data || []

      );

    }

  );

}


/* ========================================
   顯示場館
======================================== */

function renderVenue(
  venues
) {


  const box =

    document
      .getElementById(
        'result'
      );


  const count =

    document
      .getElementById(
        'count'
      );


  if (
    !venues.length
  ) {


    count.textContent =
      '';


    box.innerHTML =

      '<div class="empty">' +

      '找不到符合條件的場館。' +

      '</div>';


    return;

  }


  count.textContent =

    '共 ' +

    venues.length +

    ' 個場館';


  box.innerHTML =

    venues

      .map(

        function(venue) {


          return `

<div class="venue-card">

  <div class="venue-title">

    ${escapeHTML(
      venue.name
    )}

    ${
      venue.type

        ? `

    <span class="venue-type">

      ${escapeHTML(
        venue.type
      )}

    </span>

    `

        : ''

    }

  </div>


  ${
    venue.open

      ? `

  <div class="row">

    <strong>🕐 開放時間：</strong>

    ${escapeHTML(
      venue.open
    )}

  </div>

  `

      : ''

  }


  ${
    venue.location

      ? `

  <div class="row">

    <strong>📍 地點：</strong>

    ${escapeHTML(
      venue.location
    )}

  </div>

  `

      : ''

  }


  ${
    venue.usage

      ? `

  <div class="row">

    <strong>📋 使用方式：</strong>

    ${escapeHTML(
      venue.usage
    )}

  </div>

  `

      : ''

  }


  ${
    venue.contact

      ? `

  <div class="row">

    <strong>☎️ 聯絡方式：</strong>

    ${escapeHTML(
      venue.contact
    )}

  </div>

  `

      : ''

  }


  ${
    venue.note

      ? `

  <div class="note">

    <strong>備註：</strong>

    ${escapeHTML(
      venue.note
    )}

  </div>

  `

      : ''

  }

</div>

`;

        }

      )

      .join('');

}


/* ========================================
   Message
======================================== */

function showMessage(

  text,

  type

) {


  const element =

    document
      .getElementById(
        'message'
      );


  element.textContent =
    text;


  element.className =

    'message show ' +

    (
      type || ''
    );

}


function clearMessage() {

  const element =

    document
      .getElementById(
        'message'
      );


  element.textContent =
    '';


  element.className =
    'message';

}


/* ========================================
   HTML 安全處理
======================================== */

function escapeHTML(
  value
) {


  return String(

    value === null ||

    value === undefined

      ? ''

      : value

  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}

</script>


</body>

</html>
