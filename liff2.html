<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>場館使用｜實踐大學體育室</title>

<style>

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {

  margin: 0;

  background:
    linear-gradient(
      180deg,
      #fff8f0 0%,
      #f7f9fc 100%
    );

  color: #333;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}


/* =====================================================
   Header
===================================================== */

.header {

  background:
    linear-gradient(
      135deg,
      #e87918,
      #f39a45
    );

  color: white;

  text-align: center;

  padding:
    28px 18px 30px;

  border-radius:
    0 0 28px 28px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.12);
}


.logo {

  width: 68px;
  height: 68px;

  margin:
    0 auto 12px;

  border-radius: 50%;

  background: white;

  display: flex;

  align-items: center;
  justify-content: center;

  color: #e87918;

  font-size: 30px;

  font-weight: bold;
}


.header h1 {

  margin: 5px 0;

  font-size: 23px;
}


.header p {

  margin:
    7px 0 0;

  font-size: 13px;

  opacity: .92;
}


/* =====================================================
   Container
===================================================== */

.container {

  width: 100%;

  max-width: 1100px;

  margin: 0 auto;

  padding:
    18px 12px 40px;
}


/* =====================================================
   User
===================================================== */

.user-box {

  background: white;

  border-radius: 14px;

  padding:
    11px 14px;

  margin-bottom: 14px;

  color: #666;

  font-size: 13px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);
}


/* =====================================================
   Venue Select
===================================================== */

.select-box {

  background: white;

  border-radius: 18px;

  padding: 18px;

  margin-bottom: 15px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.06);
}


.select-title {

  font-size: 19px;

  font-weight: bold;

  margin-bottom: 6px;
}


.select-description {

  font-size: 13px;

  color: #777;

  line-height: 1.6;

  margin-bottom: 13px;
}


.venue-select {

  width: 100%;

  height: 48px;

  border:
    1px solid #ddd;

  border-radius: 11px;

  background: white;

  padding:
    0 13px;

  font-size: 16px;

  color: #333;

  outline: none;
}


.venue-select:focus {

  border-color: #e87918;

  box-shadow:
    0 0 0 3px
    rgba(232,121,24,.12);
}


.current-venue {

  margin-top: 12px;

  padding:
    10px 12px;

  background:
    #fff6ed;

  border-radius: 10px;

  color: #c46110;

  font-size: 13px;
}


/* =====================================================
   Legend
===================================================== */

.legend {

  background: white;

  border-radius: 15px;

  padding:
    12px 14px;

  margin-bottom: 15px;

  display: flex;

  flex-wrap: wrap;

  align-items: center;

  gap:
    8px 15px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);

  font-size: 12px;

  color: #555;
}


.legend-title {

  font-weight: bold;
}


.legend-item {

  display: inline-flex;

  align-items: center;

  gap: 5px;
}


.legend-dot {

  width: 13px;
  height: 13px;

  border-radius: 50%;
}


.dot-class {
  background: #e53935;
}


.dot-available {
  background: #2e9d50;
}


.dot-reserved {
  background: #e3b800;
}


/* =====================================================
   Title
===================================================== */

.table-title {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin:
    0 3px 9px;
}


.table-title-main {

  font-size: 18px;

  font-weight: bold;
}


.table-title-count {

  color: #999;

  font-size: 12px;
}


/* =====================================================
   星期區塊
===================================================== */

.day-card {

  background: white;

  border-radius: 17px;

  margin-bottom: 15px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.08);

  overflow: hidden;
}


/* =====================================================
   星期標題
===================================================== */

.day-header {

  padding:
    14px 16px;

  background:
    #f2f4f6;

  border-bottom:
    1px solid #e0e3e6;

  font-size: 17px;

  font-weight: bold;

  color: #444;
}


/* =====================================================
   時段列表
===================================================== */

.time-list {

  padding:
    10px;
}


/* =====================================================
   單一時段
===================================================== */

.time-row {

  display: flex;

  align-items: stretch;

  gap: 10px;

  margin-bottom: 8px;
}


.time-row:last-child {

  margin-bottom: 0;
}


/* =====================================================
   時間
===================================================== */

.time-label {

  width: 105px;

  min-width: 105px;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 8px;

  background:
    #f7f8f9;

  border:
    1px solid #e4e6e8;

  border-radius: 10px;

  color: #555;

  font-size: 13px;

  font-weight: bold;

  text-align: center;
}


/* =====================================================
   Status
===================================================== */

.status {

  flex: 1;

  min-height: 48px;

  padding:
    8px 12px;

  border-radius: 10px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 8px;

  line-height: 1.4;

  font-size: 13px;

  font-weight: bold;

  text-align: center;
}


/* =====================================================
   上課
===================================================== */

.status-class {

  background:
    #ffdede;

  color:
    #c62828;

  border:
    1px solid #ffb0b0;
}


/* =====================================================
   可使用
===================================================== */

.status-available {

  background:
    #ddf5e4;

  color:
    #16833a;

  border:
    1px solid #a4d9b1;
}


/* =====================================================
   已預約
===================================================== */

.status-reserved {

  background:
    #fff2b8;

  color:
    #806500;

  border:
    1px solid #e5cf69;
}


/* =====================================================
   其他狀態
===================================================== */

.status-other {

  background:
    #f1f3f5;

  color:
    #666;

  border:
    1px solid #ddd;
}


/* =====================================================
   無資料
===================================================== */

.status-empty {

  background:
    #fafafa;

  color:
    #bbb;

  border:
    1px solid #eee;

  font-weight:
    normal;

  padding:
    18px;
}


/* =====================================================
   Loading
===================================================== */

.loading {

  background: white;

  border-radius: 16px;

  padding:
    32px 15px;

  text-align: center;

  color: #888;

  font-size: 13px;
}


/* =====================================================
   Error
===================================================== */

.error {

  background:
    #fff1f1;

  border:
    1px solid #ffc8c8;

  color:
    #c62828;

  border-radius: 14px;

  padding:
    16px;

  font-size: 13px;

  line-height: 1.7;
}


/* =====================================================
   Empty
===================================================== */

.empty {

  background: white;

  border-radius: 16px;

  padding:
    35px 15px;

  text-align: center;

  color: #999;

  font-size: 13px;
}


/* =====================================================
   更新時間
===================================================== */

.update-time {

  text-align: right;

  margin-top: 8px;

  color: #aaa;

  font-size: 11px;
}


/* =====================================================
   Footer
===================================================== */

.footer {

  margin-top: 25px;

  text-align: center;

  color: #999;

  font-size: 12px;

  line-height: 1.7;
}


/* =====================================================
   手機
===================================================== */

@media (max-width: 600px) {

  .container {

    padding-left: 8px;

    padding-right: 8px;
  }


  .header {

    padding:
      24px 15px 27px;
  }


  .header h1 {

    font-size: 21px;
  }


  .time-label {

    width: 92px;

    min-width: 92px;

    font-size: 12px;
  }


  .status {

    font-size: 12px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     Header
===================================================== -->

<div class="header">

  <div class="logo">
    館
  </div>

  <h1>
    場館使用
  </h1>

  <p>
    實踐大學體育室 LINE 智慧服務
  </p>

</div>


<div class="container">


<!-- =====================================================
     LINE 使用者
===================================================== -->

<div class="user-box">

  <span id="userStatus">
    正在連線...
  </span>

</div>


<!-- =====================================================
     選擇場地
===================================================== -->

<div class="select-box">

  <div class="select-title">
    🏟️ 選擇場地
  </div>

  <div class="select-description">

    請選擇要查詢的場地，
    下方將顯示星期一至星期日的使用狀況。

  </div>

  <select
    id="venueSelect"
    class="venue-select"
    onchange="changeVenue()"
    disabled
  >

    <option value="">
      正在載入場地...
    </option>

  </select>


  <div
    id="currentVenue"
    class="current-venue"
    style="display:none;"
  ></div>

</div>


<!-- =====================================================
     圖例
===================================================== -->

<div class="legend">

  <span class="legend-title">
    狀態：
  </span>

  <span class="legend-item">

    <span
      class="legend-dot dot-class"
    ></span>

    上課

  </span>

  <span class="legend-item">

    <span
      class="legend-dot dot-available"
    ></span>

    可使用

  </span>

  <span class="legend-item">

    <span
      class="legend-dot dot-reserved"
    ></span>

    已預約

  </span>

</div>


<!-- =====================================================
     表格標題
===================================================== -->

<div class="table-title">

  <div
    id="tableTitle"
    class="table-title-main"
  >
    場館使用狀況
  </div>

  <div
    id="tableCount"
    class="table-title-count"
  ></div>

</div>


<!-- =====================================================
     結果
===================================================== -->

<div id="result">

  <div class="loading">
    ⏳ 正在載入場館資料...
  </div>

</div>


<div
  id="updateTime"
  class="update-time"
></div>


<!-- =====================================================
     Footer
===================================================== -->

<div class="footer">

  實踐大學體育室

  <br>

  LINE 智慧服務中心

  <br>

  © Shih Chien University

</div>


</div>


<!-- =====================================================
     LIFF SDK
===================================================== -->

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<script>

/* =====================================================
   設定
===================================================== */


/* -----------------------------------------------------
   LIFF ID
----------------------------------------------------- */

const LIFF_ID =
  '2011024432-afjj4k3z';


/* -----------------------------------------------------
   GAS Web App URL
----------------------------------------------------- */

const API_URL =
  'https://script.google.com/macros/s/AKfycbwyWQ_pv0Mfu7X9B46xALn8QaDMvbK22MHYINIZl1vMrLxJtwQmsGUU_Sx6UnA4AuyR/exec';


/* -----------------------------------------------------
   全部資料
----------------------------------------------------- */

let allVenueData = [];


/* -----------------------------------------------------
   目前場地
----------------------------------------------------- */

let selectedVenue = '';


/* -----------------------------------------------------
   LINE Profile
----------------------------------------------------- */

let lineProfile = {

  userId: '',

  displayName: ''

};


/* -----------------------------------------------------
   星期
----------------------------------------------------- */

const DAYS = [

  '星期一',
  '星期二',
  '星期三',
  '星期四',
  '星期五',
  '星期六',
  '星期日'

];


/* =====================================================
   啟動
===================================================== */

window.addEventListener(
  'load',
  initLIFF
);


/* =====================================================
   LIFF
===================================================== */

async function initLIFF() {

  try {

    await liff.init({

      liffId:
        LIFF_ID

    });


    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }


    const profile =
      await liff.getProfile();


    lineProfile.userId =
      profile.userId || '';


    lineProfile.displayName =
      profile.displayName || '';


    document
      .getElementById(
        'userStatus'
      )
      .textContent =
        '您好，' +
        lineProfile.displayName +
        ' 👋';


    loadVenueData();


  } catch (error) {

    console.error(error);


    document
      .getElementById(
        'userStatus'
      )
      .textContent =
        'LINE 初始化失敗';


    showError(
      'LINE 初始化失敗：' +
      error.message
    );

  }

}


/* =====================================================
   載入 GAS 資料
===================================================== */

function loadVenueData() {

  showLoading();


  callAPI(

    {
      action: 'all'
    },

    function(result) {

      console.log(
        'GAS 回傳資料：',
        result
      );


      if (
        !result ||
        result.success !== true
      ) {

        showError(

          result &&
          result.error

            ? result.error

            : '無法取得場館資料'

        );

        return;

      }


      /*
       * =================================================
       * 重要
       *
       * GAS 回傳：
       *
       * {
       *   weekday: "星期一",
       *   name: "排羽球場",
       *   time: "8:00-10:00",
       *   status: "上課"
       * }
       *
       * 這裡完整保留
       * =================================================
       */

      allVenueData =
        Array.isArray(result.data)
          ? result.data
          : [];


      console.log(
        '資料筆數：',
        allVenueData.length
      );


      /*
       * 檢查資料
       */

      if (
        allVenueData.length > 0
      ) {

        console.log(
          '第一筆資料：',
          allVenueData[0]
        );

        console.log(
          '第一筆 status：',
          allVenueData[0].status
        );

      }


      buildVenueSelect();


      document
        .getElementById(
          'result'
        )
        .innerHTML =

          '<div class="empty">' +

          '請先選擇場地。' +

          '</div>';


      document
        .getElementById(
          'tableCount'
        )
        .textContent =
          '';


      updateTime();

    }

  );

}


/* =====================================================
   建立場地選單
===================================================== */

function buildVenueSelect() {

  const select =
    document.getElementById(
      'venueSelect'
    );


  const venues = [];


  allVenueData.forEach(
    function(item) {

      if (!item) {
        return;
      }


      const name =
        String(
          item.name == null
            ? ''
            : item.name
        ).trim();


      if (
        name &&
        !venues.includes(name)
      ) {

        venues.push(name);

      }

    }
  );


  venues.sort(
    function(a, b) {

      return a.localeCompare(
        b,
        'zh-Hant'
      );

    }
  );


  select.innerHTML = '';


  const defaultOption =
    document.createElement(
      'option'
    );


  defaultOption.value = '';

  defaultOption.textContent =
    '請選擇場地';


  select.appendChild(
    defaultOption
  );


  venues.forEach(
    function(venue) {

      const option =
        document.createElement(
          'option'
        );


      option.value =
        venue;


      option.textContent =
        venue;


      select.appendChild(
        option
      );

    }
  );


  select.disabled =
    venues.length === 0;


  if (
    venues.length === 0
  ) {

    select.innerHTML =

      '<option value="">' +

      '目前沒有場地資料' +

      '</option>';

  }

}


/* =====================================================
   更換場地
===================================================== */

function changeVenue() {

  const select =
    document.getElementById(
      'venueSelect'
    );


  selectedVenue =
    select.value;


  if (
    !selectedVenue
  ) {

    document
      .getElementById(
        'currentVenue'
      )
      .style.display =
        'none';


    document
      .getElementById(
        'result'
      )
      .innerHTML =

        '<div class="empty">' +

        '請先選擇場地。' +

        '</div>';


    document
      .getElementById(
        'tableTitle'
      )
      .textContent =
        '場館使用狀況';


    document
      .getElementById(
        'tableCount'
      )
      .textContent =
        '';


    return;

  }


  const currentVenue =
    document.getElementById(
      'currentVenue'
    );


  currentVenue.style.display =
    'block';


  currentVenue.innerHTML =

    '目前查詢：<strong>' +

    escapeHTML(
      selectedVenue
    ) +

    '</strong>';


  renderSchedule();

}


/* =====================================================
   顯示星期資料
===================================================== */

function renderSchedule() {


  /*
   * 篩選目前場地
   */

  const venueData =
    allVenueData.filter(
      function(item) {

        if (!item) {
          return false;
        }


        const name =
          String(
            item.name == null
              ? ''
              : item.name
          ).trim();


        return (
          name === selectedVenue
        );

      }
    );


  console.log(
    '目前場地：',
    selectedVenue
  );


  console.log(
    '目前場地資料：',
    venueData
  );


  if (
    venueData.length === 0
  ) {

    document
      .getElementById(
        'result'
      )
      .innerHTML =

        '<div class="empty">' +

        '此場地目前沒有資料。' +

        '</div>';

    return;

  }


  /*
   * =================================================
   * 建立星期資料
   *
   * {
   *   星期一: [],
   *   星期二: [],
   *   ...
   * }
   * =================================================
   */

  const dayMap = {};


  DAYS.forEach(
    function(day) {

      dayMap[day] = [];

    }
  );


  /*
   * =================================================
   * 將 GAS 每一筆資料放入對應星期
   * =================================================
   */

  venueData.forEach(
    function(item) {

      const day =
        normalizeDay(
          item.weekday
        );


      /*
       * 時間
       */

      const time =
        String(
          item.time == null
            ? ''
            : item.time
        ).trim();


      /*
       * =================================================
       * 最重要：
       *
       * 直接讀 GAS 的 status 欄位
       *
       * 絕對不使用 undefined
       * =================================================
       */

      const status =
        String(
          item.status == null
            ? ''
            : item.status
        ).trim();


      console.log(
        '資料：',
        {
          day: day,
          time: time,
          status: status
        }
      );


      /*
       * 星期有效
       */

      if (
        !dayMap[day]
      ) {

        return;

      }


      dayMap[day].push({

        time:
          time,

        status:
          status

      });

    }
  );


  /*
   * =================================================
   * 每個星期自己的時間排序
   *
   * 不要求星期一～日使用相同時間
   * =================================================
   */

  DAYS.forEach(
    function(day) {

      dayMap[day].sort(
        function(a, b) {

          return (
            getStartMinutes(a.time) -
            getStartMinutes(b.time)
          );

        }
      );

    }
  );


  /*
   * =================================================
   * 建立 HTML
   * =================================================
   */

  let html = '';


  DAYS.forEach(
    function(day) {


      const list =
        dayMap[day];


      /*
       * 星期區塊
       */

      html +=

        '<div class="day-card">';


      /*
       * 星期標題
       */

      html +=

        '<div class="day-header">' +

        escapeHTML(day) +

        '</div>';


      /*
       * 時間列表
       */

      html +=

        '<div class="time-list">';


      /*
       * 沒有資料
       */

      if (
        list.length === 0
      ) {

        html +=

          '<div class="status status-empty">' +

          '本日無資料' +

          '</div>';

      }


      /*
       * 有資料
       */

      list.forEach(
        function(item) {


          html +=

            '<div class="time-row">';


          /*
           * 時間
           */

          html +=

            '<div class="time-label">' +

            escapeHTML(
              item.time
            ) +

            '</div>';


          /*
           * =================================================
           * 狀態
           *
           * item.status 就是 GAS 的 status
           * =================================================
           */

          html +=

            createStatusHTML(
              item.status
            );


          html +=

            '</div>';

        }
      );


      html +=

        '</div>' +

        '</div>';

    }
  );


  /*
   * 顯示
   */

  document
    .getElementById(
      'result'
    )
    .innerHTML =
      html;


  /*
   * 標題
   */

  document
    .getElementById(
      'tableTitle'
    )
    .textContent =

      selectedVenue +
      ' 使用狀況';


  /*
   * 筆數
   */

  document
    .getElementById(
      'tableCount'
    )
    .textContent =

      venueData.length +
      ' 筆';

}


/* =====================================================
   狀態顯示
===================================================== */

function createStatusHTML(status) {


  /*
   * =================================================
   * 強制把 undefined / null 轉成空字串
   * =================================================
   */

  const text =
    String(
      status == null
        ? ''
        : status
    ).trim();


  /*
   * 如果真的沒有 status
   */

  if (!text) {

    return

      '<div class="status status-other">' +

      '⚪ 未設定狀態' +

      '</div>';

  }


  let className =
    'status-other';


  let icon =
    '⚪';


  /*
   * 上課
   */

  if (
    text === '上課'
  ) {

    className =
      'status-class';

    icon =
      '🔴';

  }


  /*
   * 可使用
   */

  else if (
    text === '可使用'
  ) {

    className =
      'status-available';

    icon =
      '🟢';

  }


  /*
   * 已預約
   */

  else if (
    text === '已預約'
  ) {

    className =
      'status-reserved';

    icon =
      '🟡';

  }


  /*
   * =================================================
   * 最終輸出
   *
   * 這裡顯示的是 GAS status 欄位
   * =================================================
   */

  return

    '<div class="status ' +
    className +
    '">' +

    '<span>' +

    icon +

    '</span>' +

    '<span>' +

    escapeHTML(
      text
    ) +

    '</span>' +

    '</div>';

}


/* =====================================================
   星期標準化
===================================================== */

function normalizeDay(value) {

  let text =
    String(
      value == null
        ? ''
        : value
    ).trim();


  text =
    text
      .replace(
        /^週/,
        '星期'
      )
      .replace(
        /^周/,
        '星期'
      );


  if (
    /^[一二三四五六日天]$/.test(
      text
    )
  ) {

    if (text === '天') {

      text = '日';

    }


    text =
      '星期' +
      text;

  }


  return text;

}


/* =====================================================
   時間排序
===================================================== */

function getStartMinutes(value) {

  const text =
    String(
      value == null
        ? ''
        : value
    ).trim();


  /*
   * 支援：
   *
   * 8:00-10:00
   * 08:00-10:00
   * 12:00-13:00
   * 17:00-21:30
   *
   * 以及：
   *
   * 8：00-10：00
   */

  const match =
    text.match(
      /(\d{1,2})\s*[:：]\s*(\d{1,2})/
    );


  if (
    !match
  ) {

    return 99999;

  }


  return (

    Number(
      match[1]
    ) * 60 +

    Number(
      match[2]
    )

  );

}


/* =====================================================
   GAS JSONP
===================================================== */

function callAPI(
  params,
  callback
) {


  const callbackName =

    'venueCallback_' +

    Date.now() +

    '_' +

    Math.floor(
      Math.random() * 100000
    );


  params.callback =
    callbackName;


  const query =

    Object.keys(params)

      .map(
        function(key) {

          return (

            encodeURIComponent(
              key
            ) +

            '=' +

            encodeURIComponent(
              params[key]
            )

          );

        }
      )

      .join('&');


  const script =
    document.createElement(
      'script'
    );


  let finished =
    false;


  const timeout =

    setTimeout(
      function() {

        if (
          finished
        ) {

          return;

        }


        finished =
          true;


        cleanup();


        callback({

          success: false,

          error:
            'GAS API 連線逾時'

        });

      },

      15000

    );


  window[callbackName] =

    function(data) {

      if (
        finished
      ) {

        return;

      }


      finished =
        true;


      clearTimeout(
        timeout
      );


      cleanup();


      callback(
        data
      );

    };


  function cleanup() {

    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }


    try {

      delete window[
        callbackName
      ];

    } catch (e) {

      window[
        callbackName
      ] = undefined;

    }

  }


  script.onerror =

    function() {

      if (
        finished
      ) {

        return;

      }


      finished =
        true;


      clearTimeout(
        timeout
      );


      cleanup();


      callback({

        success: false,

        error:
          '無法連線至 GAS API'

      });

    };


  /*
   * GAS URL
   */

  script.src =

    API_URL +

    '?' +

    query;


  document.body.appendChild(
    script
  );

}


/* =====================================================
   Loading
===================================================== */

function showLoading() {

  document
    .getElementById(
      'result'
    )
    .innerHTML =

      '<div class="loading">' +

      '⏳ 正在載入場館資料...' +

      '</div>';

}


/* =====================================================
   Error
===================================================== */

function showError(message) {

  document
    .getElementById(
      'result'
    )
    .innerHTML =

      '<div class="error">' +

      '⚠️ ' +

      escapeHTML(
        message
      ) +

      '<br><br>' +

      '請確認 GAS Web App URL、Google Sheet ID，以及工作表資料。' +

      '</div>';

}


/* =====================================================
   更新時間
===================================================== */

function updateTime() {

  const now =
    new Date();


  document
    .getElementById(
      'updateTime'
    )
    .textContent =

      '最後更新：' +

      now.toLocaleString(
        'zh-TW',
        {

          year: 'numeric',

          month: '2-digit',

          day: '2-digit',

          hour: '2-digit',

          minute: '2-digit'

        }
      );

}


/* =====================================================
   HTML Escape
===================================================== */

function escapeHTML(value) {

  return String(

    value == null
      ? ''
      : value

  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
