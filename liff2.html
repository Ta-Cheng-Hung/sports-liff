<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>場館使用｜實踐大學體育室</title>

<style>

/* ==========================================
   基本設定
========================================== */

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {

  margin: 0;

  background:
    linear-gradient(
      180deg,
      #fff8f0 0%,
      #f7f9fc 100%
    );

  color: #333;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

}


/* ==========================================
   Header
========================================== */

.header {

  background:
    linear-gradient(
      135deg,
      #e87918,
      #f39a45
    );

  color: white;

  padding:
    28px 18px 30px;

  text-align: center;

  border-radius:
    0 0 28px 28px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.12);

}


.logo {

  width: 68px;

  height: 68px;

  margin:
    0 auto 12px;

  background: white;

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #e87918;

  font-size: 30px;

  font-weight: bold;

}


.header h1 {

  margin: 5px 0;

  font-size: 23px;

}


.header p {

  margin: 7px 0 0;

  font-size: 13px;

  opacity: .92;

}


/* ==========================================
   Container
========================================== */

.container {

  width: 100%;

  max-width: 900px;

  margin: 0 auto;

  padding:
    18px 12px 40px;

}


/* ==========================================
   LINE 使用者
========================================== */

.user-box {

  background: white;

  border-radius: 14px;

  padding:
    11px 14px;

  margin-bottom: 14px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);

  color: #666;

  font-size: 13px;

}


/* ==========================================
   控制區
========================================== */

.control-box {

  background: white;

  border-radius: 18px;

  padding: 17px;

  margin-bottom: 14px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.06);

}


.control-title {

  font-size: 19px;

  font-weight: bold;

  margin-bottom: 5px;

}


.control-description {

  color: #777;

  font-size: 13px;

  line-height: 1.6;

  margin-bottom: 13px;

}


/* ==========================================
   星期按鈕
========================================== */

.week-buttons {

  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  gap: 6px;

}


.week-button {

  border: none;

  border-radius: 9px;

  padding:
    10px 4px;

  background: #f1f3f5;

  color: #555;

  font-size: 13px;

  cursor: pointer;

  transition:
    .15s;

}


.week-button:active {

  transform:
    scale(.96);

}


.week-button.active {

  background: #e87918;

  color: white;

  font-weight: bold;

}


@media (
  max-width: 500px
) {

  .week-buttons {

    grid-template-columns:
      repeat(4, 1fr);

  }

}


/* ==========================================
   全部按鈕
========================================== */

.all-button {

  width: 100%;

  margin-top: 9px;

  padding: 10px;

  border: none;

  border-radius: 9px;

  background: #f5f5f5;

  color: #666;

  font-size: 13px;

}


.all-button:active {

  transform:
    scale(.98);

}


/* ==========================================
   圖例
========================================== */

.legend {

  background: white;

  border-radius: 15px;

  padding:
    12px 14px;

  margin-bottom: 14px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);

  display: flex;

  flex-wrap: wrap;

  gap: 8px 14px;

  align-items: center;

  font-size: 12px;

  color: #555;

}


.legend-title {

  font-weight: bold;

  margin-right: 2px;

}


.legend-item {

  display: inline-flex;

  align-items: center;

  gap: 5px;

}


.legend-dot {

  width: 13px;

  height: 13px;

  border-radius: 50%;

  display: inline-block;

}


.dot-class {

  background: #e53935;

}


.dot-available {

  background: #2e9d50;

}


.dot-reserved {

  background: #e3b800;

}


/* ==========================================
   資料標題
========================================== */

.result-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin:
    0 2px 8px;

}


.result-title {

  font-size: 17px;

  font-weight: bold;

}


.result-count {

  color: #999;

  font-size: 12px;

}


/* ==========================================
   Loading
========================================== */

.loading {

  background: white;

  border-radius: 16px;

  padding: 30px 15px;

  text-align: center;

  color: #888;

  font-size: 13px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);

}


/* ==========================================
   Error
========================================== */

.error {

  background: #fff1f1;

  border:
    1px solid #ffcaca;

  color: #c62828;

  border-radius: 14px;

  padding: 15px;

  line-height: 1.7;

  font-size: 13px;

}


/* ==========================================
   空資料
========================================== */

.empty {

  background: white;

  border-radius: 16px;

  padding: 30px 15px;

  text-align: center;

  color: #999;

  font-size: 13px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);

}


/* ==========================================
   表格外框
========================================== */

.table-card {

  background: white;

  border-radius: 17px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.07);

  overflow: hidden;

}


/* ==========================================
   表格水平滑動
========================================== */

.table-scroll {

  width: 100%;

  overflow-x: auto;

  -webkit-overflow-scrolling: touch;

}


/* ==========================================
   表格
========================================== */

.venue-table {

  border-collapse: separate;

  border-spacing: 0;

  width: 100%;

  min-width: 600px;

  table-layout: fixed;

}


/* ==========================================
   Header
========================================== */

.venue-table th {

  background: #f5f7f9;

  color: #444;

  font-size: 13px;

  font-weight: bold;

  padding:
    12px 8px;

  text-align: center;

  border-right:
    1px solid #e5e7ea;

  border-bottom:
    1px solid #ddd;

  white-space: nowrap;

}


/* 第一欄時段 */

.venue-table th.time-column {

  width: 105px;

  position: sticky;

  left: 0;

  z-index: 3;

  background: #eef1f4;

}


/* ==========================================
   Body
========================================== */

.venue-table td {

  padding:
    8px;

  text-align: center;

  vertical-align: middle;

  border-right:
    1px solid #e8eaed;

  border-bottom:
    1px solid #e8eaed;

  font-size: 12px;

  min-width: 125px;

}


/* 時段欄 */

.venue-table td.time-cell {

  width: 105px;

  min-width: 105px;

  position: sticky;

  left: 0;

  z-index: 2;

  background: white;

  font-weight: bold;

  color: #555;

}


/* ==========================================
   最後一欄
========================================== */

.venue-table th:last-child,
.venue-table td:last-child {

  border-right: none;

}


/* ==========================================
   狀態格
========================================== */

.status-cell {

  min-height: 58px;

  border-radius: 10px;

  padding:
    10px 6px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-weight: bold;

  line-height: 1.4;

}


/* ==========================================
   上課
========================================== */

.status-class {

  background: #ffe1e1;

  color: #c62828;

  border:
    1px solid #ffb3b3;

}


/* ==========================================
   可使用
========================================== */

.status-available {

  background: #e4f7e9;

  color: #16853a;

  border:
    1px solid #a8ddb6;

}


/* ==========================================
   已預約
========================================== */

.status-reserved {

  background: #fff4bd;

  color: #816500;

  border:
    1px solid #ead36a;

}


/* ==========================================
   其他
========================================== */

.status-other {

  background: #f1f3f5;

  color: #666;

  border:
    1px solid #ddd;

}


/* ==========================================
   無資料
========================================== */

.status-empty {

  background: #fafafa;

  color: #bbb;

  border:
    1px solid #eee;

  font-weight: normal;

}


/* ==========================================
   Footer
========================================== */

.footer {

  margin-top: 25px;

  text-align: center;

  color: #999;

  font-size: 12px;

  line-height: 1.7;

}


/* ==========================================
   更新時間
========================================== */

.update-time {

  text-align: right;

  color: #aaa;

  font-size: 11px;

  margin-top: 8px;

}


/* ==========================================
   小螢幕
========================================== */

@media (
  max-width: 600px
) {

  .container {

    padding-left: 8px;

    padding-right: 8px;

  }


  .header {

    padding:
      24px 15px 27px;

  }


  .header h1 {

    font-size: 21px;

  }


  .venue-table {

    min-width: 560px;

  }


  .venue-table th {

    padding:
      10px 5px;

    font-size: 12px;

  }


  .venue-table td {

    padding:
      6px 4px;

  }


  .venue-table th.time-column,
  .venue-table td.time-cell {

    width: 90px;

    min-width: 90px;

  }

}

</style>

</head>


<body>


<!-- ==========================================
     Header
========================================== -->

<div class="header">

  <div class="logo">
    館
  </div>

  <h1>
    場館使用
  </h1>

  <p>
    實踐大學體育室 LINE 智慧服務
  </p>

</div>


<div class="container">


<!-- ==========================================
     LINE 使用者
========================================== -->

<div class="user-box">

  <span id="userStatus">
    正在連線...
  </span>

</div>


<!-- ==========================================
     星期選擇
========================================== -->

<div class="control-box">

  <div class="control-title">
    📅 選擇星期
  </div>

  <div class="control-description">

    選擇星期後，
    系統會顯示該日所有場館使用狀況。

  </div>


  <div
    id="weekButtons"
    class="week-buttons"
  >

    <button
      class="week-button"
      data-week="星期一"
      onclick="selectWeek('星期一')"
    >
      星期一
    </button>

    <button
      class="week-button"
      data-week="星期二"
      onclick="selectWeek('星期二')"
    >
      星期二
    </button>

    <button
      class="week-button"
      data-week="星期三"
      onclick="selectWeek('星期三')"
    >
      星期三
    </button>

    <button
      class="week-button"
      data-week="星期四"
      onclick="selectWeek('星期四')"
    >
      星期四
    </button>

    <button
      class="week-button"
      data-week="星期五"
      onclick="selectWeek('星期五')"
    >
      星期五
    </button>

    <button
      class="week-button"
      data-week="星期六"
      onclick="selectWeek('星期六')"
    >
      星期六
    </button>

    <button
      class="week-button"
      data-week="星期日"
      onclick="selectWeek('星期日')"
    >
      星期日
    </button>

  </div>


  <button
    class="all-button"
    onclick="selectAll()"
  >
    📋 顯示全部資料
  </button>

</div>


<!-- ==========================================
     圖例
========================================== -->

<div class="legend">

  <span class="legend-title">
    狀態：
  </span>


  <span class="legend-item">

    <span
      class="legend-dot dot-class"
    ></span>

    上課

  </span>


  <span class="legend-item">

    <span
      class="legend-dot dot-available"
    ></span>

    可使用

  </span>


  <span class="legend-item">

    <span
      class="legend-dot dot-reserved"
    ></span>

    已預約

  </span>

</div>


<!-- ==========================================
     結果標題
========================================== -->

<div class="result-header">

  <div
    id="resultTitle"
    class="result-title"
  >
    場館使用狀況
  </div>


  <div
    id="resultCount"
    class="result-count"
  >
  </div>

</div>


<!-- ==========================================
     結果
========================================== -->

<div id="result">

  <div class="loading">
    正在載入場館資料...
  </div>

</div>


<div
  id="updateTime"
  class="update-time"
>
</div>


<!-- ==========================================
     Footer
========================================== -->

<div class="footer">

  實踐大學體育室

  <br>

  LINE 智慧服務中心

  <br>

  © Shih Chien University

</div>


</div>


<!-- ==========================================
     LIFF SDK
========================================== -->

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<script>

/* ==========================================
   設定
========================================== */


// ------------------------------------------
// LIFF 2 ID
// ------------------------------------------

const LIFF_ID =
  '2011024432-afjj4k3z';


// ------------------------------------------
// GAS ③ Web App URL
//
// ⚠️ 請把下面這一行換成
// 你的 GAS ③ Web App URL
// ------------------------------------------

const API_URL =
  'https://script.google.com/macros/s/AKfycbwyWQ_pv0Mfu7X9B46xALn8QaDMvbK22MHYINIZl1vMrLxJtwQmsGUU_Sx6UnA4AuyR/exec';


// ------------------------------------------
// 資料
// ------------------------------------------

let allVenueData = [];

let selectedWeek = '';

let lineProfile = {

  userId: '',

  displayName: ''

};


/* ==========================================
   頁面啟動
========================================== */

window.addEventListener(
  'load',
  initLIFF
);


/* ==========================================
   LIFF 初始化
========================================== */

async function initLIFF() {

  try {

    await liff.init({

      liffId:
        LIFF_ID

    });


    // --------------------------------------
    // 尚未登入
    // --------------------------------------

    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;

    }


    // --------------------------------------
    // 取得 LINE 個人資料
    // --------------------------------------

    const profile =
      await liff.getProfile();


    lineProfile.userId =
      profile.userId || '';


    lineProfile.displayName =
      profile.displayName || '';


    document
      .getElementById(
        'userStatus'
      )
      .textContent =
        '您好，' +
        lineProfile.displayName +
        ' 👋';


    // --------------------------------------
    // 取得場館資料
    // --------------------------------------

    loadAllVenue();


  } catch (error) {

    console.error(
      error
    );


    document
      .getElementById(
        'userStatus'
      )
      .textContent =
        'LINE 初始化失敗';


    showError(
      'LINE 初始化失敗：' +
      error.message
    );

  }

}


/* ==========================================
   API
========================================== */

function callAPI(
  params,
  callback
) {


  // ----------------------------------------
  // JSONP callback 名稱
  // ----------------------------------------

  const callbackName =

    'venueCallback_' +

    Date.now() +

    '_' +

    Math.floor(
      Math.random() * 100000
    );


  params.callback =
    callbackName;


  // ----------------------------------------
  // Query String
  // ----------------------------------------

  const query =

    Object.keys(params)

      .map(function(key) {

        return (

          encodeURIComponent(key) +

          '=' +

          encodeURIComponent(
            params[key]
          )

        );

      })

      .join('&');


  // ----------------------------------------
  // 建立 script
  // ----------------------------------------

  const script =
    document.createElement(
      'script'
    );


  let finished = false;


  // ----------------------------------------
  // Timeout
  // ----------------------------------------

  const timeout =

    setTimeout(

      function() {

        if (finished) {
          return;
        }


        finished = true;


        cleanup();


        callback({

          success: false,

          error:
            'API 連線逾時'

        });

      },

      15000

    );


  // ----------------------------------------
  // Callback
  // ----------------------------------------

  window[callbackName] =

    function(data) {

      if (finished) {
        return;
      }


      finished = true;


      clearTimeout(
        timeout
      );


      cleanup();


      callback(data);

    };


  // ----------------------------------------
  // Cleanup
  // ----------------------------------------

  function cleanup() {

    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }


    try {

      delete window[
        callbackName
      ];

    } catch (e) {

      window[
        callbackName
      ] = undefined;

    }

  }


  // ----------------------------------------
  // Error
  // ----------------------------------------

  script.onerror =

    function() {

      if (finished) {
        return;
      }


      finished = true;


      clearTimeout(
        timeout
      );


      cleanup();


      callback({

        success: false,

        error:
          '無法連線至 GAS ③ API'

      });

    };


  // ----------------------------------------
  // 發送
  // ----------------------------------------

  script.src =

    API_URL +

    '?' +

    query;


  document.body.appendChild(
    script
  );

}


/* ==========================================
   載入全部場館
========================================== */

function loadAllVenue() {

  showLoading();


  callAPI(

    {

      action:
        'all'

    },

    function(result) {


      if (
        !result ||
        !result.success
      ) {

        showError(

          result &&
          result.error

            ? result.error

            : '無法取得場館資料。'

        );


        return;

      }


      allVenueData =
        result.data || [];


      selectedWeek = '';


      clearWeekButtons();


      renderTable(
        allVenueData
      );


      updateTime();

    }

  );

}


/* ==========================================
   選擇星期
========================================== */

function selectWeek(
  week
) {

  selectedWeek =
    week;


  // ----------------------------------------
  // 按鈕 active
  // ----------------------------------------

  const buttons =
    document.querySelectorAll(
      '.week-button'
    );


  buttons.forEach(
    function(button) {

      if (
        button.dataset.week ===
        week
      ) {

        button.classList.add(
          'active'
        );

      } else {

        button.classList.remove(
          'active'
        );

      }

    }
  );


  // ----------------------------------------
  // 篩選
  // ----------------------------------------

  const filtered =

    allVenueData.filter(
      function(item) {

        return normalizeWeek(
          item.weekday
        ) ===
        normalizeWeek(
          week
        );

      }
    );


  renderTable(
    filtered
  );

}


/* ==========================================
   顯示全部
========================================== */

function selectAll() {

  selectedWeek = '';


  clearWeekButtons();


  renderTable(
    allVenueData
  );

}


/* ==========================================
   清除星期按鈕
========================================== */

function clearWeekButtons() {

  const buttons =
    document.querySelectorAll(
      '.week-button'
    );


  buttons.forEach(
    function(button) {

      button.classList.remove(
        'active'
      );

    }
  );

}


/* ==========================================
   星期格式標準化
========================================== */

function normalizeWeek(
  value
) {

  return String(
    value || ''
  )

    .trim()

    .replace(
      /\s+/g,
      ''
    );

}


/* ==========================================
   顯示表格
========================================== */

function renderTable(
  data
) {

  const result =
    document.getElementById(
      'result'
    );


  const title =
    document.getElementById(
      'resultTitle'
    );


  const count =
    document.getElementById(
      'resultCount'
    );


  // ----------------------------------------
  // 沒有資料
  // ----------------------------------------

  if (
    !data ||
    !data.length
  ) {

    title.textContent =
      selectedWeek
        ? selectedWeek +
          ' 場館使用狀況'
        : '場館使用狀況';


    count.textContent =
      '0 筆';


    result.innerHTML =

      '<div class="empty">' +

      '目前沒有場館資料。' +

      '</div>';


    return;

  }


  // ----------------------------------------
  // 標題
  // ----------------------------------------

  title.textContent =

    selectedWeek

      ? selectedWeek +
        ' 場館使用狀況'

      : '全部場館使用狀況';


  count.textContent =

    data.length +
    ' 筆';


  // ----------------------------------------
  // 取得場地
  // ----------------------------------------

  const venueNames = [];


  data.forEach(
    function(item) {

      const name =
        String(
          item.name || ''
        ).trim();


      if (
        name &&
        !venueNames.includes(
          name
        )
      ) {

        venueNames.push(
          name
        );

      }

    }
  );


  // ----------------------------------------
  // 取得時段
  // ----------------------------------------

  const times = [];


  data.forEach(
    function(item) {

      const time =
        String(
          item.time || ''
        ).trim();


      if (
        time &&
        !times.includes(
          time
        )
      ) {

        times.push(
          time
        );

      }

    }
  );


  // ----------------------------------------
  // 排序時段
  // ----------------------------------------

  times.sort(
    sortTime
  );


  // ----------------------------------------
  // 建立資料索引
  // ----------------------------------------

  const map = {};


  data.forEach(
    function(item) {

      const name =
        String(
          item.name || ''
        ).trim();


      const time =
        String(
          item.time || ''
        ).trim();


      const key =
        name +
        '||' +
        time;


      map[key] =
        item.status || '';

    }
  );


  // ----------------------------------------
  // 表格開始
  // ----------------------------------------

  let html =

    '<div class="table-card">' +

    '<div class="table-scroll">' +

    '<table class="venue-table">';


  // ----------------------------------------
  // 表頭
  // ----------------------------------------

  html +=

    '<thead>' +

    '<tr>' +

    '<th class="time-column">' +

    '時段' +

    '</th>';


  venueNames.forEach(
    function(name) {

      html +=

        '<th>' +

        escapeHTML(
          name
        ) +

        '</th>';

    }
  );


  html +=

    '</tr>' +

    '</thead>';


  // ----------------------------------------
  // 表身
  // ----------------------------------------

  html +=

    '<tbody>';


  times.forEach(
    function(time) {

      html +=

        '<tr>';


      // 時段

      html +=

        '<td class="time-cell">' +

        escapeHTML(
          time
        ) +

        '</td>';


      // 每一個場地

      venueNames.forEach(
        function(name) {


          const key =
            name +
            '||' +
            time;


          const status =
            map[key];


          html +=

            '<td>';


          if (
            status
          ) {

            html +=

              createStatusHTML(
                status
              );

          } else {

            html +=

              '<div class="status-cell status-empty">' +

              '—' +

              '</div>';

          }


          html +=

            '</td>';

        }
      );


      html +=

        '</tr>';

    }
  );


  html +=

    '</tbody>' +

    '</table>' +

    '</div>' +

    '</div>';


  result.innerHTML =
    html;

}


/* ==========================================
   狀態 HTML
========================================== */

function createStatusHTML(
  status
) {

  const text =
    String(
      status || ''
    ).trim();


  let className =
    'status-other';


  let icon =
    '';


  // ----------------------------------------
  // 上課
  // ----------------------------------------

  if (
    text === '上課'
  ) {

    className =
      'status-class';

    icon =
      '🔴';

  }


  // ----------------------------------------
  // 可使用
  // ----------------------------------------

  else if (
    text === '可使用'
  ) {

    className =
      'status-available';

    icon =
      '🟢';

  }


  // ----------------------------------------
  // 已預約
  // ----------------------------------------

  else if (
    text === '已預約'
  ) {

    className =
      'status-reserved';

    icon =
      '🟡';

  }


  return

    '<div class="status-cell ' +
    className +
    '">' +

    icon +

    '<br>' +

    escapeHTML(
      text
    ) +

    '</div>';

}


/* ==========================================
   時段排序
========================================== */

function sortTime(
  a,
  b
) {

  const aStart =
    getStartMinutes(a);


  const bStart =
    getStartMinutes(b);


  return (
    aStart -
    bStart
  );

}


/* ==========================================
   取得時段開始時間
========================================== */

function getStartMinutes(
  value
) {

  const text =
    String(
      value || ''
    );


  const match =
    text.match(
      /(\d{1,2})\s*[:：]\s*(\d{2})/
    );


  if (!match) {

    return 99999;

  }


  return (

    Number(
      match[1]
    ) * 60 +

    Number(
      match[2]
    )

  );

}


/* ==========================================
   Loading
========================================== */

function showLoading() {

  document
    .getElementById(
      'result'
    )
    .innerHTML =

      '<div class="loading">' +

      '⏳ 正在載入場館資料...' +

      '</div>';


  document
    .getElementById(
      'resultCount'
    )
    .textContent =
      '';

}


/* ==========================================
   Error
========================================== */

function showError(
  message
) {

  document
    .getElementById(
      'result'
    )
    .innerHTML =

      '<div class="error">' +

      '⚠️ ' +

      escapeHTML(
        message
      ) +

      '<br><br>' +

      '請確認 GAS ③ Web App 是否已部署最新版本。' +

      '</div>';


  document
    .getElementById(
      'resultCount'
    )
    .textContent =
      '';

}


/* ==========================================
   更新時間
========================================== */

function updateTime() {

  const now =
    new Date();


  const text =

    '最後更新：' +

    now.toLocaleString(
      'zh-TW',
      {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      }
    );


  document
    .getElementById(
      'updateTime'
    )
    .textContent =
      text;

}


/* ==========================================
   HTML 安全
========================================== */

function escapeHTML(
  value
) {

  return String(

    value === null ||
    value === undefined

      ? ''

      : value

  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
