<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>場館使用｜實踐大學體育室</title>

<style>

/* =====================================================
   基本設定
===================================================== */

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {

  margin: 0;

  background:
    linear-gradient(
      180deg,
      #fff8f0 0%,
      #f7f9fc 100%
    );

  color: #333;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

}


/* =====================================================
   Header
===================================================== */

.header {

  background:
    linear-gradient(
      135deg,
      #e87918,
      #f39a45
    );

  color: white;

  text-align: center;

  padding:
    28px 18px 30px;

  border-radius:
    0 0 28px 28px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.12);

}


.logo {

  width: 68px;

  height: 68px;

  margin:
    0 auto 12px;

  border-radius: 50%;

  background: white;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #e87918;

  font-size: 30px;

  font-weight: bold;

}


.header h1 {

  margin: 5px 0;

  font-size: 23px;

}


.header p {

  margin:
    7px 0 0;

  font-size: 13px;

  opacity: .92;

}


/* =====================================================
   Container
===================================================== */

.container {

  width: 100%;

  max-width: 900px;

  margin: 0 auto;

  padding:
    18px 12px 40px;

}


/* =====================================================
   使用者
===================================================== */

.user-box {

  background: white;

  border-radius: 14px;

  padding:
    11px 14px;

  margin-bottom: 14px;

  color: #666;

  font-size: 13px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);

}


/* =====================================================
   場地選擇
===================================================== */

.select-box {

  background: white;

  border-radius: 18px;

  padding: 18px;

  margin-bottom: 15px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.06);

}


.select-title {

  font-size: 19px;

  font-weight: bold;

  margin-bottom: 6px;

}


.select-description {

  font-size: 13px;

  color: #777;

  line-height: 1.6;

  margin-bottom: 13px;

}


.venue-select {

  width: 100%;

  height: 48px;

  border:
    1px solid #ddd;

  border-radius: 11px;

  background: white;

  padding:
    0 13px;

  font-size: 16px;

  color: #333;

  outline: none;

}


.venue-select:focus {

  border-color: #e87918;

  box-shadow:
    0 0 0 3px
    rgba(232,121,24,.12);

}


.current-venue {

  margin-top: 12px;

  padding:
    10px 12px;

  background:
    #fff6ed;

  border-radius: 10px;

  color: #c46110;

  font-size: 13px;

}


/* =====================================================
   圖例
===================================================== */

.legend {

  background: white;

  border-radius: 15px;

  padding:
    12px 14px;

  margin-bottom: 15px;

  display: flex;

  flex-wrap: wrap;

  align-items: center;

  gap:
    8px 15px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);

  font-size: 12px;

  color: #555;

}


.legend-title {
  font-weight: bold;
}


.legend-item {

  display: inline-flex;

  align-items: center;

  gap: 5px;

}


.legend-dot {

  width: 13px;

  height: 13px;

  border-radius: 50%;

}


.dot-class {
  background: #e53935;
}


.dot-available {
  background: #2e9d50;
}


.dot-reserved {
  background: #e3b800;
}


/* =====================================================
   標題
===================================================== */

.table-title {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin:
    0 3px 10px;

}


.table-title-main {

  font-size: 18px;

  font-weight: bold;

}


.table-title-count {

  color: #999;

  font-size: 12px;

}


/* =====================================================
   星期區塊
===================================================== */

.day-card {

  background: white;

  border-radius: 17px;

  margin-bottom: 14px;

  overflow: hidden;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.08);

}


.day-header {

  padding:
    13px 15px;

  background:
    #f2f4f6;

  border-bottom:
    1px solid #e1e4e7;

  font-size: 17px;

  font-weight: bold;

}


.day-header small {

  margin-left: 6px;

  color: #999;

  font-size: 11px;

  font-weight: normal;

}


/* =====================================================
   時間列表
===================================================== */

.time-list {

  padding: 10px;

}


.time-item {

  display: flex;

  align-items: stretch;

  gap: 10px;

  margin-bottom: 9px;

}


.time-item:last-child {

  margin-bottom: 0;

}


/* =====================================================
   時間
===================================================== */

.time-label {

  width: 110px;

  min-width: 110px;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 8px;

  border-radius: 10px;

  background:
    #f7f8f9;

  color: #555;

  font-size: 12px;

  font-weight: bold;

  text-align: center;

}


/* =====================================================
   狀態
===================================================== */

.status {

  flex: 1;

  min-height: 48px;

  padding:
    8px 12px;

  border-radius: 10px;

  display: flex;

  align-items: center;

  gap: 7px;

  line-height: 1.4;

  font-size: 13px;

  font-weight: bold;

}


.status-class {

  background:
    #ffdede;

  color:
    #c62828;

  border:
    1px solid #ffb0b0;

}


.status-available {

  background:
    #ddf5e4;

  color:
    #16833a;

  border:
    1px solid #a4d9b1;

}


.status-reserved {

  background:
    #fff2b8;

  color:
    #806500;

  border:
    1px solid #e5cf69;

}


.status-other {

  background:
    #f1f3f5;

  color:
    #666;

  border:
    1px solid #ddd;

}


/* =====================================================
   空白星期
===================================================== */

.day-empty {

  padding:
    18px;

  text-align: center;

  color: #aaa;

  font-size: 13px;

}


/* =====================================================
   Loading
===================================================== */

.loading {

  background: white;

  border-radius: 16px;

  padding:
    32px 15px;

  text-align: center;

  color: #888;

  font-size: 13px;

}


/* =====================================================
   Error
===================================================== */

.error {

  background:
    #fff1f1;

  border:
    1px solid #ffc8c8;

  color:
    #c62828;

  border-radius: 14px;

  padding:
    16px;

  font-size: 13px;

  line-height: 1.7;

}


/* =====================================================
   空資料
===================================================== */

.empty {

  background: white;

  border-radius: 16px;

  padding:
    35px 15px;

  text-align: center;

  color: #999;

  font-size: 13px;

}


/* =====================================================
   更新時間
===================================================== */

.update-time {

  text-align: right;

  margin-top: 8px;

  color: #aaa;

  font-size: 11px;

}


/* =====================================================
   Footer
===================================================== */

.footer {

  margin-top: 25px;

  text-align: center;

  color: #999;

  font-size: 12px;

  line-height: 1.7;

}


/* =====================================================
   手機
===================================================== */

@media (max-width: 600px) {

  .container {

    padding-left: 8px;

    padding-right: 8px;

  }


  .header {

    padding:
      24px 15px 27px;

  }


  .header h1 {

    font-size: 21px;

  }


  .time-item {

    gap: 7px;

  }


  .time-label {

    width: 92px;

    min-width: 92px;

    font-size: 11px;

  }


  .status {

    font-size: 12px;

    padding:
      8px 9px;

  }

}

</style>

</head>


<body>


<!-- =================================================
     Header
================================================= -->

<div class="header">

  <div class="logo">
    館
  </div>

  <h1>
    場館使用
  </h1>

  <p>
    實踐大學體育室 LINE 智慧服務
  </p>

</div>


<div class="container">


<!-- =================================================
     LINE 使用者
================================================= -->

<div class="user-box">

  <span id="userStatus">
    正在連線...
  </span>

</div>


<!-- =================================================
     場地選擇
================================================= -->

<div class="select-box">

  <div class="select-title">
    🏟️ 選擇場地
  </div>

  <div class="select-description">

    請選擇要查詢的場地，
    下方將依星期顯示各自的使用時間與狀態。

  </div>


  <select
    id="venueSelect"
    class="venue-select"
    onchange="changeVenue()"
    disabled
  >

    <option value="">
      正在載入場地...
    </option>

  </select>


  <div
    id="currentVenue"
    class="current-venue"
    style="display:none;"
  >
  </div>

</div>


<!-- =================================================
     圖例
================================================= -->

<div class="legend">

  <span class="legend-title">
    狀態：
  </span>


  <span class="legend-item">

    <span class="legend-dot dot-class"></span>

    上課

  </span>


  <span class="legend-item">

    <span class="legend-dot dot-available"></span>

    可使用

  </span>


  <span class="legend-item">

    <span class="legend-dot dot-reserved"></span>

    已預約

  </span>

</div>


<!-- =================================================
     標題
================================================= -->

<div class="table-title">

  <div
    id="tableTitle"
    class="table-title-main"
  >
    場館使用狀況
  </div>


  <div
    id="tableCount"
    class="table-title-count"
  >
  </div>

</div>


<!-- =================================================
     結果
================================================= -->

<div id="result">

  <div class="loading">

    ⏳ 正在載入場館資料...

  </div>

</div>


<div
  id="updateTime"
  class="update-time"
>
</div>


<!-- =================================================
     Footer
================================================= -->

<div class="footer">

  實踐大學體育室

  <br>

  LINE 智慧服務中心

  <br>

  © Shih Chien University

</div>


</div>


<!-- =================================================
     LIFF SDK
================================================= -->

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<script>

/* =====================================================
   設定
===================================================== */


/* -----------------------------------------------------
   LIFF ID
----------------------------------------------------- */

const LIFF_ID =
  '2011024432-afjj4k3z';


/* -----------------------------------------------------
   GAS ③ Web App URL
----------------------------------------------------- */

const API_URL =
  'https://script.google.com/macros/s/AKfycbwyWQ_pv0Mfu7X9B46xALn8QaDMvbK22MHYINIZl1vMrLxJtwQmsGUU_Sx6UnA4AuyR/exec';


/* -----------------------------------------------------
   全部資料
----------------------------------------------------- */

let allVenueData = [];


/* -----------------------------------------------------
   目前場地
----------------------------------------------------- */

let selectedVenue = '';


/* -----------------------------------------------------
   LINE 使用者
----------------------------------------------------- */

let lineProfile = {

  userId: '',

  displayName: ''

};


/* -----------------------------------------------------
   星期順序
----------------------------------------------------- */

const DAYS = [

  '星期一',
  '星期二',
  '星期三',
  '星期四',
  '星期五',
  '星期六',
  '星期日'

];


/* =====================================================
   啟動
===================================================== */

window.addEventListener(
  'load',
  initLIFF
);


/* =====================================================
   LIFF 初始化
===================================================== */

async function initLIFF() {

  try {

    await liff.init({

      liffId: LIFF_ID

    });


    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }


    const profile =
      await liff.getProfile();


    lineProfile.userId =
      profile.userId || '';


    lineProfile.displayName =
      profile.displayName || '';


    document
      .getElementById('userStatus')
      .textContent =
        '您好，' +
        lineProfile.displayName +
        ' 👋';


    loadVenueData();


  } catch (error) {

    console.error(error);


    document
      .getElementById('userStatus')
      .textContent =
        'LINE 初始化失敗';


    showError(
      'LINE 初始化失敗：' +
      error.message
    );

  }

}


/* =====================================================
   載入 GAS 資料
===================================================== */

function loadVenueData() {

  showLoading();


  callAPI(

    {
      action: 'all'
    },

    function(result) {

      console.log(
        'GAS 原始回傳：',
        result
      );


      if (
        !result ||
        result.success !== true
      ) {

        showError(

          result &&
          result.error

            ? result.error

            : '無法取得場館資料'

        );

        return;

      }


      /*
       * 非常重要：
       * GAS data 有可能被包成字串
       */

      let data =
        result.data;


      if (
        typeof data === 'string'
      ) {

        try {

          data =
            JSON.parse(data);

        } catch (e) {

          console.error(
            'data JSON 解析失敗',
            e
          );

        }

      }


      if (
        !Array.isArray(data)
      ) {

        console.error(
          'GAS data 不是陣列：',
          data
        );


        showError(
          'GAS 回傳格式錯誤：data 不是陣列'
        );

        return;

      }


      /*
       * 整理資料
       */

      allVenueData =
        data.map(
          normalizeItem
        );


      console.log(
        '整理後資料：',
        allVenueData
      );


      buildVenueSelect();


      document
        .getElementById('result')
        .innerHTML =

          '<div class="empty">' +

          '請先選擇場地。' +

          '</div>';


      document
        .getElementById('tableCount')
        .textContent = '';


      updateTime();

    }

  );

}


/* =====================================================
   整理 GAS 每一筆資料
===================================================== */

function normalizeItem(item) {

  /*
   * 防止 item 本身不是物件
   */

  if (
    !item ||
    typeof item !== 'object'
  ) {

    return {

      weekday: '',

      name: '',

      time: '',

      status: ''

    };

  }


  /*
   * 支援不同欄位名稱
   *
   * 主要：
   * weekday / name / time / status
   *
   * 同時支援中文欄位
   */

  const weekday =
    getField(
      item,
      [
        'weekday',
        'weekDay',
        'day',
        '星期',
        '星期幾'
      ]
    );


  const name =
    getField(
      item,
      [
        'name',
        'venue',
        'venueName',
        '場地',
        '場館',
        '球場名稱'
      ]
    );


  const time =
    getField(
      item,
      [
        'time',
        'timeRange',
        '時段',
        '時間'
      ]
    );


  const status =
    getField(
      item,
      [
        'status',
        'state',
        'Status',
        '狀態'
      ]
    );


  return {

    weekday:
      String(
        weekday || ''
      ).trim(),

    name:
      String(
        name || ''
      ).trim(),

    time:
      normalizeTime(
        time
      ),

    status:
      String(
        status || ''
      ).trim()

  };

}


/* =====================================================
   取得欄位
===================================================== */

function getField(
  obj,
  fields
) {

  for (
    let i = 0;
    i < fields.length;
    i++
  ) {

    const key =
      fields[i];


    if (
      Object.prototype.hasOwnProperty.call(
        obj,
        key
      )
    ) {

      const value =
        obj[key];


      /*
       * 不接受 undefined / null
       */

      if (
        value !== undefined &&
        value !== null
      ) {

        return value;

      }

    }

  }


  return '';

}


/* =====================================================
   時間標準化
===================================================== */

function normalizeTime(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }


  /*
   * 如果 GAS 傳 Date
   */

  if (
    Object.prototype.toString.call(value)
      === '[object Date]'
  ) {

    return formatDateTime(value);

  }


  let text =
    String(value)
      .trim();


  /*
   * 移除前後空白
   */

  text =
    text.replace(
      /\s+/g,
      ' '
    );


  /*
   * 各種連字號統一
   */

  text =
    text.replace(
      /[－–—~～]/g,
      '-'
    );


  /*
   * 例如：
   *
   * 08:00 - 10:00
   * 8:00-10:00
   * 08：00－10：00
   */

  text =
    text.replace(
      /\s*-\s*/g,
      '-'
    );


  /*
   * 中文冒號轉半形
   */

  text =
    text.replace(
      /：/g,
      ':'
    );


  return text;

}


/* =====================================================
   Date 時間格式
===================================================== */

function formatDateTime(
  date
) {

  if (
    !date ||
    isNaN(date.getTime())
  ) {

    return '';

  }


  const h =
    String(
      date.getHours()
    ).padStart(
      2,
      '0'
    );


  const m =
    String(
      date.getMinutes()
    ).padStart(
      2,
      '0'
    );


  return h + ':' + m;

}


/* =====================================================
   建立場地選單
===================================================== */

function buildVenueSelect() {

  const select =
    document.getElementById(
      'venueSelect'
    );


  const venues = [];


  allVenueData.forEach(
    function(item) {

      const name =
        String(
          item.name || ''
        ).trim();


      if (
        name &&
        !venues.includes(name)
      ) {

        venues.push(name);

      }

    }
  );


  venues.sort(
    function(a, b) {

      return a.localeCompare(
        b,
        'zh-Hant'
      );

    }
  );


  select.innerHTML = '';


  const defaultOption =
    document.createElement(
      'option'
    );


  defaultOption.value = '';


  defaultOption.textContent =
    '請選擇場地';


  select.appendChild(
    defaultOption
  );


  venues.forEach(
    function(venue) {

      const option =
        document.createElement(
          'option'
        );


      option.value =
        venue;


      option.textContent =
        venue;


      select.appendChild(
        option
      );

    }
  );


  select.disabled =
    false;


  if (
    !venues.length
  ) {

    select.innerHTML =

      '<option value="">' +

      '目前沒有場地資料' +

      '</option>';


    select.disabled =
      true;

  }

}


/* =====================================================
   更換場地
===================================================== */

function changeVenue() {

  const select =
    document.getElementById(
      'venueSelect'
    );


  selectedVenue =
    select.value;


  if (
    !selectedVenue
  ) {

    document
      .getElementById(
        'currentVenue'
      )
      .style.display =
        'none';


    document
      .getElementById(
        'result'
      )
      .innerHTML =

        '<div class="empty">' +

        '請先選擇場地。' +

        '</div>';


    document
      .getElementById(
        'tableTitle'
      )
      .textContent =
        '場館使用狀況';


    document
      .getElementById(
        'tableCount'
      )
      .textContent =
        '';


    return;

  }


  const currentVenue =
    document.getElementById(
      'currentVenue'
    );


  currentVenue.style.display =
    'block';


  currentVenue.innerHTML =

    '目前查詢：<strong>' +

    escapeHTML(
      selectedVenue
    ) +

    '</strong>';


  renderSchedule();

}


/* =====================================================
   顯示星期一～星期日
===================================================== */

function renderSchedule() {


  /*
   * 只取得目前場地
   */

  const venueData =

    allVenueData.filter(
      function(item) {

        return (

          String(
            item.name || ''
          ).trim() ===
          selectedVenue

        );

      }
    );


  if (
    !venueData.length
  ) {

    document
      .getElementById('result')
      .innerHTML =

        '<div class="empty">' +

        '此場地目前沒有資料。' +

        '</div>';

    return;

  }


  let html = '';


  /*
   * 星期一～星期日
   */

  DAYS.forEach(
    function(day) {


      /*
       * 只抓這一天的資料
       */

      const dayData =

        venueData.filter(
          function(item) {

            return (

              normalizeDay(
                item.weekday
              ) === day

            );

          }
        );


      /*
       * 時間排序
       */

      dayData.sort(
        function(a, b) {

          return (

            getStartMinutes(
              a.time
            ) -

            getStartMinutes(
              b.time
            )

          );

        }
      );


      /*
       * 星期區塊
       */

      html +=

        '<div class="day-card">';


      html +=

        '<div class="day-header">' +

        day;


      if (
        dayData.length
      ) {

        html +=

          '<small>' +

          dayData.length +

          ' 個時段' +

          '</small>';

      }


      html +=

        '</div>';


      /*
       * 有資料
       */

      if (
        dayData.length
      ) {

        html +=

          '<div class="time-list">';


        dayData.forEach(
          function(item) {

            html +=

              '<div class="time-item">';


            /*
             * 時間
             */

            html +=

              '<div class="time-label">' +

              escapeHTML(
                item.time
              ) +

              '</div>';


            /*
             * 狀態
             */

            html +=

              createStatusHTML(
                item.status
              );


            html +=

              '</div>';

          }
        );


        html +=

          '</div>';

      }


      /*
       * 沒資料
       */

      else {

        html +=

          '<div class="day-empty">' +

          '本日沒有場館資料' +

          '</div>';

      }


      html +=

        '</div>';

    }
  );


  document
    .getElementById('result')
    .innerHTML =
      html;


  document
    .getElementById('tableTitle')
    .textContent =

      selectedVenue +
      ' 使用狀況';


  document
    .getElementById('tableCount')
    .textContent =

      venueData.length +
      ' 筆';

}


/* =====================================================
   狀態 HTML
===================================================== */

function createStatusHTML(
  status
) {


  /*
   * 最重要的 undefined 防護
   */

  let text = '';


  if (
    status !== undefined &&
    status !== null
  ) {

    text =
      String(status).trim();

  }


  /*
   * 如果真的沒有狀態
   */

  if (
    !text ||
    text.toLowerCase() ===
      'undefined' ||
    text.toLowerCase() ===
      'null'
  ) {

    text =
      '未提供狀態';

  }


  let className =
    'status-other';


  let icon =
    '⚪';


  /*
   * 上課
   */

  if (
    text === '上課'
  ) {

    className =
      'status-class';

    icon =
      '🔴';

  }


  /*
   * 可使用
   */

  else if (
    text === '可使用'
  ) {

    className =
      'status-available';

    icon =
      '🟢';

  }


  /*
   * 已預約
   */

  else if (
    text === '已預約'
  ) {

    className =
      'status-reserved';

    icon =
      '🟡';

  }


  return

    '<div class="status ' +
    className +
    '">' +

    '<span>' +
    icon +
    '</span>' +

    '<span>' +
    escapeHTML(text) +
    '</span>' +

    '</div>';

}


/* =====================================================
   星期標準化
===================================================== */

function normalizeDay(
  value
) {

  let text =
    String(
      value || ''
    ).trim();


  text =
    text.replace(
      /^週/,
      '星期'
    );


  text =
    text.replace(
      /^周/,
      '星期'
    );


  if (
    /^[一二三四五六日天]$/.test(
      text
    )
  ) {

    if (
      text === '天'
    ) {

      text = '日';

    }


    text =
      '星期' +
      text;

  }


  return text;

}


/* =====================================================
   時間排序
===================================================== */

function getStartMinutes(
  value
) {

  const text =
    String(
      value || ''
    ).trim();


  /*
   * 支援：
   *
   * 8:00-10:00
   * 08:00-10:00
   * 9:00-21:00
   * 12:00-14:00
   */

  const match =
    text.match(
      /(\d{1,2})\s*[:：]\s*(\d{1,2})/
    );


  if (
    !match
  ) {

    /*
     * 找不到時間時放最後
     */

    return 99999;

  }


  return (

    Number(match[1]) * 60 +

    Number(match[2])

  );

}


/* =====================================================
   JSONP API
===================================================== */

function callAPI(
  params,
  callback
) {


  const callbackName =

    'venueCallback_' +

    Date.now() +

    '_' +

    Math.floor(
      Math.random() * 100000
    );


  params.callback =
    callbackName;


  const query =

    Object.keys(params)

      .map(
        function(key) {

          return (

            encodeURIComponent(key) +

            '=' +

            encodeURIComponent(
              params[key]
            )

          );

        }
      )

      .join('&');


  const script =
    document.createElement(
      'script'
    );


  let finished =
    false;


  const timeout =

    setTimeout(
      function() {


        if (
          finished
        ) {

          return;

        }


        finished =
          true;


        cleanup();


        callback({

          success: false,

          error:
            'GAS ③ API 連線逾時'

        });


      },

      15000

    );


  window[callbackName] =

    function(data) {


      if (
        finished
      ) {

        return;

      }


      finished =
        true;


      clearTimeout(
        timeout
      );


      cleanup();


      console.log(
        'JSONP 回傳：',
        data
      );


      callback(
        data
      );

    };


  function cleanup() {

    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }


    try {

      delete window[
        callbackName
      ];

    } catch (e) {

      window[
        callbackName
      ] = undefined;

    }

  }


  script.onerror =

    function() {


      if (
        finished
      ) {

        return;

      }


      finished =
        true;


      clearTimeout(
        timeout
      );


      cleanup();


      callback({

        success: false,

        error:
          '無法連線至 GAS ③ API'

      });

    };


  /*
   * GAS API
   */

  script.src =

    API_URL +

    '?' +

    query;


  console.log(
    '呼叫 GAS：',
    script.src
  );


  document.body.appendChild(
    script
  );

}

/* =====================================================
   HTML 安全處理
===================================================== */

function escapeHTML(
  value
) {

  return String(

    value === null ||
    value === undefined

      ? ''

      : value

  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
